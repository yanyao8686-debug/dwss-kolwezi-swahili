name: Test DWSS canonical shared lexicon

on:
  pull_request:
    branches: [main]
    paths:
      - 'shared-lexicon.js'
      - 'scripts/prepare_dwss_0135_number_speed_french.py'
      - 'scripts/french-extension-0135.js'
      - 'scripts/test_dwss_0135_number_speed_french.cjs'
      - 'scripts/test_dwss_canonical_shared_lexicon.cjs'
      - 'scripts/test_dwss_offline_parity.cjs'
      - 'scripts/test_dwss_0144_pronunciation_query_editor.cjs'
      - 'scripts/test_dwss_0150_input-ime-fallback.cjs'
      - 'scripts/test_dwss_0151_french-mode-race.cjs'
      - 'scripts/test_dwss_0152_swahili-runtime.cjs'
      - 'scripts/test_dwss_0153_swahili-startup-race.cjs'
      - 'supabase/functions/dwss-upsert-dictionary-entry/index.ts'
      - 'supabase/migrations/20261113200000_unified_shared_dictionary_entries.sql'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Prepare production-equivalent build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dwss-build-venv"
          source "$RUNNER_TEMP/dwss-build-venv/bin/activate"
          python -m pip install --disable-pip-version-check --quiet pypinyin==0.53.0
          python3 -m py_compile scripts/prepare_dwss_0135_number_speed_french.py
          python3 scripts/prepare_dwss_0135_number_speed_french.py
          python3 -m py_compile scripts/prepare_dwss_0135_number_speed_french.py
          node --check public/app.js
          node --check public/sw.js
          node --check public/shared-lexicon.js
          node --check public/french-extension.js
          node --check public/french-translation-runtime.js
          node --check public/pronunciation-query-editor.js
          node --check public/pronunciation-search.js
          node --check scripts/test_dwss_0135_number_speed_french.cjs
          node --check scripts/test_dwss_canonical_shared_lexicon.cjs
          node --check scripts/test_dwss_offline_parity.cjs
          node --check scripts/test_dwss_0144_pronunciation_query_editor.cjs
          node --check scripts/test_dwss_0150_input-ime-fallback.cjs
          node --check scripts/test_dwss_0151_french-mode-race.cjs
          node --check scripts/test_dwss_0152_swahili-runtime.cjs
          node --check scripts/test_dwss_0153_swahili-startup-race.cjs

      - name: Run offline, edit, translation and reverse-lookup regression tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom@26.1.0
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0135_number_speed_french.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_canonical_shared_lexicon.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_offline_parity.cjs
          node scripts/test_dwss_0144_pronunciation_query_editor.cjs
          node scripts/test_dwss_0150_input-ime-fallback.cjs
          node scripts/test_dwss_0152_swahili-runtime.cjs
          node scripts/test_dwss_0153_swahili-startup-race.cjs
          node scripts/test_dwss_0151_french-mode-race.cjs
