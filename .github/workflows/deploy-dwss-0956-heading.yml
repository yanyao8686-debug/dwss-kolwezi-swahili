name: Deploy DWSS 0.9.56 single translation-heading text hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0956-heading.yml'
      - 'scripts/fix_dwss_0956_translation_heading.py'
      - 'scripts/test_dwss_0956_translation_heading.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://yanyao8686-debug.github.io/dwss-kolwezi-swahili/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fetch the verified live DWSS 0.9.55 package
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yanyao8686-debug.github.io/dwss-kolwezi-swahili"
          mkdir -p public
          curl -fsSL --retry 6 --retry-delay 2 --max-time 30 "$BASE/VERSION.txt?base=$GITHUB_SHA" -o public/VERSION.txt
          grep -Fq 'Version: 0.9.55' public/VERSION.txt
          for file in index.html boot.js app.js pwa.js sw.js dictionary-overrides.js shared-lexicon.js supabase.min.js dictionary.js.gz manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 5 --retry-delay 2 --max-time 60 "$BASE/$file?base=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
          cp -a public "$RUNNER_TEMP/dwss-0955-baseline"

      - name: Apply only the requested heading text
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_dwss_0956_translation_heading.py
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js; do
            node --check "public/$file"
          done
          DWSS_TEST_ROOT="$PWD/public" DWSS_BASE_ROOT="$RUNNER_TEMP/dwss-0955-baseline" node scripts/test_dwss_0956_translation_heading.cjs
          DWSS_TEST_ROOT="$PWD/public" node scripts/test_dwss_0955_release.cjs
          DWSS_TEST_ROOT="$PWD/public" node scripts/test_first_reading_0_9_54.cjs
          DWSS_TEST_ROOT="$PWD/public" node scripts/test_shared_offline_sync_0_9_53.cjs
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path
          p=Path("public")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if "id" in a: self.ids.append(a["id"])
                  for k in ("src","href"):
                      v=a.get(k,"")
                      if v and not v.startswith(("https://","http://","data:","#","mailto:")):
                          self.refs.append(v.split("?")[0])
          audit=Audit(); audit.feed((p/"index.html").read_text(encoding="utf-8"))
          duplicate={k:v for k,v in Counter(audit.ids).items() if v>1}
          missing=[v for v in audit.refs if not (p/v).exists()]
          if duplicate: raise SystemExit("duplicate HTML IDs: "+str(duplicate))
          if missing: raise SystemExit("missing local assets: "+str(missing))
          nav=(p/"index.html").read_text(encoding="utf-8").split('<nav class="tabs">',1)[1].split("</nav>",1)[0]
          if 'data-tab="dictionary"' in nav or nav.count("<button") != 3:
              raise SystemExit("main navigation differs from the verified three-action layout")
          print("PASS: unique HTML IDs, local assets present, original three-action navigation retained.")
          PY
          touch public/.nojekyll

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.56
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live single-heading hotfix
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yanyao8686-debug.github.io/dwss-kolwezi-swahili"
          TMP="$RUNNER_TEMP/dwss-live-0.9.56"
          mkdir -p "$TMP"
          for file in VERSION.txt index.html app.js sw.js pwa.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 30 "$BASE/$file?verify=$GITHUB_SHA" -o "$TMP/$file"
          done
          grep -Fq 'Version: 0.9.56' "$TMP/VERSION.txt"
          grep -Fq '<h2>斯语翻译中文谐音：</h2>' "$TMP/index.html"
          ! grep -Fq '<h2>翻译结果中文谐音：</h2>' "$TMP/index.html"
          grep -Fq '翻译结果中文谐音会显示在这里' "$TMP/app.js"
          grep -Fq "const APP_VERSION = '0.9.56';" "$TMP/sw.js"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_56' "$TMP/index.html"
          grep -Fq 'registration.update()' "$TMP/pwa.js"
          echo "PASS: live DWSS heading is updated; other page content remains unchanged and PWA auto-update is active."
