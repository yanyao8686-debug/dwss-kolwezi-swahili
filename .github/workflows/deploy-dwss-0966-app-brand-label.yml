name: Deploy DWSS 0.9.66 app-name label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0966-app-brand-label.yml'
      - 'scripts/fix_dwss_0966_app_brand_label.py'
      - 'scripts/test_dwss_0966_app_brand_label.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Fetch verified live DWSS 0.9.65 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          mkdir -p public
          curl -fsSL --retry 8 --retry-delay 2 --max-time 30 "$BASE/VERSION.txt?base=$GITHUB_SHA" -o public/VERSION.txt
          grep -Fq 'Version: 0.9.65' public/VERSION.txt
          for file in index.html boot.js app.js pwa.js sw.js dictionary-overrides.js shared-lexicon.js supabase.min.js dictionary.js.gz manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 6 --retry-delay 2 --max-time 60 "$BASE/$file?base=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
          grep -Fq "const APP_VERSION = '0.9.65';" public/sw.js
          gzip -t public/dictionary.js.gz
      - name: Change visible label to the app name
        run: python3 scripts/fix_dwss_0966_app_brand_label.py
      - name: Syntax, app label regression and local asset checks
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js; do
            node --check "public/$file"
          done
          DWSS_TEST_ROOT="$PWD/public" node scripts/test_dwss_0966_app_brand_label.cjs
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import gzip
          p=Path("public")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  for key in ("src","href"):
                      value=a.get(key,"")
                      if value and not value.startswith(("https://","http://","data:","#","mailto:")):
                          self.refs.append(value.split("?")[0])
          audit=Audit();audit.feed((p/"index.html").read_text(encoding="utf-8"))
          duplicate={k:v for k,v in Counter(audit.ids).items() if v>1}
          missing=[v for v in audit.refs if not (p/v).exists()]
          if duplicate:raise SystemExit("duplicate HTML IDs: "+str(duplicate))
          if missing:raise SystemExit("missing local assets: "+str(missing))
          dictionary=gzip.decompress((p/"dictionary.js.gz").read_bytes()).decode("utf-8")
          if "window.SW_DB" not in dictionary:raise SystemExit("invalid DWSS dictionary export")
          (p/".nojekyll").touch()
          print("PASS: unique HTML IDs, all local assets present, and dictionary gzip valid.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy DWSS 0.9.66
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live DWSS 0.9.66 app label and exact dictionary URL
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          TMP="$RUNNER_TEMP/dwss-live-0.9.66"
          mkdir -p "$TMP"
          for file in VERSION.txt index.html boot.js pwa.js sw.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 30 "$BASE/$file?verify=$GITHUB_SHA" -o "$TMP/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/dictionary.js.gz" -o "$TMP/dictionary.js.gz"
          grep -Fq 'Version: 0.9.66' "$TMP/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_66' "$TMP/index.html"
          grep -Fq '<meta name="dwss-auto-update" content="0.9.66">' "$TMP/index.html"
          grep -Fq '版本 0.9.66 · 刚果金斯语翻译' "$TMP/index.html"
          if grep -Fq 'DWSS 智能翻译 PWA' "$TMP/index.html"; then exit 1; fi
          grep -Fq '© 2026 刚果金斯语翻译/ 该应用由德威安全官陈谍匠心开发 · 保留所有权利' "$TMP/index.html"
          if grep -Fq '词库来自原始资料；当地读音尚待科卢韦齐母语者全面复核。' "$TMP/index.html"; then exit 1; fi
          if grep -Fq '软件版权、品牌归属与授权说明' "$TMP/index.html"; then exit 1; fi
          grep -Fq "const APP_VERSION = '0.9.66';" "$TMP/sw.js"
          gzip -t "$TMP/dictionary.js.gz"
          cmp -s public/dictionary.js.gz "$TMP/dictionary.js.gz"
          echo 'PASS: live 0.9.66 displays the requested app-name label, keeps prior footer edits, and serves the live dictionary.'
