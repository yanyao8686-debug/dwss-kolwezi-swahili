name: Probe official French-Chinese lexicon source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0972-daily-announcement-cover.yml'
      - 'scripts/probe_freedict_source_0116.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current live DWSS site
        run: |
          set -euo pipefail
          python3 scripts/probe_freedict_source_0116.py
