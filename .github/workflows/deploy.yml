      - name: Apply DWSS 0.9.13 product-quality fixes
        id: apply_release
        shell: bash
        run: |
          set +e
          run_stage() {
            label="$1"
            shift
            log="${RUNNER_TEMP}/dwss-${label}.log"
            "$@" > "$log" 2>&1
            result=$?
            cat "$log"
            if [ "$result" -ne 0 ]; then
              summary=$(tail -n 1 "$log" | tr '\n' ' ' | cut -c1-120)
              echo "error_summary=${label}: ${summary}" >> "$GITHUB_OUTPUT"
              return "$result"
            fi
            return 0
          }
          run_stage python-compile python3 -m py_compile scripts/refine_release_0_9_13.py || exit $?
          run_stage release-build python3 scripts/refine_release_0_9_13.py public || exit $?
          run_stage app-js-check node --check public/app.js || exit $?
          run_stage shared-js-check node --check public/shared-lexicon.js || exit $?
          run_stage service-worker-check node --check public/sw.js || exit $?
      - name: Validate DWSS 0.9.14 navigation, source variants, owner signature and sync
        id: validate_release
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "VALIDATION FAILED at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR
          ! grep -Fq '<header class="top">' public/index.html
          ! grep -Fq 'class="card pwa-card"' public/index.html
          grep -Fq 'class="status-strip"' public/index.html
          grep -Fq 'id="networkBadge"' public/index.html
          grep -Fq 'id="pwaState"' public/index.html
          grep -Fq 'id="checkUpdateBtn"' public/index.html
          grep -Fq 'id="pwaToast"' public/index.html
          grep -Fq 'class="pwa-toast"' public/index.html
          ! grep -Fq 'id="saveHistoryBtn"' public/index.html
          grep -Fq 'data-tab="maintenance"' public/index.html
          grep -Fq '<span>添加新词</span>' public/index.html
          grep -Fq '<span>历史记录</span>' public/index.html
          grep -Fq 'class="owner-signature"' public/index.html
          grep -Fq '德行四海' public/index.html
          grep -Fq '威震八方' public/index.html
          grep -Fq 'linear-gradient(125deg,#861326 0%,#bd2436 52%,#e34a3d 100%)' public/index.html
          grep -Fq 'if(saveHistoryBtn)' public/app.js
          grep -Fq 'id="history"' public/index.html
          python3 - <<'PY'
