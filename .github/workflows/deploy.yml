          if handler_start < 0:
              raise SystemExit("Update button click handler not found")
          handler_end = pwa.find("\n  });", handler_start)
          if handler_end < 0:
              raise SystemExit("Update button click handler end not found")
          handler_end += len("\n  });")
          new_handler = """  updateButton.addEventListener('click',async()=>{
            if(updateButton.dataset.updateReady==='1' && registration?.waiting){
              showFeedback('正在安装更新…');
              registration.waiting.postMessage({type:'DWSS_SKIP_WAITING'});
              return;
            }
            if(!updateServiceReady || !registration){
              setState('更新服务正在初始化','pwa-state-warn','更新服务仍在启动，请稍后重试。');
              showFeedback(message.textContent);
