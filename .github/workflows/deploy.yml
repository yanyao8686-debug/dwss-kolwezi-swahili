              ("首次打开请保持网络连接，等待页面、完整词库、封面和图标缓存完成。缓存成功后，后续可断网使用。","首次打开请保持联网，待缓存完成后即可离线使用。"),
              ("DWSS 已添加到手机桌面。请打开一次并确认离线资源已缓存；以后可断网使用。","已添加到桌面。首次启动请等待缓存完成。"),
              ("当前网址不是安全 HTTPS 连接，浏览器不能启用离线缓存和版本检查。请使用 DWSS 官方 HTTPS 网址。","请使用官方 HTTPS 地址，以启用离线缓存和更新。"),
