name: Deploy DWSS PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'DWSS_PWA_0.6.3_GitHubPages_发布包.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify and unpack the DWSS 0.6.3 release
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="DWSS_PWA_0.6.3_GitHubPages_发布包.zip"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null
          mkdir -p public
          unzip -q "$ARCHIVE" -d public
          test -s public/index.html
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/dictionary.js.gz
          test -s public/french-fallback.js
          test -s public/VERSION.txt
          grep -q "Version: 0.6.3" public/VERSION.txt
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
