              ("更新检查服务已连接。正在完成首次离线缓存；请保持网络并稍后重新打开一次软件，再测试断网使用。","正在缓存资源，请保持联网并稍后重新打开。"),
              ("浏览器未能注册离线更新服务。请确认使用官方 HTTPS 地址、网络正常，并尝试刷新页面；若使用微信等内置浏览器，请改用 Chrome 或 Safari。","离线更新服务连接失败。请检查网络后刷新；建议使用 Chrome 或 Safari。"),
              ("请通过 HTTPS 官方网址打开本软件，浏览器才能启用 PWA 离线缓存和版本更新检查。","请使用官方 HTTPS 地址，以启用离线缓存和更新。"),
              ("当前浏览器不支持 Service Worker。请使用最新版 Android Chrome 或 iPhone Safari 打开 DWSS 官方 HTTPS 网址。","当前浏览器不支持离线更新，请使用最新版 Chrome 或 Safari。"),
              ("有新的 DWSS 软件版本已下载。点击“安装软件更新”后将刷新页面。更新不会主动删除本机自定义词库，但仍建议先备份。","新版本已下载。点击“安装软件更新”刷新；建议先备份个人词条。"),
              ("页面刚打开时，浏览器需要先注册离线更新服务。请等待几秒后再点“检查更新”；如果按钮仍不可用，请刷新官方 HTTPS 页面或换用 Chrome / Safari。","更新服务仍在启动，请稍后重试。"),
              ("没有网络，无法检查服务器更新；已缓存的软件仍可继续使用。","离线状态无法检查更新；已缓存版本仍可使用。"),
              ("正在联系 DWSS 官方网站检查是否有新版本，请稍候。","正在检查更新…"),
