          pwa = pwa[:handler_start] + new_handler + pwa[handler_end:]

          if "window.addEventListener('load',async()=>" in pwa:
              raise SystemExit("Old late-load-only PWA initializer remains")
          if "document.readyState==='complete'" not in pwa or "showFeedback(message.textContent)" not in pwa:
              raise SystemExit("PWA initialization or feedback fix incomplete")
          pwa_replacements = [
              ("当前没有网络连接。已缓存的词库查询、短句匹配和个人词库维护仍可在本机使用；联网后才能检查更新。","离线可查询已缓存词库；联网后检查更新。"),
