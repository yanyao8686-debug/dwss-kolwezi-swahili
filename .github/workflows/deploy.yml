          if "DWSS 0.9.36" not in html: raise SystemExit("Expected HTML release base 0.9.36")
          html=html.replace("DWSS 0.9.36","DWSS 0.9.37")
          write("index.html",html)

          version=read("VERSION.txt")
          if "Version: 0.9.36" not in version: raise SystemExit("Expected VERSION.txt 0.9.36")
          version=version.replace("Version: 0.9.36","Version: 0.9.37",1)
          version += "\nHardening: corrupted personal dictionary data is preserved and made read-only until recovery; failed delete/copy operations report honestly; category and backup controls have accessible names.\n"
          write("VERSION.txt",version)
          sw=once(read("sw.js"),"const APP_VERSION = '0.9.36';","const APP_VERSION = '0.9.37';","Service Worker cache namespace")
          write("sw.js",sw)

          assert "customStorageUnreadable=true" in app
          assert "slice(-MAX_CUSTOM_ENTRIES)" not in app
          assert "Refusing to overwrite unreadable custom dictionary data" in app
          assert "保存失败，词条未删除" in app
          assert "复制失败，请手动选择文本" in app
          assert 'aria-label="按分类筛选词条"' in html
          assert 'aria-label="个人词库导出备份内容"' in html
          assert 'id="storageRecoveryAlert"' in html
          assert "Version: 0.9.37" in version
          assert "const APP_VERSION = '0.9.37';" in sw
          print("PASS: DWSS 0.9.37 custom-data protection and accessibility.")
          PY
          node --check public/app.js
          node --check public/boot.js
          node --check public/sw.js
      - name: Apply DWSS 0.9.38 Swahili-first translation and automatic sharing
        id: swahili_priority
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/harden_translation_priority_0_9_38.py
          node --check public/app.js
          node --check public/sw.js
          node scripts/test_translation_priority_0_9_38.cjs
      - name: Apply DWSS 0.9.39 all-user shared vocabulary policy
        id: shared_auto_publish
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/harden_shared_auto_publish_0_9_39.py
          node --check public/app.js
          node --check public/shared-lexicon.js
          node --check public/sw.js
          node scripts/test_shared_auto_publish_0_9_39.cjs
      - name: Apply DWSS 0.9.40 personal/shared sync status and retry controls
        id: share_sync_fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_personal_share_sync_0_9_40.py
          node --check public/app.js
          node --check public/shared-lexicon.js
          node --check public/sw.js
          node scripts/test_personal_share_sync_0_9_40.cjs
      - name: Enforce Chinese pronunciation for new local Swahili terms (0.9.41)
        id: swahili_entry_guard
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_swahili_entry_guard_0_9_41.py
          node --check public/app.js
          node --check public/shared-lexicon.js
          node --check public/sw.js
          node scripts/test_personal_add_share_translate_0_9_41.cjs
      - name: Upload Pages artifact
        id: upload_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages assets and publish commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CONFIGURE_PAGES_OUTCOME: ${{ steps.configure_pages.outcome }}
          UNPACK_OUTCOME: ${{ steps.verify_unpack.outcome }}
          COMPACT_UI_OUTCOME: ${{ steps.compact_ui.outcome }}
          APPLY_RELEASE_OUTCOME: ${{ steps.apply_release.outcome }}
          APPLY_RELEASE_ERROR: ${{ steps.apply_release.outputs.error_summary }}
          HARDEN_OUTCOME: ${{ steps.harden_0_9_36.outcome }}
          HARDEN_037_OUTCOME: ${{ steps.harden_0_9_37.outcome }}
          SWAHILI_PRIORITY_OUTCOME: ${{ steps.swahili_priority.outcome }}
          SHARED_AUTO_PUBLISH_OUTCOME: ${{ steps.shared_auto_publish.outcome }}
          SHARE_SYNC_FIX_OUTCOME: ${{ steps.share_sync_fix.outcome }}
          SWAHILI_ENTRY_GUARD_OUTCOME: ${{ steps.swahili_entry_guard.outcome }}
          VALIDATE_RELEASE_OUTCOME: ${{ steps.validate_release.outcome }}
          AUDIT_DOM_OUTCOME: ${{ steps.audit_dom.outcome }}
          UPLOAD_ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
        run: |
          set -uo pipefail
          STATE=failure
          FAILURE_REASON="deploy-outcome=${DEPLOY_OUTCOME}"
          for entry in "checkout:${CHECKOUT_OUTCOME}" "configure-pages:${CONFIGURE_PAGES_OUTCOME}" "unpack:${UNPACK_OUTCOME}" "compact-ui:${COMPACT_UI_OUTCOME}" "apply-release:${APPLY_RELEASE_OUTCOME}" "hardening:${HARDEN_OUTCOME}" "hardening-0.9.37:${HARDEN_037_OUTCOME}" "swahili-priority:${SWAHILI_PRIORITY_OUTCOME}" "shared-auto-publish:${SHARED_AUTO_PUBLISH_OUTCOME}" "share-sync-fix:${SHARE_SYNC_FIX_OUTCOME}" "swahili-entry-guard:${SWAHILI_ENTRY_GUARD_OUTCOME}" "validate-release:${VALIDATE_RELEASE_OUTCOME}" "audit-dom:${AUDIT_DOM_OUTCOME}" "upload-artifact:${UPLOAD_ARTIFACT_OUTCOME}" "deploy:${DEPLOY_OUTCOME}"; do
            STEP_NAME="${entry%%:*}"
            STEP_RESULT="${entry#*:}"
            if [ "$STEP_RESULT" = "failure" ] || [ "$STEP_RESULT" = "cancelled" ]; then
              FAILURE_REASON="${STEP_NAME}-${STEP_RESULT}"
              if [ "$STEP_NAME" = "apply-release" ] && [ -n "${APPLY_RELEASE_ERROR}" ]; then
                FAILURE_REASON="apply-release: ${APPLY_RELEASE_ERROR}"
              fi
              break
            fi
          done
          BASE_URL="${PAGE_URL:-https://yanyao8686-debug.github.io/dwss-kolwezi-swahili/}"
          BASE_URL="${BASE_URL%/}"
          TMP="${RUNNER_TEMP}/dwss-pages-check"
          mkdir -p "$TMP"

          if [ "${DEPLOY_OUTCOME}" = "success" ]; then
            for attempt in $(seq 1 24); do
              if curl -fsSL --max-time 20 "${BASE_URL}/VERSION.txt?verify=${GITHUB_SHA}" -o "$TMP/VERSION.txt" \
                && curl -fsSL --max-time 20 "${BASE_URL}/index.html?verify=${GITHUB_SHA}" -o "$TMP/index.html" \
                && curl -fsSL --max-time 20 "${BASE_URL}/app.js?verify=${GITHUB_SHA}" -o "$TMP/app.js" \
                && curl -fsSL --max-time 20 "${BASE_URL}/sw.js?verify=${GITHUB_SHA}" -o "$TMP/sw.js" \
                && curl -fsSL --max-time 20 "${BASE_URL}/dictionary.js.gz?verify=${GITHUB_SHA}" -o "$TMP/dictionary.js.gz" \
                && curl -fsSL --max-time 20 "${BASE_URL}/boot.js?verify=${GITHUB_SHA}" -o "$TMP/boot.js" \
                && curl -fsSL --max-time 20 "${BASE_URL}/cover.jpg?verify=${GITHUB_SHA}" -o "$TMP/cover.jpg" \
                && curl -fsSL --max-time 20 "${BASE_URL}/cover.webp?verify=${GITHUB_SHA}" -o "$TMP/cover.webp"; then
                LIVE_COVER_VALID=0
                if python3 -c 'import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes(); w=(int.from_bytes(b[26:28],"little") & 0x3fff) if len(b)>=30 else 0; h=(int.from_bytes(b[28:30],"little") & 0x3fff) if len(b)>=30 else 0; sys.exit(0 if len(b)>=150000 and b[:4]==b"RIFF" and b[8:12]==b"WEBP" and b[12:16]==b"VP8 " and b[23:26]==bytes((0x9d,0x01,0x2a)) and w==1536 and h==1536 else 1)' "$TMP/cover.webp"; then
                  LIVE_COVER_VALID=1
                fi
                                echo "LIVE_DIAGNOSTICS:"
                echo "VERSION=$(grep -E 'Version: 0.9.[0-9]+' "$TMP/VERSION.txt" | head -1 || true)"
                echo "INDEX_MARKERS=$(grep -o 'DWSS 0.9.[0-9][0-9]' "$TMP/index.html" | sort -u | tr '\n' ';' || true)"
                echo "APP_VERSION=$(grep -o "version:'0.9.[0-9][0-9]'" "$TMP/app.js" | head -1 || true)"
                echo "SW_VERSION=$(grep -o "const APP_VERSION = '0.9.[0-9][0-9]';" "$TMP/sw.js" | head -1 || true)"
                echo "RANK_POLICY=$(grep -Fc 'const rankOf={personal:0,shared:1,builtin:2};' "$TMP/app.js" || true)"
                echo "FRENCH_GUARD=$(grep -Fc 'if(lookupLocalAt(input,index))return null;' "$TMP/app.js" || true)"
                echo "SHARED_HELPER=$(grep -Fc 'function needsAutomaticShare(entry)' "$TMP/shared-lexicon.js" || true)"
                echo "SHARED_AUTO_RULE=$(grep -Fc 'return hasLocalSwahiliReading || [\"pending\", \"queued\"].includes(status);' "$TMP/shared-lexicon.js" || true)"
                echo "SHARED_NOTES_NULL=$(grep -Fc 'notes: null' "$TMP/shared-lexicon.js" || true)"
                echo "DETAIL_LABEL=$(grep -Fc '单个斯语读法释义（点击加号展开）：' "$TMP/index.html" || true)"
                echo "DETAIL_STYLE=$(grep -Fc 'text-decoration-color:#ff4b12!important' "$TMP/index.html" || true)"
                if [ "$LIVE_COVER_VALID" = "1" ] && grep -Fq "Version: 0.9.41" "$TMP/VERSION.txt" \
                  && grep -Fq "DWSS 0.9.41" "$TMP/index.html" \
                  && grep -Fq 'id="translationWorkspace"' "$TMP/index.html" \
                  && grep -Fq 'id="samples" hidden' "$TMP/index.html" \
                  && grep -Fq 'src="cover.webp"' "$TMP/index.html" \
                  && grep -Fq 'color:#ff4b12!important' "$TMP/index.html" \
                  && grep -Fq 'white-space:nowrap!important' "$TMP/index.html" \
                  && grep -Fq 'text-decoration-line:underline!important' "$TMP/index.html" \
                  && grep -Fq "font-size:16px!important" "$TMP/index.html" \
                  && grep -Fq '.cover-frame .owner-signature{display:none!important}' "$TMP/index.html" \
                  && grep -Fq "version:'0.9.41'" "$TMP/app.js" \
                  && grep -Fq "const APP_VERSION = '0.9.41';" "$TMP/sw.js" \
                  && curl -fsSL --max-time 20 "${BASE_URL}/shared-lexicon.js?verify=${GITHUB_SHA}" -o "$TMP/shared-lexicon.js" \
                  && grep -Fq "function needsAutomaticShare(entry)" "$TMP/shared-lexicon.js" \
                  && grep -Fq "return hasLocalSwahiliReading || [\"pending\", \"queued\"].includes(status);" "$TMP/shared-lexicon.js" \
                  && grep -Fq "retryPending: retryPendingSync" "$TMP/shared-lexicon.js" \
                  && grep -Fq "function retryPendingSync()" "$TMP/shared-lexicon.js" \
                  && grep -Fq "function customShareStatusLabel(entry)" "$TMP/app.js" \
                  && grep -Fq "共享状态：" "$TMP/app.js" \
                  && grep -Fq 'id="retrySharedSync"' "$TMP/index.html" \
                  && grep -Fq '当地斯语中文谐音（斯语词条必填）' "$TMP/index.html" \
                  && [ "$(grep -Fc 'notes: null' "$TMP/shared-lexicon.js")" -ge 2 ] \
                  && grep -Fq "const rankOf={personal:0,shared:1,builtin:2};" "$TMP/app.js" \
                  && grep -Fq "if(lookupLocalAt(input,index))return null;" "$TMP/app.js" \
                  && grep -Fq "单个斯语读法释义（点击加号展开）：" "$TMP/index.html" \
                  && grep -Fq "text-decoration-color:#ff4b12!important" "$TMP/index.html" \
                  && grep -Fq "清除网站数据会删除本机自定义词条" "$TMP/boot.js" \
                  && ! grep -Fq '等待输入' "$TMP/app.js" \
              && grep -Fq 'background:#F7E3A0!important' "$TMP/index.html" \
              && grep -Fq 'id="dwss-autogrow-input"' "$TMP/index.html" \
              && grep -Fq 'class="nav-clear-slot"' "$TMP/index.html" \
              && grep -Fq 'color:#ff4b12!important' "$TMP/index.html" \
              && grep -Fq '#resultCard>.copyline{display:none!important}' "$TMP/index.html" \
              && grep -Fq 'overflow-y:hidden;resize:none' "$TMP/index.html" \
              && grep -Fq 'min-height:88px' "$TMP/index.html" \
                  && grep -Fq "scheduleDwssLiveTranslation" "$TMP/app.js" \
                  && grep -Fq "'compositionstart'" "$TMP/app.js" \
                  && grep -Fq "'compositionend'" "$TMP/app.js" \
                  && test -s "$TMP/dictionary.js.gz" \
                  && test -s "$TMP/cover.jpg" \
                  && test -s "$TMP/cover.webp" \
                  && [ "$(stat -c%s "$TMP/cover.webp")" -ge 150000 ] \
                  && [ "$(sha256sum "$TMP/cover.webp" | cut -d' ' -f1)" = "$(sha256sum custom-cover.webp | cut -d' ' -f1)" ]; then
                  STATE=success
                  FAILURE_REASON="all live assets match 0.9.41"
                  break
                else
                  FAILURE_REASON="live asset content or version mismatch"
                fi
              else
                FAILURE_REASON="one or more live Pages assets returned HTTP error"
              fi
              echo "Pages verification: ${FAILURE_REASON} (attempt ${attempt}/24); retrying."
              sleep 5
            done
          fi

          if [ "$STATE" = "success" ]; then
            DESCRIPTION="DWSS 0.9.41 live Pages assets verified"
          else
            DESCRIPTION="DWSS verification failed: ${FAILURE_REASON}"
          fi
          export STATUS_STATE="$STATE" STATUS_DESCRIPTION="$DESCRIPTION" STATUS_TARGET="$BASE_URL" STATUS_REASON="$FAILURE_REASON"
          python3 - <<'PY' > "$TMP/status.json"
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "DWSS Pages verify: " + os.environ["STATUS_REASON"],
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": os.environ["STATUS_TARGET"]
          }))
          PY

          STATUS_HTTP=$(curl -sS --max-time 20 -o "$TMP/status-response.json" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d @"$TMP/status.json") || STATUS_HTTP=000
          echo "DWSS deployment verification state: ${STATE}; GitHub status API: ${STATUS_HTTP}"
          cat "$TMP/status-response.json" || true
          case "$STATUS_HTTP" in
            2*) ;;
            *) echo "Could not publish the deployment verification status."; exit 1 ;;
          esac
          if [ "$STATE" != "success" ]; then exit 1; fi
