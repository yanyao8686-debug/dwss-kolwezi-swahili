      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages assets and publish commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CONFIGURE_PAGES_OUTCOME: ${{ steps.configure_pages.outcome }}
          UNPACK_OUTCOME: ${{ steps.verify_unpack.outcome }}
          COMPACT_UI_OUTCOME: ${{ steps.compact_ui.outcome }}
          APPLY_RELEASE_OUTCOME: ${{ steps.apply_release.outcome }}
          APPLY_RELEASE_ERROR: ${{ steps.apply_release.outputs.error_summary }}
          VALIDATE_RELEASE_OUTCOME: ${{ steps.validate_release.outcome }}
          AUDIT_DOM_OUTCOME: ${{ steps.audit_dom.outcome }}
          UPLOAD_ARTIFACT_OUTCOME: ${{ steps.upload_artifact.outcome }}
        run: |
          set -uo pipefail
          STATE=failure
          FAILURE_REASON="deploy-outcome=${DEPLOY_OUTCOME}"
          for entry in "checkout:${CHECKOUT_OUTCOME}" "configure-pages:${CONFIGURE_PAGES_OUTCOME}" "unpack:${UNPACK_OUTCOME}" "compact-ui:${COMPACT_UI_OUTCOME}" "apply-release:${APPLY_RELEASE_OUTCOME}" "validate-release:${VALIDATE_RELEASE_OUTCOME}" "audit-dom:${AUDIT_DOM_OUTCOME}" "upload-artifact:${UPLOAD_ARTIFACT_OUTCOME}" "deploy:${DEPLOY_OUTCOME}"; do
            STEP_NAME="${entry%%:*}"
            STEP_RESULT="${entry#*:}"
            if [ "$STEP_RESULT" = "failure" ] || [ "$STEP_RESULT" = "cancelled" ]; then
              FAILURE_REASON="${STEP_NAME}-${STEP_RESULT}"
              if [ "$STEP_NAME" = "apply-release" ] && [ -n "${APPLY_RELEASE_ERROR}" ]; then
                FAILURE_REASON="apply-release: ${APPLY_RELEASE_ERROR}"
              fi
              break
            fi
          done
          BASE_URL="${PAGE_URL:-https://yanyao8686-debug.github.io/dwss-kolwezi-swahili/}"
          BASE_URL="${BASE_URL%/}"
          TMP="${RUNNER_TEMP}/dwss-pages-check"
          mkdir -p "$TMP"

          if [ "${DEPLOY_OUTCOME}" = "success" ]; then
            for attempt in $(seq 1 24); do
              if curl -fsSL --max-time 20 "${BASE_URL}/VERSION.txt?verify=${GITHUB_SHA}" -o "$TMP/VERSION.txt" \
                && curl -fsSL --max-time 20 "${BASE_URL}/index.html?verify=${GITHUB_SHA}" -o "$TMP/index.html" \
                && curl -fsSL --max-time 20 "${BASE_URL}/app.js?verify=${GITHUB_SHA}" -o "$TMP/app.js" \
                && curl -fsSL --max-time 20 "${BASE_URL}/dictionary.js.gz?verify=${GITHUB_SHA}" -o "$TMP/dictionary.js.gz" \
                && curl -fsSL --max-time 20 "${BASE_URL}/cover.jpg?verify=${GITHUB_SHA}" -o "$TMP/cover.jpg" \
                && curl -fsSL --max-time 20 "${BASE_URL}/cover.webp?verify=${GITHUB_SHA}" -o "$TMP/cover.webp"; then
                if grep -Fq "Version: 0.9.33" "$TMP/VERSION.txt" \
                  && grep -Fq "DWSS 0.9.33" "$TMP/index.html" \
                  && grep -Fq 'id="translationWorkspace"' "$TMP/index.html" \
                  && grep -Fq 'id="samples" hidden' "$TMP/index.html" \
                  && grep -Fq 'src="cover.webp"' "$TMP/index.html" \
                  && grep -Fq 'color:#ff4b12!important' "$TMP/index.html" \
                  && grep -Fq 'white-space:nowrap!important' "$TMP/index.html" \
                  && grep -Fq 'text-decoration-line:underline!important' "$TMP/index.html" \
                  && grep -Fq '.cover-frame .owner-signature{display:none!important}' "$TMP/index.html" \
                  && ! grep -Fq '等待输入' "$TMP/app.js" \
              && grep -Fq 'background:#F7E3A0!important' "$TMP/index.html" \
              && grep -Fq 'id="dwss-autogrow-input"' "$TMP/index.html" \
              && grep -Fq 'class="nav-clear-slot"' "$TMP/index.html" \
              && grep -Fq 'color:#ff4b12!important' "$TMP/index.html" \
              && grep -Fq '#resultCard>.copyline{display:none!important}' "$TMP/index.html" \
              && grep -Fq 'overflow-y:hidden;resize:none' "$TMP/index.html" \
              && grep -Fq 'min-height:88px' "$TMP/index.html" \
                  && grep -Fq "scheduleDwssLiveTranslation" "$TMP/app.js" \
                  && grep -Fq "'compositionstart'" "$TMP/app.js" \
                  && grep -Fq "'compositionend'" "$TMP/app.js" \
                  && test -s "$TMP/dictionary.js.gz" \
                  && test -s "$TMP/cover.jpg" \
                  && test -s "$TMP/cover.webp"; then
                  STATE=success
                  FAILURE_REASON="all live assets match 0.9.33"
                  break
                else
                  FAILURE_REASON="live asset content or version mismatch"
                fi
              else
                FAILURE_REASON="one or more live Pages assets returned HTTP error"
              fi
              echo "Pages verification: ${FAILURE_REASON} (attempt ${attempt}/24); retrying."
              sleep 5
            done
          fi

          if [ "$STATE" = "success" ]; then
            DESCRIPTION="DWSS 0.9.33 live Pages assets verified"
          else
            DESCRIPTION="DWSS verification failed: ${FAILURE_REASON}"
          fi
          export STATUS_STATE="$STATE" STATUS_DESCRIPTION="$DESCRIPTION" STATUS_TARGET="$BASE_URL" STATUS_REASON="$FAILURE_REASON"
          python3 - <<'PY' > "$TMP/status.json"
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "context": "DWSS Pages verify: " + os.environ["STATUS_REASON"],
              "description": os.environ["STATUS_DESCRIPTION"],
              "target_url": os.environ["STATUS_TARGET"]
          }))
          PY

          STATUS_HTTP=$(curl -sS --max-time 20 -o "$TMP/status-response.json" -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d @"$TMP/status.json") || STATUS_HTTP=000
          echo "DWSS deployment verification state: ${STATE}; GitHub status API: ${STATUS_HTTP}"
          cat "$TMP/status-response.json" || true
          case "$STATUS_HTTP" in
            2*) ;;
            *) echo "Could not publish the deployment verification status."; exit 1 ;;
          esac
          if [ "$STATE" != "success" ]; then exit 1; fi
