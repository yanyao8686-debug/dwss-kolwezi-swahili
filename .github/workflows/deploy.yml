              ("虽然设备显示已联网，但更新服务器暂时没有响应。请稍后重试；当前已缓存版本仍可使用。","暂时无法连接更新服务器，请稍后重试。")
          ]
          for old, new in pwa_replacements:
              pwa = pwa.replace(old, new, 1)
          old_border = "networkBadge.style.borderColor=online?'#ffffff70':'#ffdf9a';"
          old_color = "networkBadge.style.color=online?'#e6fff3':'#ffdf9a';"
          if old_border not in pwa or old_color not in pwa:
              raise SystemExit("Network status color anchors missing")
          pwa = pwa.replace(old_border, "networkBadge.style.borderColor=online?'#c9d9d3':'#e6c98b';", 1)
          pwa = pwa.replace(old_color, "networkBadge.style.color=online?'#245c48':'#9a6a1e';", 1)
          write("pwa.js", pwa)

          # Compact the translation result while keeping candidate selection intact.
          app = read("app.js")
          new_recommend = '''function renderUnknownRecommendations(segment,contextText=''){
           const candidates=recommendAlternativesForUnknown(segment.text,contextText);
           if(!candidates.length)return \`<div class="recommendation-box"><div class="recommendation-title">相关候选</div><div class="candidate-intro">暂未找到可靠候选，可换种说法或补充词条。</div></div>\`;
           return \`<div class="recommendation-box"><div class="recommendation-title">相关候选</div><div class="candidate-intro">仅供参考 · 选择后替换并重新翻译</div><div class="recommendation-list">\${candidates.map(c=>\`<div class="recommendation-item"><div class="recommendation-main"><b>\${esc(c.item.zh)}</b><span>\${esc(c.reading)}</span><div class="candidate-meta">\${esc(c.kind)} · \${esc(c.contextLabel)}\${c.reading&&!c.reading.startsWith('拉丁拼写：')?' · 读音待核':''}</div><details class="candidate-extra"><summary>更多信息</summary><div>\${esc(c.note||'请结合上下文确认')} · 来源：\${esc(c.source)}</div></details></div><button class="soft mini" type="button" data-recommend-start="\${Number(segment.start)||0}" data-recommend-end="\${Number(segment.end)||0}" data-recommend-target="\${esc(c.item.zh)}">替换</button></div>\`).join('')}</div></div>\`;
          }'''
          new_recommend = new_recommend.replace("\\`", "`").replace("\\${", "${")
          app, n = re.subn(r"function renderUnknownRecommendations\(segment,contextText=''\)\{.*?\n\}", lambda _: new_recommend, app, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Recommendation renderer: expected one function, found {n}")
          segment_pattern = r"\$\('segmentList'\)\.innerHTML=r\.segments\.map\(s=>\{.*?\}\)\.join\(''\)\|\|'<div class=\"nores\">没有匹配结果</div>';"
          new_segment = '''$('segmentList').innerHTML=r.segments.map(s=>{
            if(s.type==='punct')return '';
            if(s.type==='local'){
             const alts=uniqueLocalVariants(s.item).filter(v=>norm(v.reading)!==norm(s.reading));
             const latinHtml=s.latin.length?\`<div class="src">拼写：\${esc(s.latin.join(' / '))}</div>\`:'';
             const aliasHtml=s.matchedBy==='近义替代'?\`<div class="src alias-note">近义替代：\${esc(s.originalTerm)} → \${esc(s.canonical)}\${s.aliasCaution?' · 请确认语境':''}</div>\`:'';
             const detailParts=[];
             if(s.source)detailParts.push('来源：'+s.source);
             if(alts.length)detailParts.push('其他读音：'+alts.map(v=>v.reading+'（'+v.source+'）').join('；')+'；请核对当地用法');
             const detailHtml=detailParts.length?\`<details class="segment-meta"><summary>更多信息</summary><div class="src">\${esc(detailParts.join(' · '))}</div></details>\`:'';
             return \`<div class="seg"><div class="zh">\${esc(s.zh)}</div><div class="rd">\${esc(s.reading)}\${latinHtml}\${aliasHtml}\${detailHtml}</div></div>\`;
            }
            if(s.type==='french')return \`<div class="seg french-fallback"><div class="zh">\${esc(s.zh)}</div><div class="rd">\${esc(s.frenchReadingZh||frenchReadingFor(s.french))}（法语）<details class="segment-meta"><summary>查看法语原文</summary><div class="src">\${esc(s.french)} · 法语备用，不是当地斯语；中文读音仅作近似提示。</div></details></div></div>\`;
            if(s.type==='latinOnly')return \`<div class="seg unknown"><div class="zh">\${esc(s.zh)}</div><div class="rd">\${esc(s.latin.join(' / '))}<div class="src">中文谐音待补</div></div></div>\`;
            return \`<div class="seg unknown"><div class="zh">\${esc(s.text)}</div><div class="rd">未收录 · 暂不自动猜译\${renderUnknownRecommendations(s,raw)}</div></div>\`;
           }).join('')||'<div class="nores">没有匹配词条</div>';'''
          new_segment = new_segment.replace("\\`", "`").replace("\\${", "${")
          app, n = re.subn(segment_pattern, lambda _: new_segment, app, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Segment renderer: expected one block, found {n}")
          for old, new, label in [
              ("当地斯语覆盖：\${pct}%（按字符估算）", "本地覆盖约 \${pct}%", "coverage chip"),
              ("当地词条 \${r.localHits} 段 · 法语补位 \${r.frenchHits} 段 · 未收录 \${r.unknownChars} 字", "本地 \${r.localHits} · 法语 \${r.frenchHits} · 未收录 \${r.unknownChars}", "match chip"),
              ("输入中文后，显示当地斯语命中、法语补位和仍未收录的部分。", "输入后显示匹配结果与未收录内容。", "empty result hint")
          ]:
              old = old.replace("\\${", "${")
              new = new.replace("\\${", "${")
              if old not in app:
                  raise SystemExit(f"Missing app copy: {label}")
              app = app.replace(old, new, 1)
          old_history_listener = "$('saveHistoryBtn').addEventListener('click',()=>{const t=$('inputText').value.trim();if(t)saveRecent(t);});"
          new_history_listener = "const saveHistoryBtn=$('saveHistoryBtn');if(saveHistoryBtn)saveHistoryBtn.addEventListener('click',()=>{const t=$('inputText').value.trim();if(t)saveRecent(t);});"
          if old_history_listener not in app:
              raise SystemExit("Save-to-history event binding not found")
          app = app.replace(old_history_listener, new_history_listener, 1)
          write("app.js", app)

          # Cache bust, so installed PWAs fetch the new interface.
          sw = read("sw.js")
          sw, n = re.subn(r"const APP_VERSION = '0\.9\.0';", "const APP_VERSION = '0.9.7';", sw, count=1)
          if n != 1:
              raise SystemExit("Service-worker version anchor missing")
          write("sw.js", sw)
          version = read("VERSION.txt")
          version, n = re.subn(r"Version: 0\.9\.0", "Version: 0.9.7", version, count=1)
          if n != 1:
              raise SystemExit("Version file anchor missing")
          write("VERSION.txt", version)
          app = read("app.js")
          required_dynamic = [
              "textContent=`本地覆盖约 ${pct}%`",
              "textContent=`本地 ${r.localHits} · 法语 ${r.frenchHits} · 未收录 ${r.unknownChars}`",
          ]
          missing = [item for item in required_dynamic if item not in app]
          if missing:
              raise SystemExit("Dynamic result statistics were not compiled: " + ", ".join(missing))
          for name, expected in protected_hashes.items():
              actual = hashlib.sha256((public / name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"Protected asset changed during UI build: {name}")
          print("DWSS 0.9.7 repairs late-loaded PWA initialization and displays update feedback.")
          PY
      - name: Validate PWA initialization, update feedback and interface regression 0.9.7
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq '<header class="top">' public/index.html
          ! grep -Fq 'class="card pwa-card"' public/index.html
          grep -Fq 'class="status-strip"' public/index.html
          grep -Fq 'id="networkBadge"' public/index.html
          grep -Fq 'id="pwaState"' public/index.html
          grep -Fq 'id="checkUpdateBtn"' public/index.html
          grep -Fq 'id="pwaToast"' public/index.html
          grep -Fq 'class="pwa-toast"' public/index.html
          ! grep -Fq 'id="saveHistoryBtn"' public/index.html
          grep -Fq 'data-tab="maintenance">添加新词' public/index.html
          grep -Fq 'linear-gradient(125deg,#861326 0%,#bd2436 52%,#e34a3d 100%)' public/index.html
          grep -Fq 'if(saveHistoryBtn)' public/app.js
          grep -Fq 'id="history"' public/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = (Path("public") / "index.html").read_text(encoding="utf-8")
          nav = re.search(r'<nav class="tabs">(.*?)</nav>', html, flags=re.S)
          if not nav:
              raise SystemExit("Primary navigation missing")
          tabs = re.findall(r'data-tab="([^"]+)"', nav.group(1))
          if tabs != ["translate", "saved", "maintenance"]:
              raise SystemExit("Unexpected primary navigation: " + repr(tabs))
          if 'id="dictionary"' not in html or 'id="dictSearch"' not in html:
              raise SystemExit("Dictionary panel/data was removed unexpectedly")
          if "linear-gradient(135deg,#103966,#1d5a8e)" not in html:
              raise SystemExit("Primary button palette missing")
          PY
          grep -Fq 'background-color:#F7E3A0!important' public/index.html
          grep -Fq 'textarea,select' public/index.html
          grep -Fq "Version: 0.9.7" public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.7';" public/sw.js
          grep -Fq "DWSS 0.9.7 — PWA update feedback" public/index.html
          grep -Fq "function renderUnknownRecommendations" public/app.js
          python3 - <<'PY'
          from pathlib import Path
          app = (Path("public") / "app.js").read_text(encoding="utf-8")
          required = [
              "textContent=`本地覆盖约 ${pct}%`",
              "textContent=`本地 ${r.localHits} · 法语 ${r.frenchHits} · 未收录 ${r.unknownChars}`",
          ]
          missing = [item for item in required if item not in app]
          if missing:
              raise SystemExit("Dynamic statistics check failed: " + ", ".join(missing))
          PY
          node --check public/app.js
          node --check public/pwa.js
          node --check public/sw.js
          test -s public/dictionary.js.gz
          test -s public/cover.jpg
      - name: Audit PWA, navigation and DOM event wiring
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html','utf8');
          const pwa = fs.readFileSync('public/pwa.js','utf8');
          const boot = fs.readFileSync('public/boot.js','utf8');
          const app = fs.readFileSync('public/app.js','utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
          const idSet = new Set(ids);
          if(ids.length!==idSet.size) throw new Error('Duplicate HTML id found');
          const refs = new Set();
          for(const txt of [pwa,app]){
            for(const m of txt.matchAll(/\$\(['"]([^'"]+)['"]\)/g)) refs.add(m[1]);
            for(const m of txt.matchAll(/getElementById\(['"]([^'"]+)['"]\)/g)) refs.add(m[1]);
          }
          const missing = [...refs].filter(id=>!idSet.has(id));
          if(missing.some(id=>id!=='saveHistoryBtn')) throw new Error('Missing JS DOM ids: '+missing.join(', '));
          if(!app.includes('if(saveHistoryBtn)')) throw new Error('Removed history button listener is not guarded');
          if(!html.includes('id="pwaToast"')) throw new Error('Update feedback toast missing');
          if(!pwa.includes("document.readyState==='complete'")) throw new Error('Late-loaded PWA script does not initialize after load');
          if(pwa.includes("setState('浏览器打开'")) throw new Error('Browser-open status still displayed');
          if(!pwa.includes('showFeedback(message.textContent)')) throw new Error('Update feedback is not connected to status changes');
          const nav=html.match(/<nav class="tabs">(.*?)<\/nav>/s);
          if(!nav) throw new Error('Primary navigation missing');
          const tabs=[...nav[1].matchAll(/data-tab="([^"]+)"/g)].map(m=>m[1]);
          if(tabs.join(',')!=='translate,saved,maintenance') throw new Error('Unexpected navigation: '+tabs.join(','));
          for(const id of ['translate','saved','maintenance','dictionary','dictSearch','inputText','resultReading','segmentList','favorites','history','entryForm','exportCustom','importCustom','networkBadge','pwaState','pwaMessage','pwaToast','checkUpdateBtn']) {
            if(!idSet.has(id)) throw new Error('Required UI element missing: '+id);
          }
          if(html.includes('id="saveHistoryBtn"')) throw new Error('Save-to-history button still present');
          if(!html.includes('id="pwaState" hidden')) throw new Error('PWA mode chip should start hidden');
          if(!boot.includes("for (const src of ['./french-fallback.js', './app.js', './pwa.js'])")) throw new Error('Bootstrap module load sequence changed');
          console.log('Regression audit passed: unique IDs, guarded removed control, preserved panels, three tabs, late PWA initialization and update feedback.');
          NODE
          node --check public/boot.js
          node --check public/pwa.js
          node --check public/app.js
          node --check public/sw.js
          node --check public/shared-lexicon.js
          node --check public/french-fallback.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
