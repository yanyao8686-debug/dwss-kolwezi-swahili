name: Deploy DWSS PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'DWSS_PWA_0.6.2_GitHubPages_发布包.zip'
      - 'DWSS_PWA_0.6.2_GitHubPages.zip'
      - 'DWSS_PWA_0.5.1_GitHubPages.zip'
      - 'DWSS_PWA_0.5.1_GitHubPages_发布包.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Unpack and verify DWSS PWA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          ARCHIVE=""
          for candidate in "DWSS_PWA_0.6.2_GitHubPages_发布包.zip" "DWSS_PWA_0.6.2_GitHubPages.zip" "DWSS_PWA_0.5.1_GitHubPages.zip" "DWSS_PWA_0.5.1_GitHubPages_发布包.zip"; do
            if [ -f "$candidate" ]; then ARCHIVE="$candidate"; break; fi
          done
          test -n "$ARCHIVE"
          unzip -q "$ARCHIVE" -d public
          test -s public/index.html
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/dictionary.js.gz
          test -s public/french-fallback.js
          test ! -e public/english-fallback.js
          touch public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
