      - name: Audit PWA, navigation and DOM event wiring
        id: audit_dom
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('public/index.html','utf8');
          const pwa = fs.readFileSync('public/pwa.js','utf8');
          const boot = fs.readFileSync('public/boot.js','utf8');
          const app = fs.readFileSync('public/app.js','utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m=>m[1]);
          const idSet = new Set(ids);
          if(ids.length!==idSet.size) throw new Error('Duplicate HTML id found');
          const refs = new Set();
          for(const txt of [pwa,app]){
            for(const m of txt.matchAll(/\$\(['"]([^'"]+)['"]\)/g)) refs.add(m[1]);
            for(const m of txt.matchAll(/getElementById\(['"]([^'"]+)['"]\)/g)) refs.add(m[1]);
          }
          const missing = [...refs].filter(id=>!idSet.has(id));
          if(missing.some(id=>id!=='saveHistoryBtn')) { console.error('MISSING_JS_DOM_IDS='+missing.join(',')); throw new Error('Missing JS DOM ids: '+missing.join(', ')); }
          if(!app.includes('if(saveHistoryBtn)')) throw new Error('Removed history button listener is not guarded');
          if(!html.includes('id="pwaToast"')) throw new Error('Update feedback toast missing');
          if(!pwa.includes("document.readyState==='complete'")) throw new Error('Late-loaded PWA script does not initialize after load');
          if(pwa.includes("setState('浏览器打开'")) throw new Error('Browser-open status still displayed');
          if(pwa.includes("setState('已从桌面启动'")) throw new Error('Standalone-launch status still displayed');
          if(!pwa.includes('state.hidden=true;')) throw new Error('PWA transient status is not hidden initially');
          if(!pwa.includes('showFeedback(message.textContent)')) throw new Error('Update feedback is not connected to status changes');
          const nav=html.match(/<nav class="tabs">(.*?)<\/nav>/s);
          if(!nav) throw new Error('Primary navigation missing');
          const tabs=[...nav[1].matchAll(/data-tab="([^"]+)"/g)].map(m=>m[1]);
          if(tabs.join(',')!=='maintenance,saved') throw new Error('Unexpected navigation: '+tabs.join(','));
          if((nav[1].match(/<button/g)||[]).length!==3 || !nav[1].includes('class="nav-clear-slot"')) throw new Error('Expected exactly three navigation actions including clear information');
          if(nav[1].includes('data-tab="translate"')) throw new Error('Translation must open by default rather than occupy a navigation slot');
          if(!html.includes('class="panel active" id="translate"')) throw new Error('Translation is not the default home panel');
          for(const id of ['translate','saved','maintenance','dictionary','dictSearch','inputText','resultReading','segmentList','favorites','history','entryForm','exportCustom','importCustom','networkBadge','pwaState','pwaMessage','pwaToast','checkUpdateBtn']) {
            if(!idSet.has(id)) throw new Error('Required UI element missing: '+id);
          }
          if(html.includes('id="saveHistoryBtn"')) throw new Error('Save-to-history button still present');
          if(!html.includes('id="pwaState" hidden')) throw new Error('PWA mode chip should start hidden');
          if(!boot.includes("for (const src of ['./french-fallback.js', './app.js', './pwa.js'])")) throw new Error('Bootstrap module load sequence changed');
          console.log('Regression audit passed: unique IDs, guarded controls, three tabs, dictionary data panel, late PWA initialization and update feedback.');
          NODE
          node --check public/boot.js
          node --check public/pwa.js
          node --check public/app.js
          node --check public/sw.js
          node --check public/shared-lexicon.js
          node --check public/french-fallback.js
      - name: Apply requested DWSS cover and fire-orange headings (0.9.33)
        shell: bash
        run: |
          set -euo pipefail
          test -s custom-cover.webp
          cp custom-cover.webp public/cover.webp
          python3 - <<'PY'
          from pathlib import Path
          import re

          public = Path("public")
          html_path = public / "index.html"
          app_path = public / "app.js"
          sw_path = public / "sw.js"
          version_path = public / "VERSION.txt"

          html = html_path.read_text(encoding="utf-8")
          if 'src="cover.jpg"' not in html:
              raise SystemExit("Expected the original cover image reference exactly once.")
          html = html.replace('src="cover.jpg"', 'src="cover.webp"', 1)
          if 'src="cover.webp"' not in html:
              raise SystemExit("New DWSS cover was not connected to index.html.")

          # The supplied square cover already contains the DWSS emblem, 陈谍 and both mottos.
          # Hide the old HTML overlay so the wording is not duplicated.
          css = r"""
          /* DWSS 0.9.33 — requested cover and fire-orange translation headings */
          .cover-frame .owner-signature{display:none!important}
          .translation-input-section>h2,#resultCard .sectionTitle h2{
            color:#ff4b12!important;
            text-decoration-line:underline!important;
            text-decoration-color:#ff4b12!important;
            text-decoration-thickness:2px!important;
            text-underline-offset:4px!important;
            white-space:nowrap!important;
            word-break:keep-all!important;
            overflow-wrap:normal!important;
          }
          #resultCard .sectionTitle{
            display:flex!important;
            flex-wrap:nowrap!important;
            align-items:center!important;
            min-width:0!important;
          }
          #resultCard .sectionTitle h2{
            display:inline-block!important;
            flex:0 0 auto!important;
            max-width:100%!important;
            min-width:0!important;
            font-size:clamp(12px,3.8vw,16px)!important;
            line-height:1.2!important;
            letter-spacing:0!important;
          }
          """
          if "</style>" not in html:
              raise SystemExit("Main stylesheet end marker missing.")
          html = html.replace("</style>", css + "\n</style>", 1)
          html = html.replace("DWSS 0.9.32", "DWSS 0.9.33")
          html = html.replace("等待输入", "")
          if "等待输入" in html or "color:#ff4b12!important" not in html:
              raise SystemExit("Orange heading or waiting-text replacement failed.")
          if "white-space:nowrap!important" not in html or "text-decoration-line:underline!important" not in html:
              raise SystemExit("One-line underline styles are missing.")
          if ".cover-frame .owner-signature{display:none!important}" not in html:
              raise SystemExit("Duplicate cover-overlay suppression is missing.")
          html_path.write_text(html, encoding="utf-8")

          app = app_path.read_text(encoding="utf-8").replace("等待输入", "")
          if "等待输入" in app:
              raise SystemExit("Obsolete waiting text remains in app.js.")
          app_path.write_text(app, encoding="utf-8")

          version = version_path.read_text(encoding="utf-8")
          if "Version: 0.9.32" not in version:
              raise SystemExit("Unexpected base VERSION.txt; expected 0.9.32.")
          version_path.write_text(version.replace("Version: 0.9.32", "Version: 0.9.33", 1), encoding="utf-8")

          sw = sw_path.read_text(encoding="utf-8")
          if "const APP_VERSION = '0.9.32';" not in sw:
              raise SystemExit("Unexpected base service-worker version; expected 0.9.32.")
          sw = sw.replace("const APP_VERSION = '0.9.32';", "const APP_VERSION = '0.9.33';", 1)
          if "cover.jpg" not in sw:
              raise SystemExit("Service worker does not cache the old cover asset as expected.")
          sw = sw.replace("cover.jpg", "cover.webp")
          if "const APP_VERSION = '0.9.33';" not in sw or "cover.webp" not in sw:
              raise SystemExit("Service worker cache version or cover path was not updated.")
          if "const APP_VERSION = '0.9.33';" not in sw or "./cover.webp" not in sw:
              raise SystemExit("Service worker cache version or cover path was not updated.")
          sw_path.write_text(sw, encoding="utf-8")

          cover = public / "cover.webp"
          if not cover.is_file() or cover.stat().st_size < 10000:
              raise SystemExit("The replacement cover.webp is missing or unexpectedly small.")
          print("PASS: cover, orange underlined single-line headings, no waiting text, and PWA cache version 0.9.33.")
          PY
          node --check public/app.js
          node --check public/sw.js
          grep -Fq 'src="cover.webp"' public/index.html
          grep -Fq 'color:#ff4b12!important' public/index.html
          grep -Fq 'white-space:nowrap!important' public/index.html
          grep -Fq 'Version: 0.9.33' public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.33';" public/sw.js
          test -s public/cover.webp
      - name: Upload Pages artifact
