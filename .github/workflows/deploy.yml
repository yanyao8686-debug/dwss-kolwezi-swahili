name: Deploy DWSS PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'DWSS_PWA_0.6.4_GitHubPages*.zip'
      - 'shared-lexicon.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify and unpack the DWSS 0.6.4 release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(DWSS_PWA_0.6.4_GitHubPages*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one DWSS 0.6.4 ZIP; found ${#archives[@]}."
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          ARCHIVE="${archives[0]}"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null
          mkdir -p public
          unzip -q "$ARCHIVE" -d public
          test -s public/index.html
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/dictionary.js.gz
          test -s public/french-fallback.js
          test -s public/VERSION.txt
          test -s shared-lexicon.js
          cp shared-lexicon.js public/shared-lexicon.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          html = p.read_text(encoding="utf-8")
          script = '<script defer src="./shared-lexicon.js"></script>'
          if script not in html:
              if "</body>" in html:
                  html = html.replace("</body>", script + "\n</body>", 1)
              else:
                  html += "\n" + script
          p.write_text(html, encoding="utf-8")
          PY
          test -s public/shared-lexicon.js
          node --check public/shared-lexicon.js
          grep -Fq 'shared-lexicon.js' public/index.html
          grep -Fq "Version: 0.6.4" public/VERSION.txt
          touch public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
