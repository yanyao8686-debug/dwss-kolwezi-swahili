          segment_pattern = r"\$\('segmentList'\)\.innerHTML=r\.segments\.map\(s=>\{.*?\}\)\.join\(''\)\|\|'<div class=\"nores\">没有匹配结果</div>';"
          new_segment = '''$('segmentList').innerHTML=r.segments.map(s=>{
            if(s.type==='punct')return '';
            if(s.type==='local'){
             const alts=uniqueLocalVariants(s.item).filter(v=>norm(v.reading)!==norm(s.reading));
             const latinHtml=s.latin.length?\`<div class="src">拼写：\${esc(s.latin.join(' / '))}</div>\`:'';
             const aliasHtml=s.matchedBy==='近义替代'?\`<div class="src alias-note">近义替代：\${esc(s.originalTerm)} → \${esc(s.canonical)}\${s.aliasCaution?' · 请确认语境':''}</div>\`:'';
             const detailParts=[];
             if(s.source)detailParts.push('来源：'+s.source);
             if(alts.length)detailParts.push('其他读音：'+alts.map(v=>v.reading+'（'+v.source+'）').join('；')+'；请核对当地用法');
             const detailHtml=detailParts.length?\`<details class="segment-meta"><summary>更多信息</summary><div class="src">\${esc(detailParts.join(' · '))}</div></details>\`:'';
             return \`<div class="seg"><div class="zh">\${esc(s.zh)}</div><div class="rd">\${esc(s.reading)}\${latinHtml}\${aliasHtml}\${detailHtml}</div></div>\`;
            }
            if(s.type==='french')return \`<div class="seg french-fallback"><div class="zh">\${esc(s.zh)}</div><div class="rd">\${esc(s.frenchReadingZh||frenchReadingFor(s.french))}（法语）<details class="segment-meta"><summary>查看法语原文</summary><div class="src">\${esc(s.french)} · 法语备用，不是当地斯语；中文读音仅作近似提示。</div></details></div></div>\`;
            if(s.type==='latinOnly')return \`<div class="seg unknown"><div class="zh">\${esc(s.zh)}</div><div class="rd">\${esc(s.latin.join(' / '))}<div class="src">中文谐音待补</div></div></div>\`;
            return \`<div class="seg unknown"><div class="zh">\${esc(s.text)}</div><div class="rd">未收录 · 暂不自动猜译\${renderUnknownRecommendations(s,raw)}</div></div>\`;
           }).join('')||'<div class="nores">没有匹配词条</div>';'''
          new_segment = new_segment.replace("\\`", "`").replace("\\${", "${")
          app, n = re.subn(segment_pattern, lambda _: new_segment, app, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f"Segment renderer: expected one block, found {n}")
          for old, new, label in [
              ("当地斯语覆盖：\${pct}%（按字符估算）", "本地覆盖约 \${pct}%", "coverage chip"),
              ("当地词条 \${r.localHits} 段 · 法语补位 \${r.frenchHits} 段 · 未收录 \${r.unknownChars} 字", "本地 \${r.localHits} · 法语 \${r.frenchHits} · 未收录 \${r.unknownChars}", "match chip"),
              ("输入中文后，显示当地斯语命中、法语补位和仍未收录的部分。", "输入后显示匹配结果与未收录内容。", "empty result hint")
          ]:
              old = old.replace("\\${", "${")
              new = new.replace("\\${", "${")
              if old not in app:
                  raise SystemExit(f"Missing app copy: {label}")
              app = app.replace(old, new, 1)
          old_history_listener = "$('saveHistoryBtn').addEventListener('click',()=>{const t=$('inputText').value.trim();if(t)saveRecent(t);});"
          new_history_listener = "const saveHistoryBtn=$('saveHistoryBtn');if(saveHistoryBtn)saveHistoryBtn.addEventListener('click',()=>{const t=$('inputText').value.trim();if(t)saveRecent(t);});"
          if old_history_listener not in app:
