          pwa = pwa.replace(old_border, "networkBadge.style.borderColor=online?'#c9d9d3':'#e6c98b';", 1)
          pwa = pwa.replace(old_color, "networkBadge.style.color=online?'#245c48':'#9a6a1e';", 1)
          write("pwa.js", pwa)

          # Compact the translation result while keeping candidate selection intact.
          app = read("app.js")
          new_recommend = '''function renderUnknownRecommendations(segment,contextText=''){
           const candidates=recommendAlternativesForUnknown(segment.text,contextText);
           if(!candidates.length)return \`<div class="recommendation-box"><div class="recommendation-title">相关候选</div><div class="candidate-intro">暂未找到可靠候选，可换种说法或补充词条。</div></div>\`;
           return \`<div class="recommendation-box"><div class="recommendation-title">相关候选</div><div class="candidate-intro">仅供参考 · 选择后替换并重新翻译</div><div class="recommendation-list">\${candidates.map(c=>\`<div class="recommendation-item"><div class="recommendation-main"><b>\${esc(c.item.zh)}</b><span>\${esc(c.reading)}</span><div class="candidate-meta">\${esc(c.kind)} · \${esc(c.contextLabel)}\${c.reading&&!c.reading.startsWith('拉丁拼写：')?' · 读音待核':''}</div><details class="candidate-extra"><summary>更多信息</summary><div>\${esc(c.note||'请结合上下文确认')} · 来源：\${esc(c.source)}</div></details></div><button class="soft mini" type="button" data-recommend-start="\${Number(segment.start)||0}" data-recommend-end="\${Number(segment.end)||0}" data-recommend-target="\${esc(c.item.zh)}">替换</button></div>\`).join('')}</div></div>\`;
          }'''
          new_recommend = new_recommend.replace("\\`", "`").replace("\\${", "${")
          app, n = re.subn(r"function renderUnknownRecommendations\(segment,contextText=''\)\{.*?\n\}", lambda _: new_recommend, app, count=1, flags=re.S)
          if n != 1:
