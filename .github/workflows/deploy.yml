          sw_path.write_text(sw, encoding="utf-8")

          cover = public / "cover.webp"
          if not cover.is_file() or cover.stat().st_size < 150000:
              raise SystemExit("The high-resolution replacement cover.webp is missing or smaller than 150 KB.")
          image_bytes = cover.read_bytes()
          if len(image_bytes) < 30 or image_bytes[:4] != b"RIFF" or image_bytes[8:12] != b"WEBP" or image_bytes[12:16] != b"VP8 " or image_bytes[23:26] != bytes((0x9d, 0x01, 0x2a)):
              raise SystemExit("cover.webp is not the expected VP8 WebP image.")
          width = int.from_bytes(image_bytes[26:28], "little") & 0x3fff
          height = int.from_bytes(image_bytes[28:30], "little") & 0x3fff
          if (width, height) != (1536, 1536):
              raise SystemExit(f"Unexpected cover resolution: {width}x{height}.")
          print("PASS: 1536x1536 cover over 150 KB, orange single-line headings, and PWA cache version 0.9.35.")
          PY
