          ]
          for old, new in pwa_replacements:
              pwa = pwa.replace(old, new, 1)
          old_border = "networkBadge.style.borderColor=online?'#ffffff70':'#ffdf9a';"
          old_color = "networkBadge.style.color=online?'#e6fff3':'#ffdf9a';"
          if old_border not in pwa or old_color not in pwa:
