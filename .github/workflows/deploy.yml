name: Deploy DWSS PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'DWSS_PWA_0.6.4_GitHubPages*.zip'
      - 'shared-lexicon.js'
      - 'scripts/integrate_shared_search.py'
      - 'scripts/finalize_shared_release.py'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify and unpack the DWSS 0.6.4 release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(DWSS_PWA_0.6.4_GitHubPages*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one DWSS 0.6.4 ZIP; found ${#archives[@]}."
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          ARCHIVE="${archives[0]}"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null
          mkdir -p public
          unzip -q "$ARCHIVE" -d public
          test -s public/index.html
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/dictionary.js.gz
          test -s public/french-fallback.js
          test -s public/VERSION.txt
          test -s shared-lexicon.js
          test -s scripts/integrate_shared_search.py
          test -s scripts/finalize_shared_release.py
          python3 scripts/integrate_shared_search.py public/app.js
          cp shared-lexicon.js public/shared-lexicon.js
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" -o public/supabase.min.js
          test -s public/supabase.min.js
          python3 scripts/finalize_shared_release.py public
          test -s public/shared-lexicon.js
          node --check public/shared-lexicon.js
          test -s public/supabase.min.js
          grep -Fq "'./shared-lexicon.js'" public/sw.js
          grep -Fq "'./supabase.min.js'" public/sw.js
          grep -Fq "sharedCount" public/app.js
          grep -Fq "function lookupLocalAt" public/app.js
          grep -Fq "function lookupFrenchWithoutLocalOverlap" public/app.js
          grep -Fq "origin:'builtin'" public/app.js
          grep -Fq "origin:'shared'" public/app.js
          grep -Fq "dwss:shared-terms-updated" public/shared-lexicon.js
          node --check public/app.js
          node --check public/french-fallback.js
          node --check public/sw.js
          node --check public/pwa.js
          grep -Fq 'shared-lexicon.js' public/index.html
          grep -Fq "Version: 0.6.7" public/VERSION.txt
          touch public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
