      - name: Apply DWSS 0.9.36 storage, UX and cache hardening
        id: harden_0_9_36
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("public")
          def read(name):
              path = root / name
              if not path.is_file():
                  raise SystemExit(f"Missing release file: {name}")
              return path.read_text(encoding="utf-8")
          def write(name, data):
              (root / name).write_text(data, encoding="utf-8")
          def once(data, old, new, label):
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              return data.replace(old, new, 1)

          # Durable, defensive local persistence and bounded custom dictionary.
          app = read("app.js")
          app = once(app,
              "const CUSTOM_KEY = 'sw_custom_dictionary_v1';\nconst PRODUCT_META = Object.freeze({id:'com.dwss.kolwezi.swahili',name:'DWSS 科卢韦齐斯瓦西里语助手',owner:'DWSS / 陈谍',version:'0.9.0'});",
