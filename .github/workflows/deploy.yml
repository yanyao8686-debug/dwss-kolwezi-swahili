           const duplicate=custom.find(c=>norm(c.zh)===norm(v.zh)&&norm(c.reading)===norm(v.reading)&&norm(c.latin)===norm(v.latin)&&norm(c.french)===norm(v.french));
           if(duplicate)return {ok:false,error:'这条自定义词条已经存在。你可以在下方列表中编辑它。'};
