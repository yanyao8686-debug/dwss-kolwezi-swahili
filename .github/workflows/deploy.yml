name: Deploy DWSS PWA to GitHub Pages
# 0.9.32 follow-up: force a fresh Pages build after the translation-workspace generator was corrected.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'custom-cover.webp'
      - 'DWSS_PWA_0.6.4_GitHubPages*.zip'
      - 'shared-lexicon.js'
      - 'scripts/integrate_shared_search.py'
      - 'scripts/finalize_shared_release.py'
      - 'scripts/upgrade_context_0_9_0.py'
      - 'scripts/refine_release_0_9_13.py'
      - 'data/dwss_new_local_source_terms.csv'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
      - name: Verify and unpack the DWSS 0.6.4 release
        id: verify_unpack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(DWSS_PWA_0.6.4_GitHubPages*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one DWSS 0.6.4 ZIP; found ${#archives[@]}."
            printf '%s\n' "${archives[@]}"
            exit 1
          fi
          ARCHIVE="${archives[0]}"
          test -s "$ARCHIVE"
          unzip -t "$ARCHIVE" >/dev/null
          mkdir -p public
          unzip -q "$ARCHIVE" -d public
          test -s public/index.html
          test -s public/manifest.webmanifest
          test -s public/sw.js
          test -s public/dictionary.js.gz
          test -s public/french-fallback.js
          test -s public/VERSION.txt
          test -s shared-lexicon.js
          test -s scripts/integrate_shared_search.py
          test -s scripts/finalize_shared_release.py
          python3 scripts/integrate_shared_search.py public/app.js
          cp shared-lexicon.js public/shared-lexicon.js
          curl -fsSL "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" -o public/supabase.min.js
          test -s public/supabase.min.js
          python3 scripts/finalize_shared_release.py public
          test -s scripts/upgrade_context_0_9_0.py
          test -s data/dwss_new_local_source_terms.csv
          python3 scripts/upgrade_context_0_9_0.py public
          test -s public/shared-lexicon.js
          node --check public/shared-lexicon.js
          test -s public/supabase.min.js
          grep -Fq "'./shared-lexicon.js'" public/sw.js
          grep -Fq "'./supabase.min.js'" public/sw.js
          grep -Fq "sharedCount" public/app.js
          grep -Fq "function lookupLocalAt" public/app.js
          grep -Fq "function lookupFrenchWithoutLocalOverlap" public/app.js
          grep -Fq "origin:'builtin'" public/app.js
          grep -Fq "origin:'shared'" public/app.js
          grep -Fq "dwss:shared-terms-updated" public/shared-lexicon.js
          node --check public/app.js
          node --check public/french-fallback.js
          node --check public/sw.js
          node --check public/pwa.js
          grep -Fq 'shared-lexicon.js' public/index.html
          grep -Fq "Version: 0.9.0" public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.0';" public/sw.js
          grep -Fq "const CONTEXT_PROFILES" public/app.js
          grep -Fq "contextLabel" public/app.js
          touch public/.nojekyll
      - name: Compact DWSS interface copy and optional details
        id: compact_ui
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          public = Path("public")
          protected_hashes = {name: hashlib.sha256((public / name).read_bytes()).hexdigest() for name in ("dictionary.js.gz", "cover.jpg")}
          def read(name):
              p = public / name
              if not p.is_file():
                  raise SystemExit(f"Missing required file: {name}")
              return p.read_text(encoding="utf-8")
          def write(name, value):
              (public / name).write_text(value, encoding="utf-8")
          def swap(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, found {n}")
              return text.replace(old, new, 1)

          # HTML copy: less always-visible help, same controls and cover.
          html = read("index.html")
          html, n = re.subn(r"<h2>(?:应用状态|手机安装与离线状态)</h2>", "<h2>状态</h2>", html, count=1)
          if n != 1:
              raise SystemExit("Status heading not found")
          html, n = re.subn(
              r'<summary>安卓 / iPhone 添加到桌面的说明</summary><div class="hint">.*?</div>',
              '<summary>安装与离线</summary><div class="hint"><b>安卓：</b>Chrome 菜单 → 安装应用。<br><b>iPhone：</b>Safari 分享 → 添加到主屏幕。<br><b>离线：</b>首次联网并完成缓存后即可使用；换机或清理浏览器数据前先备份个人词条。</div>',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Install help block not found")
          html, n = re.subn(
              r'(<div class="hint" style="margin-top:\d+px">)(?:离线处理：|离线翻译 ·).*?</div>',
              r'\1科卢韦齐词库优先 · 法语备用会标注</div>',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Translation helper not found")
          html = html.replace(
              "当地斯瓦西里语中文谐音（法语补位显示中文谐音并标注“法语”）",
              "当地斯语中文谐音（法语补位会标注）")
          html = html.replace(
              "法语原文参考（仅供核对，不作为主体读音）", "法语原文")
          html = html.replace(
              "法语补位中文近似读音（已合并到主体翻译）", "法语近似读音")
          html = html.replace(
              "法语补位不是加丹加斯瓦西里语。法语补位在主体翻译中只显示中文近似读音并标注（法语）；需要核对时可展开查看法语原文。中文读音是辅助记忆的近似标注，不是标准音标，也不能完全代替当地法语口音。自然语序和语法可能需要调整。重要安保命令请核对。",
              "法语仅作备用，不是当地斯语；中文读音为近似提示。重要安保指令请当地人员复核。")
          html, n = re.subn(
              r'<div class="warnbox"><b>重要说明：</b>.*?</div>',
              '<details class="quality-note"><summary>准确性说明</summary><div class="quality-body">词库匹配不等于完整整句翻译；读音、语法和语序可能需要当地人员复核。重要安保指令请当地同事确认。</div></details>',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Accuracy warning block not found")
          html = html.replace("自定义词条中填写了拉丁拼写时，这里显示相应内容。", "有已核验拼写时显示在这里。")
          html, n = re.subn(
              r'<div class="resultlabel" style="margin-top:14px">(?:斯瓦西里语拉丁字母拼写（仅显示你手动核验填写的内容）|已核验拼写)</div><div class="latin" id="resultLatin">(.*?)</div>',
              r'<details class="quality-note"><summary>已核验拼写</summary><div class="latin" id="resultLatin">\\1</div></details>',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Verified spelling block not found")
          html = html.replace("逐段匹配情况", "匹配明细")
          html = html.replace("输入中文后，显示哪些部分在词库中找到、哪些需要补充。", "输入后显示匹配结果与未收录内容.")
          html = html.replace("输入中文后，显示哪些部分在词库中找到、哪些需要补充。", "输入后显示匹配结果与未收录内容。")
          html = html.replace("加丹加斯瓦西里语中文同音字读法", "当地斯语中文谐音")
          html = html.replace("法语中文近似读音（可选，可手动修正）", "法语中文谐音（可选）")
          html = html.replace("当地斯瓦西里语拼写（可选）", "当地斯语拼写（可选）")
          html = html.replace("管理个人补充内容。删除个人词条不会影响原始词库。", "仅管理个人词条；删除不影响原始词库。")
          html = html.replace("更换手机或清理浏览器数据前，请先生成并保存备份。", "换机或清理浏览器数据前，请先备份。")
          html = html.replace("合并恢复个人词条；原始词库不会被覆盖。", "仅合并个人词条，不覆盖原始词库。")
          html = html.replace("短句翻译", "翻译").replace("词库查询", "词典")
          html = html.replace("词库维护", "维护")
          html, n = re.subn(
              r'(<section class="panel" id="maintenance">.*?<h2[^>]*>.*?</h2>)\s*<p class="hint">.*?</p>',
              r'\1', html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Maintenance intro block not found")
          html, n = re.subn(
              r'<details class="install-help"><summary>第一次添加新词？点这里看操作步骤</summary><div class="hint">.*?</div></details>',
              '<details class="install-help"><summary>添加说明</summary><div class="hint"><b>中文：</b>填写要收录的词或短句。<br><b>当地读音：</b>请科卢韦齐同事确认后再录入；未确认的拼写留空。<br><b>法语备用：</b>暂时没有当地说法时可填写，系统会明确标注“法语”。<br><b>保存与备份：</b>保存后立即可查；换机或清理浏览器数据前，请先导出个人词库。</div></details>',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Maintenance help block not found")
          html, n = re.subn(
              r'(<p class="hint" id="pwaMessage">).*?(</p>)',
              r'\1首次联网并完成缓存后即可离线使用。\2',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Initial PWA helper not found")
          html, n = re.subn(
              r'(<div class="footer">).*?(<br>)',
              r'\1词库来自原始资料；当地读音尚待科卢韦齐母语者全面复核。\2',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Footer provenance block not found")

          # Remove the large brand-information card and the full PWA status card.
          # Keep only the live network indicator, cached-resource state and update action.
          html, n = re.subn(r'<header class="top">.*?</header>', '', html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Large brand-information card not found")
          compact_status = (
              '<section class="status-strip" aria-label="运行状态">'
              '<div class="status-items">'
              '<span class="offline" id="networkBadge">检查状态…</span>'
              '<span class="chip" id="pwaState" hidden>正在检查</span>'
              '</div>'
              '<button class="soft mini" id="checkUpdateBtn" type="button">检查更新</button>'
              '<p class="hint" id="pwaMessage" hidden>状态信息</p>'
              '<button id="installAppBtn" type="button" hidden>安装到手机桌面</button>'
              '</section>'
              '<div id="pwaToast" class="pwa-toast" role="status" aria-live="polite" hidden></div>'
          )
          html, n = re.subn(
              r'<section class="card pwa-card"[^>]*>.*?</section>',
              lambda _: compact_status,
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Large PWA status card not found")

          # Remove the standalone dictionary tab from primary navigation.
          # Keep the dictionary panel, underlying word data and lookup code intact.
          compact_nav = (
              '<nav class="tabs">'
              '<button class="tab active" data-tab="translate">翻译</button>'
              '<button class="tab" data-tab="saved">收藏 / 历史</button>'
              '<button class="tab" data-tab="maintenance">添加新词</button>'
              '</nav>'
          )
          html, n = re.subn(r'<nav class="tabs">.*?</nav>', lambda _: compact_nav, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Primary navigation not found")
          if 'id="dictionary"' not in html or 'id="dictSearch"' not in html:
              raise SystemExit("Dictionary data panel was not preserved")

          html, n = re.subn(
              r'<button[^>]*id="saveHistoryBtn"[^>]*>.*?</button>',
              '',
              html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit("Save-to-history action button not found")
          compact_css = """
          /* DWSS 0.9.13 — one-step shared vocabulary sync and legacy edit bridge */
          .hint{font-size:12px;line-height:1.45;color:#718096}
          .resultlabel{font-size:11px;letter-spacing:.01em}
          .card h2{letter-spacing:-.015em}
          #resultCard>details{margin-top:9px!important;padding-top:3px}
          #resultCard>details>summary,.install-help>summary{font-size:11px;padding:5px 0;color:#51627d}
          #resultCard .quality-body{font-size:11px;line-height:1.55;color:#52627a}
          .segment-meta,.candidate-extra{margin-top:5px}
          .segment-meta summary,.candidate-extra summary{display:inline-block;cursor:pointer;font-size:10px;line-height:1.4;color:#75839a;list-style:none}
          .segment-meta summary::-webkit-details-marker,.candidate-extra summary::-webkit-details-marker{display:none}
          .segment-meta summary:after,.candidate-extra summary:after{content:' +';font-weight:700}
          .segment-meta[open] summary:after,.candidate-extra[open] summary:after{content:' −'}
          .segment-meta .src,.candidate-extra>div{font-size:10px;line-height:1.5;color:#748198;margin-top:4px}
          .candidate-intro,.candidate-meta{font-size:10px;line-height:1.4;color:#7a879b}
          .recommendation-title{font-size:12px;margin-bottom:3px}
          .recommendation-item{padding:9px 10px}
          .recommendation-main{gap:2px}
          .recommendation-main>b{font-size:13px}
          .recommendation-main>span{font-size:14px}
          .recommendation-main .candidate-meta{margin-top:2px}
          .recommendation-box{padding:9px 10px}
          .maintenance-note{padding:9px 11px;font-size:11px}
          .footer{font-size:10px;line-height:1.5}
          /* DWSS 0.9.4 — unified warm gold input surfaces */
          input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="button"]):not([type="submit"]):not([type="reset"]),
          textarea,select{
            background-color:#F7E3A0!important;
            color:#263449!important;
            border-color:#D9B85B!important;
          }
          input::placeholder,textarea::placeholder{color:#8A7440!important;opacity:.82}
          input:focus,textarea:focus,select:focus{
            background-color:#F9E9B8!important;
            border-color:#B88D2E!important;
            box-shadow:0 0 0 3px rgba(217,184,91,.2)!important;
            outline:none;
          }
          select option{background-color:#F7E3A0;color:#263449}
          /* Refined DWSS button palette: deep marine, champagne gold, quiet slate. */
          .tabs{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px!important;padding:10px!important;border:1px solid #dfe6ee;border-radius:22px;background:rgba(255,255,255,.8);box-shadow:0 8px 22px rgba(19,48,83,.055)}
          .tabs .tab{min-width:0;border:1px solid #e1e7ed!important;border-radius:17px!important;background:linear-gradient(145deg,#f4f6f8,#e9eef3)!important;color:#425a73!important;font-weight:650;box-shadow:0 2px 5px rgba(29,55,81,.045);transition:background .18s ease,box-shadow .18s ease,transform .18s ease}
          .tabs .tab.active{border-color:#123f70!important;background:linear-gradient(135deg,#103966,#1c5688)!important;color:#fff!important;box-shadow:0 7px 16px rgba(16,57,102,.22)}
          button.primary{border:1px solid #123f70!important;background:linear-gradient(135deg,#103966,#1d5a8e)!important;color:#fff!important;box-shadow:0 6px 14px rgba(16,57,102,.18)}
          button.soft{border:1px solid #dfc477!important;background:linear-gradient(135deg,#f6e7ba,#ecd38f)!important;color:#263d58!important;box-shadow:0 3px 9px rgba(155,120,39,.10)}
          button.plain{border:1px solid #dfe6ee!important;background:linear-gradient(135deg,#f5f7f9,#e9eef3)!important;color:#425a73!important}
          button.primary:active,button.soft:active,button.plain:active,.tabs .tab:active{transform:translateY(1px)}
          button.primary:focus-visible,button.soft:focus-visible,button.plain:focus-visible,.tabs .tab:focus-visible{outline:3px solid rgba(207,169,77,.35)!important;outline-offset:2px}
          /* DWSS 0.9.6 — imperial vermilion and flowing gold controls */
          .tabs .tab{
            border:1px solid #d9bd72!important;
            background:linear-gradient(145deg,#fff8e7 0%,#f1dfb0 100%)!important;
            color:#7e2630!important;
            box-shadow:0 3px 9px rgba(142,36,43,.08),inset 0 1px 0 rgba(255,255,255,.8);
          }
          .tabs .tab.active{
            border:1px solid #f0d17b!important;
            background:linear-gradient(125deg,#861326 0%,#b91f32 48%,#e34a3d 100%)!important;
            color:#fff4d5!important;
            box-shadow:0 7px 17px rgba(149,20,39,.24),inset 0 1px 0 rgba(255,231,171,.25);
            text-shadow:0 1px 1px rgba(72,5,15,.25);
          }
          .tabs .tab:not(.active):hover{
            background:linear-gradient(145deg,#fffaf0 0%,#eed79d 100%)!important;
            border-color:#cda94e!important;
          }
          .actions #translateBtn{
            border:1px solid #e8c66e!important;
            background:linear-gradient(125deg,#861326 0%,#bd2436 52%,#e34a3d 100%)!important;
            color:#fff3d0!important;
            box-shadow:0 7px 16px rgba(154,22,41,.2),inset 0 1px 0 rgba(255,226,164,.2);
            text-shadow:0 1px 1px rgba(72,5,15,.22);
          }
          .actions #clearBtn{
            border:1px solid #d7b75e!important;
            background:linear-gradient(135deg,#fff3cf 0%,#e9c96d 100%)!important;
            color:#792332!important;
            box-shadow:0 4px 10px rgba(150,105,22,.12),inset 0 1px 0 rgba(255,255,255,.75);
          }
          .actions #translateBtn:active,.actions #clearBtn:active,.tabs .tab:active{transform:translateY(1px)}
          .actions #translateBtn:focus-visible,.actions #clearBtn:focus-visible,.tabs .tab:focus-visible{
            outline:3px solid rgba(210,165,63,.38)!important;outline-offset:2px;
          }
          /* Replace the two tall intro cards with one compact status toolbar. */
          .status-strip{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px;padding:7px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:none}
          .status-items{display:flex;align-items:center;flex:1 1 auto;min-width:0;flex-wrap:wrap;gap:6px}
          .status-strip .offline{display:inline-flex;align-items:center;margin:0;padding:6px 9px;border:1px solid #d8e5df;border-radius:999px;background:#f3f8f5;color:#245c48;font-size:11px;line-height:1.2;white-space:nowrap}
          .status-strip .chip{display:inline-flex;align-items:center;margin:0;padding:6px 9px;border-radius:999px;font-size:11px;line-height:1.2;white-space:nowrap}
          .status-strip #checkUpdateBtn{flex:0 0 auto;margin:0!important;padding:8px 12px;font-size:12px;white-space:nowrap}
          .status-strip #pwaMessage,.status-strip #installAppBtn{display:none!important}
          @media(max-width:420px){.status-strip{gap:6px;padding:6px 8px}.status-items{gap:4px}.status-strip .offline,.status-strip .chip{padding:5px 7px;font-size:10px}.status-strip #checkUpdateBtn{padding:7px 9px;font-size:11px}}
          .pwa-toast{
            position:fixed;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));
            z-index:10020;max-width:480px;margin:0 auto;padding:13px 16px;
            border:1px solid #d6b75f;border-radius:15px;
            background:linear-gradient(135deg,#fff8e6 0%,#f0dfb0 100%);
            color:#702532;font-size:13px;line-height:1.55;font-weight:600;
            box-shadow:0 10px 28px rgba(72,25,28,.18);
            opacity:0;transform:translateY(8px);pointer-events:none;
            transition:opacity .18s ease,transform .18s ease;
          }
          .pwa-toast.visible{opacity:1;transform:translateY(0)}
          .pwa-toast[hidden]{display:none!important}
          """
          if "DWSS 0.9.13 — one-step shared vocabulary sync and legacy edit bridge" not in html:
              if "</style>" not in html:
                  raise SystemExit("Style insertion point missing")
              html = html.replace("</style>", compact_css + "\n</style>", 1)
          html = re.sub(r"版本 0\.9\.0[^<]*", "版本 0.9.13 · DWSS 智能翻译 PWA", html, count=1)
          required_ids = ["inputText","resultReading","segmentList","dictResults","favorites","history","entryForm","exportCustom","importCustom","networkBadge","pwaState","pwaMessage","installAppBtn","checkUpdateBtn"]
          missing = [item for item in required_ids if f'id="{item}"' not in html]
          if missing:
              raise SystemExit("Required interface controls missing: " + ", ".join(missing))
          if '<header class="top">' in html or 'class="card pwa-card"' in html:
              raise SystemExit("Large brand/status cards were not removed")
          if 'class="status-strip"' not in html:
              raise SystemExit("Compact status toolbar missing")
          if 'src="cover.jpg"' not in html:
              raise SystemExit("Original cover reference missing")
          write("index.html", html)

          # Repair PWA initialization: boot.js loads pwa.js asynchronously after window.load.
          pwa = read("pwa.js")
          def pwa_replace(old, new, label):
              nonlocal_placeholder = None
              count = pwa.count(old)
              if count != 1:
                  raise SystemExit(f"PWA patch {label}: expected one match, found {count}")
              return pwa.replace(old, new, 1)

          pwa = pwa_replace(
              "  const setState = (text, kind, detail) => { state.textContent=text; state.className='chip '+(kind||''); if(detail) message.textContent=detail; };",
