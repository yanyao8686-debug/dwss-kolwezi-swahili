name: Deploy DWSS 0.9.97 one-time Android installer and in-app updates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0997-one-time-apk.yml'
      - 'scripts/prepare_dwss_0997_one_time_apk.py'
      - 'scripts/test_dwss_0997_one_time_apk.cjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0997
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download verified DWSS 0.9.96 website baseline
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41053936323
          path: .dwss-baseline

      - name: Unpack and verify the last complete website release
        shell: bash
        run: |
          set -euo pipefail
          test -s .dwss-baseline/artifact.tar
          mkdir -p public
          tar -xf .dwss-baseline/artifact.tar -C public
          for file in index.html app.js pwa.js sw.js boot.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js manifest.webmanifest VERSION.txt cover.webp DWSS-Android-0.9.80.apk; do
            test -s "public/$file"
          done
          grep -Fxq 'Version: 0.9.96' public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.96';" public/sw.js
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-0.9.80.apk >/dev/null

      - name: Keep the same Android installer; update only the hosted app
        shell: bash
        run: |
          set -euo pipefail
          APK='public/DWSS-Android-0.9.80.apk'
          printf '%s  %s\n' '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5' "$APK" | sha256sum -c -
          test "$(stat -c%s "$APK")" -eq 5806530
          python3 scripts/prepare_dwss_0997_one_time_apk.py
          for file in app.js pwa.js sw.js boot.js shared-lexicon.js dictionary-overrides.js; do
            node --check "public/$file"
          done
          node --check scripts/test_dwss_0997_one_time_apk.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0997_one_time_apk.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null
          touch public/.nojekyll

      - name: Audit existing app functions and one-time installer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          root=Path("public")
          html=(root/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):super().__init__();self.ids=[];self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  if tag=="button" and "data-tab" in a:self.tabs.append(a["data-tab"])
          audit=Audit();audit.feed(html)
          duplicate=[k for k,v in Counter(audit.ids).items() if v>1]
          if duplicate:raise SystemExit("Duplicate HTML IDs: "+str(duplicate))
          if audit.tabs[:3] != ["maintenance","pronunciation","saved"]:raise SystemExit("Primary navigation changed")
          for token in ('id="inputText"','id="resultReading"','id="translationPronunciationCandidates"','id="translationPronunciationCandidateList"','id="apkWebVersion"','id="dwss-apk-download"'):
              if token not in html:raise SystemExit("Missing UI: "+token)
          if 'id="installAppBtn"' in html:raise SystemExit("Obsolete install prompt returned")
          sw=(root/"sw.js").read_text(encoding="utf-8")
          match=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not match:raise SystemExit("Service Worker precache list missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",match.group(1))
          for asset in ("./dictionary.js.gz","./pwa.js","./shared-lexicon.js","./app.js"):
              if asset not in urls:raise SystemExit("Offline asset missing: "+asset)
          if any(x.lower().endswith(".apk") for x in urls):raise SystemExit("APK must never be precached")
          manifest=json.loads((root/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("name")!="刚果金斯语翻译" or manifest.get("display")!="standalone":
              raise SystemExit("PWA identity changed")
          print("PASS: unique IDs, primary navigation, translation/candidate controls, PWA auto-update and stable installer.")
          PY

      - name: Upload DWSS Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.97
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live version, in-app auto-update and exact stable APK bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0997"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js pwa.js sw.js manifest.webmanifest; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/DWSS-Android-Installer.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-Installer.apk"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/DWSS-Android-0.9.80.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-0.9.80.apk"
          grep -Fxq 'Version: 0.9.97' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_97' "$LIVE/index.html"
          grep -Fq '<span id="apkWebVersion">0.9.97</span>' "$LIVE/index.html"
          grep -Fq '首次安装一次即可；联网后软件自动更新，无需重新下载 APK' "$LIVE/index.html"
          grep -Fq 'apkWebVersion' "$LIVE/pwa.js"
          grep -Fq 'installerVersion.textContent = match[1]' "$LIVE/pwa.js"
          test "$(stat -c%s "$LIVE/DWSS-Android-Installer.apk")" -eq 5806530
          test "$(sha256sum "$LIVE/DWSS-Android-Installer.apk" | cut -d' ' -f1)" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0997_one_time_apk.cjs
          node --check "$LIVE/app.js"
          node --check "$LIVE/pwa.js"
          node --check "$LIVE/sw.js"
          unzip -t "$LIVE/DWSS-Android-Installer.apk" >/dev/null
          echo 'PASS: website and in-app runtime version unified; the same verified APK remains the one-time installer; no APK rebuild required.'
