name: Deploy DWSS 0.9.93 shared pronunciation candidates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0993-variants.yml'
      - 'scripts/prepare_dwss_0993_variants.py'
      - 'scripts/test_dwss_0993_variants.cjs'
      - 'supabase/migrations/20261030090000_extend_shared_pronunciation_candidates_to_full_phrases.sql'
      - 'supabase/functions/dwss-submit-pronunciation-variant/index.ts'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0993
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download verified DWSS 0.9.92 Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41029856293
          path: .dwss-baseline

      - name: Unpack and verify current DWSS release
        shell: bash
        run: |
          set -euo pipefail
          test -s .dwss-baseline/artifact.tar
          mkdir -p public
          tar -xf .dwss-baseline/artifact.tar -C public
          for file in index.html app.js boot.js sw.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js manifest.webmanifest VERSION.txt cover.webp DWSS-Android-0.9.80.apk; do
            test -s "public/$file"
          done
          grep -Fxq 'Version: 0.9.92' public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.92';" public/sw.js
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-0.9.80.apk >/dev/null

      - name: Apply multi-pronunciation candidate UI and cloud submission
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_dwss_0993_variants.py
          for file in app.js shared-lexicon.js sw.js boot.js dictionary-overrides.js; do
            node --check "public/$file"
          done
          node --check scripts/test_dwss_0993_variants.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0993_variants.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-0.9.80.apk >/dev/null
          touch public/.nojekyll

      - name: Audit existing application features and offline bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          root=Path("public")
          html=(root/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self): super().__init__();self.ids=[];self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  if tag=="button" and "data-tab" in a:self.tabs.append(a["data-tab"])
          a=Audit();a.feed(html)
          duplicate=[k for k,v in Counter(a.ids).items() if v>1]
          if duplicate:raise SystemExit("Duplicate IDs: "+str(duplicate))
          if a.tabs[:3] != ["maintenance","pronunciation","saved"]:raise SystemExit("Primary navigation changed")
          for token in ('id="inputText"','id="resultReading"','id="translationPronunciationCandidates"','id="dwss-apk-download"'):
              if token not in html:raise SystemExit("Missing UI: "+token)
          if 'id="installAppBtn"' in html:raise SystemExit("Obsolete top install prompt exists")
          manifest=json.loads((root/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("name")!="刚果金斯语翻译":raise SystemExit("PWA application identity changed")
          sw=(root/"sw.js").read_text(encoding="utf-8")
          match=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not match:raise SystemExit("Service Worker precache list missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",match.group(1))
          for asset in ("./dictionary.js.gz","./shared-lexicon.js","./app.js"):
              if asset not in urls:raise SystemExit("Offline cache asset missing: "+asset)
          if any(x.lower().endswith(".apk") for x in urls):raise SystemExit("APK must not be precached")
          if 'id="translationPronunciationCandidates"' not in html:raise SystemExit("Main-page candidate list missing")
          if 'id="dwss-apk-download"' not in html:raise SystemExit("Compact APK download card missing")
          print("PASS: unique DOM IDs, navigation, PWA identity, offline assets and retained UI.")
          PY

      - name: Upload DWSS 0.9.93 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.93
        uses: actions/deploy-pages@v4

      - name: Verify live DWSS candidate UI, shared client and APK
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0993"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js boot.js sw.js shared-lexicon.js dictionary-overrides.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/DWSS-Android-0.9.80.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-0.9.80.apk"
          grep -Fxq 'Version: 0.9.93' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_93' "$LIVE/index.html"
          grep -Fq 'id="translationPronunciationCandidates"' "$LIVE/index.html"
          grep -Fq 'source_kind:"translation"' "$LIVE/app.js"
          grep -Fq 'submitPronunciationVariant' "$LIVE/app.js"
          grep -Fq 'source_kind: sourceKind' "$LIVE/shared-lexicon.js"
          grep -Fq "const APP_VERSION = '0.9.93';" "$LIVE/sw.js"
          test "$(stat -c%s "$LIVE/DWSS-Android-0.9.80.apk")" -eq 5806530
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0993_variants.cjs
          node --check "$LIVE/app.js"
          node --check "$LIVE/shared-lexicon.js"
          node --check "$LIVE/sw.js"
          unzip -t "$LIVE/DWSS-Android-0.9.80.apk" >/dev/null

          EDGE='https://pautxzcfmtwkaunjxghj.supabase.co/functions/v1/dwss-submit-pronunciation-variant'
          curl -fsS --max-time 20 -X OPTIONS "$EDGE" \
            -H 'Origin: https://yanyao8686-debug.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,content-type' \
            -D "$LIVE/edge-cors.headers" -o /dev/null
          grep -Fiq 'Access-Control-Allow-Origin: https://yanyao8686-debug.github.io' "$LIVE/edge-cors.headers"
          echo 'PASS: live DWSS 0.9.93 multiple pronunciation candidates, shared cloud client, online sync endpoint, offline cache and retained Android installer.'
