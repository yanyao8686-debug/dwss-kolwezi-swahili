name: Deploy DWSS 0.9.85 stable first-paint navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0985-first-paint-navigation.yml'
      - 'scripts/fix_dwss_0985_first_paint_navigation.py'
      - 'scripts/test_dwss_0985_first_paint_navigation.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0985
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download and validate live 0.9.84 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          mkdir -p public
          curl -fsSL --retry 8 --retry-delay 2 --max-time 45 "$BASE/VERSION.txt?baseline=$GITHUB_SHA" -o public/VERSION.txt
          grep -Fq 'Version: 0.9.84' public/VERSION.txt || { echo 'Expected live 0.9.84 baseline'; cat public/VERSION.txt; exit 1; }
          for file in index.html app.js boot.js pwa.js sw.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js hanzi-pinyin.js pronunciation-search.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 8 --retry-delay 2 --max-time 90 "$BASE/$file?baseline=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
          gzip -t public/dictionary.js.gz
          grep -Fq "const APP_VERSION = '0.9.84';" public/sw.js
      - name: Apply stable first-paint navigation and honest initial status
        env:
          DWSS_PUBLIC_DIR: public
        run: python3 scripts/fix_dwss_0985_first_paint_navigation.py
      - name: Run syntax, initial-layout and PWA regression checks
        shell: bash
        env:
          DWSS_PUBLIC_DIR: public
        run: |
          set -euo pipefail
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js pronunciation-search.js hanzi-pinyin.js; do
            node --check "public/$file"
          done
          node scripts/test_dwss_0985_first_paint_navigation.cjs
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import gzip,json,re
          p=Path("public")
          html=(p/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):super().__init__();self.ids=[];self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  if tag=="button" and "data-tab" in a:self.tabs.append(a["data-tab"])
          audit=Audit();audit.feed(html)
          dup={k:v for k,v in Counter(audit.ids).items() if v>1}
          if dup:raise SystemExit("Duplicate HTML IDs: "+str(dup))
          if audit.tabs[:3]!=["maintenance","pronunciation","saved"]:raise SystemExit("Navigation order changed: "+str(audit.tabs))
          sw=(p/"sw.js").read_text(encoding="utf-8")
          match=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not match:raise SystemExit("Service Worker precache list missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",match.group(1))
          for asset in ("./dictionary.js.gz","./hanzi-pinyin.js","./pronunciation-search.js","./shared-lexicon.js"):
              if asset not in urls or not (p/asset.removeprefix("./")).is_file():raise SystemExit("Missing offline asset "+asset)
          if "./dictionary.js" in urls:raise SystemExit("Web PWA must use compressed dictionary")
          gzip.decompress((p/"dictionary.js.gz").read_bytes())
          manifest=json.loads((p/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("id")!="./?app=dwss-kolwezi-swahili" or manifest.get("display")!="standalone" or manifest.get("name")!="刚果金斯语翻译":raise SystemExit("PWA identity changed")
          (p/".nojekyll").touch()
          print(f"PASS: {len(urls)} offline assets, unique HTML IDs, nav structure and PWA identity verified.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy DWSS 0.9.85
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual live 0.9.85 first-paint markup and behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0985"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js boot.js pwa.js sw.js manifest.webmanifest; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/dictionary.js.gz?verify=$GITHUB_SHA" -o "$LIVE/dictionary.js.gz"
          grep -Fxq 'Version: 0.9.85' "$LIVE/VERSION.txt"
          grep -Fq "const APP_VERSION = '0.9.85';" "$LIVE/sw.js"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_85' "$LIVE/index.html"
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0985_first_paint_navigation.cjs
          node --check "$LIVE/app.js"
          node --check "$LIVE/pwa.js"
          gzip -t "$LIVE/dictionary.js.gz"
          echo 'PASS: live 0.9.85 renders the navigation correctly before initialization and reports honest checking states.'
