name: Deploy DWSS 0.9.116 French translation and pronunciation extension

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0116-french-extension.yml'
      - 'scripts/prepare_dwss_0116_french_extension.py'
      - 'scripts/french-extension-0116.js'
      - 'scripts/test_dwss_0116_french_extension.cjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0116-french-extension
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install pinned Python build dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check 'pypinyin==0.54.0'

      - name: Build French word-form and French-Chinese offline dictionary from checksum-verified sources
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python scripts/prepare_dwss_0116_french_extension.py
          cp scripts/french-extension-0116.js public/french-extension.js
          node --check public/app.js
          node --check public/shared-lexicon.js
          node --check public/sw.js
          node --check public/french-extension.js
          node --check scripts/test_dwss_0116_french_extension.cjs
          gzip -t public/french-ipa-index.tsv.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0116_french_extension.cjs
          touch public/.nojekyll

      - name: Audit unique HTML IDs, core navigation, language controls and PWA identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          root = Path('public')
          html = (root / 'index.html').read_text(encoding='utf-8')
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
                  self.tabs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if a.get('id'):
                      self.ids.append(a['id'])
                  if tag=='button' and a.get('data-tab'):
                      self.tabs.append(a['data-tab'])
          audit=Audit()
          audit.feed(html)
          duplicates=[key for key,count in Counter(audit.ids).items() if count>1]
          if duplicates:
              raise SystemExit('Duplicate IDs: '+str(duplicates))
          if audit.tabs[:2] != ['pronunciation','saved']:
              raise SystemExit('Existing primary navigation changed')
          required=[
              'id="inputText"','id="resultReading"','id="resultFrenchReading"',
              'id="dwssMainLanguagePicker"','id="dwssMainFrMode"',
              'id="pronunciationSearch"','id="pronunciationFrenchSearch"',
              'id="dwssPronunciationMode"','id="translationCorrectionPanel"',
              'id="submitTranslationCorrection"','id="dwssFrenchCorrectionPanel"',
              'id="dwssSaveFrenchCorrection"','id="newFrench"',
              'DWSS_AUTO_UPDATE_0_9_116'
          ]
          for token in required:
              if token not in html:
                  raise SystemExit('Missing required main/French feature: '+token)
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('name')!='刚果金斯语翻译' or manifest.get('display')!='standalone':
              raise SystemExit('PWA identity changed unexpectedly')
          print('PASS: unique IDs, original Swahili navigation/controls, independent French translation/query controls, PWA identity.')
          PY

      - name: Upload DWSS Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.116
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live DWSS 0.9.116 assets, French data and unchanged Android package
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0116"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js shared-lexicon.js pwa.js sw.js boot.js pronunciation-search.js dwss-pronunciation-controls.js manifest.webmanifest french-extension.js french-lexicon-sources.txt french-FREEDICT-COPYING.txt french-IPA-LICENSE.txt; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/french-ipa-index.tsv.gz?verify=$GITHUB_SHA" -o "$LIVE/french-ipa-index.tsv.gz"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/cover.webp?verify=$GITHUB_SHA" -o "$LIVE/cover.webp"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/DWSS-Android-Installer.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-Installer.apk"
          grep -Fxq 'Version: 0.9.116' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_116' "$LIVE/index.html"
          grep -Fq 'id="resultFrenchReading"' "$LIVE/index.html"
          grep -Fq 'id="pronunciationFrenchSearch"' "$LIVE/index.html"
          grep -Fq 'id="dwssMainLanguagePicker"' "$LIVE/index.html"
          grep -Fq 'id="dwssPronunciationMode"' "$LIVE/index.html"
          grep -Fq 'id="dwssSaveFrenchCorrection"' "$LIVE/index.html"
          grep -Fq "version:'0.9.116'" "$LIVE/app.js"
          grep -Fq "const APP_VERSION = '0.9.116';" "$LIVE/sw.js"
          grep -Fq "'./french-ipa-index.tsv.gz'" "$LIVE/sw.js"
          grep -Fq "'./french-extension.js'" "$LIVE/sw.js"
          test "$(sha256sum "$LIVE/cover.webp" | cut -d' ' -f1)" = 'b6bce40baebb9b645e1d4ccac588e6c18291a0dca50fd8aa3aaca73fcb707a1a'
          test "$(sha256sum "$LIVE/DWSS-Android-Installer.apk" | cut -d' ' -f1)" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          node --check "$LIVE/app.js"
          node --check "$LIVE/shared-lexicon.js"
          node --check "$LIVE/sw.js"
          node --check "$LIVE/french-extension.js"
          gzip -t "$LIVE/french-ipa-index.tsv.gz"
          mkdir -p public
          cp "$LIVE/"* public/
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0116_french_extension.cjs
          echo 'PASS: live DWSS 0.9.116 French translation, French pronunciation lookup, offline lexicon, shared French corrections and protected cover/APK verified.'

