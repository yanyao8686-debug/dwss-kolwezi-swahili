name: Deploy DWSS 0.9.75 automatic new-term pronunciation index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0975-auto-index-new-terms.yml'
      - 'scripts/fix_dwss_0975_auto_index_new_terms.py'
      - 'scripts/test_dwss_0975_auto_index_new_terms.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download and verify live 0.9.74 website baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          mkdir -p public
          curl -fsSL --retry 8 --retry-delay 2 --max-time 30 "$BASE/VERSION.txt?baseline=$GITHUB_SHA" -o public/VERSION.txt
          grep -Fq 'Version: 0.9.74' public/VERSION.txt || { echo 'Expected live 0.9.74 baseline'; cat public/VERSION.txt; exit 1; }
          for file in index.html app.js boot.js pwa.js sw.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js manifest.webmanifest hanzi-pinyin.js pronunciation-search.js icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 8 --retry-delay 2 --max-time 90 "$BASE/$file?baseline=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
          gzip -t public/dictionary.js.gz
          grep -Fq "const APP_VERSION = '0.9.74';" public/sw.js
          grep -Fq 'DWSSPronunciationSearch=' public/pronunciation-search.js

      - name: Apply automatic pronunciation indexing for all new terms
        env:
          DWSS_PUBLIC_DIR: public
        run: python3 scripts/fix_dwss_0975_auto_index_new_terms.py

      - name: Run full lexicon and future-term regression tests
        shell: bash
        env:
          DWSS_PUBLIC_DIR: public
        run: |
          set -euo pipefail
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js pronunciation-search.js hanzi-pinyin.js; do
            node --check "public/$file"
          done
          node scripts/test_dwss_0975_auto_index_new_terms.cjs
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import gzip,json,re
          p=Path("public")
          html=(p/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=[]
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs)
                  if "id" in values:self.ids.append(values["id"])
          a=Audit();a.feed(html)
          dup={k:v for k,v in Counter(a.ids).items() if v>1}
          if dup:raise SystemExit("Duplicate HTML IDs: "+str(dup))
          sw=(p/"sw.js").read_text(encoding="utf-8")
          m=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not m:raise SystemExit("Service Worker precache array is missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",m.group(1))
          missing=[u for u in urls if u not in ("./",".") and not (p/u.removeprefix("./")).is_file()]
          if missing:raise SystemExit("Missing precache assets: "+str(missing))
          for required in ("./dictionary.js.gz","./hanzi-pinyin.js","./pronunciation-search.js"):
              if required not in urls:raise SystemExit("Required precache asset missing: "+required)
          if "./dictionary.js" in urls:raise SystemExit("Invalid plain dictionary.js precache URL")
          gzip.decompress((p/"dictionary.js.gz").read_bytes())
          manifest=json.loads((p/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("id")!="./?app=dwss-kolwezi-swahili":raise SystemExit("PWA ID changed")
          if manifest.get("display")!="standalone":raise SystemExit("PWA display changed")
          if manifest.get("name")!="刚果金斯语翻译":raise SystemExit("PWA name changed")
          (p/".nojekyll").touch()
          print(f"PASS: {len(urls)} precache assets exist; all new-term indexing hooks and PWA assets verified.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.75
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live 0.9.75 and automatic new-term search
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          TMP="$RUNNER_TEMP/dwss-live-0975"
          mkdir -p "$TMP"
          for file in VERSION.txt index.html app.js boot.js sw.js manifest.webmanifest hanzi-pinyin.js pronunciation-search.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 45 "$BASE/$file?verify=$GITHUB_SHA" -o "$TMP/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/dictionary.js.gz?verify=$GITHUB_SHA" -o "$TMP/dictionary.js.gz"
          grep -Fq 'Version: 0.9.75' "$TMP/VERSION.txt"
          grep -Fq "const APP_VERSION = '0.9.75';" "$TMP/sw.js"
          grep -Fq "window.addEventListener('dwss:personal-term-added',refreshPronunciationLookup)" "$TMP/app.js"
          grep -Fq "window.addEventListener('dwss:personal-term-removed',refreshPronunciationLookup)" "$TMP/app.js"
          grep -Fq "const entries=all.map(item=>({zh:item.zh" "$TMP/app.js"
          DWSS_PUBLIC_DIR="$TMP" node scripts/test_dwss_0975_auto_index_new_terms.cjs
          echo 'PASS: live lookup automatically includes every new personal term after add/edit/import and removes deleted terms.'
