name: Deploy DWSS 0.9.76 pronunciation screen cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0976-pronunciation-screen-clear.yml'
      - 'scripts/fix_dwss_0976_pronunciation_screen_clear.py'
      - 'scripts/test_dwss_0976_pronunciation_screen_clear.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Download and validate live 0.9.75 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          mkdir -p public
          curl -fsSL --retry 8 --retry-delay 2 --max-time 30 "$BASE/VERSION.txt?baseline=$GITHUB_SHA" -o public/VERSION.txt
          grep -Fq 'Version: 0.9.75' public/VERSION.txt || { echo 'Expected live 0.9.75 baseline'; cat public/VERSION.txt; exit 1; }
          for file in index.html app.js boot.js pwa.js sw.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js manifest.webmanifest hanzi-pinyin.js pronunciation-search.js icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 8 --retry-delay 2 --max-time 90 "$BASE/$file?baseline=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
          gzip -t public/dictionary.js.gz
          grep -Fq "const APP_VERSION = '0.9.75';" public/sw.js
      - name: Apply pronunciation screen cleanup and clear-input fix
        env:
          DWSS_PUBLIC_DIR: public
        run: python3 scripts/fix_dwss_0976_pronunciation_screen_clear.py
      - name: Run JavaScript, pronunciation, HTML and clear-button regressions
        shell: bash
        env:
          DWSS_PUBLIC_DIR: public
        run: |
          set -euo pipefail
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js pronunciation-search.js hanzi-pinyin.js; do
            node --check "public/$file"
          done
          node scripts/test_dwss_0976_pronunciation_screen_clear.cjs
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import gzip,json,re
          p=Path("public")
          html=(p/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):super().__init__();self.ids=[];self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs)
                  if "id" in values:self.ids.append(values["id"])
                  if tag=="button" and "data-tab" in values:self.tabs.append(values["data-tab"])
          a=Audit();a.feed(html)
          dup={k:v for k,v in Counter(a.ids).items() if v>1}
          if dup:raise SystemExit("Duplicate HTML IDs: "+str(dup))
          if a.tabs[:3]!=["maintenance","pronunciation","saved"]:raise SystemExit("Unexpected tab order: "+str(a.tabs))
          sw=(p/"sw.js").read_text(encoding="utf-8")
          m=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not m:raise SystemExit("Service Worker precache array missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",m.group(1))
          missing=[u for u in urls if u not in ("./",".") and not (p/u.removeprefix("./")).is_file()]
          if missing:raise SystemExit("Missing precache assets: "+str(missing))
          for required in ("./dictionary.js.gz","./hanzi-pinyin.js","./pronunciation-search.js"):
              if required not in urls:raise SystemExit("Required precache missing: "+required)
          gzip.decompress((p/"dictionary.js.gz").read_bytes())
          manifest=json.loads((p/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("id")!="./?app=dwss-kolwezi-swahili":raise SystemExit("PWA identity changed")
          if manifest.get("display")!="standalone":raise SystemExit("PWA display changed")
          if manifest.get("name")!="刚果金斯语翻译":raise SystemExit("PWA name changed")
          (p/".nojekyll").touch()
          print(f"PASS: {len(urls)} cache URLs exist; unique HTML IDs, pinyin assets and PWA identity verified.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy DWSS 0.9.76
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live 0.9.76 UI and clear-input behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          TMP="$RUNNER_TEMP/dwss-live-0976"
          mkdir -p "$TMP"
          for file in VERSION.txt index.html app.js boot.js sw.js manifest.webmanifest hanzi-pinyin.js pronunciation-search.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 45 "$BASE/$file?verify=$GITHUB_SHA" -o "$TMP/$file"
          done
          grep -Fq 'Version: 0.9.76' "$TMP/VERSION.txt"
          grep -Fq 'content="0.9.76">' "$TMP/index.html"
          grep -Fq "const APP_VERSION = '0.9.76';" "$TMP/sw.js"
          grep -Fq "pronunciationInput.value='';renderPronunciationLookup();" "$TMP/app.js"
          if grep -Fq '支持同音字与近似读音' "$TMP/index.html"; then echo 'Removed helper copy still present'; exit 1; fi
          DWSS_PUBLIC_DIR="$TMP" node scripts/test_dwss_0976_pronunciation_screen_clear.cjs
          echo 'PASS: live 0.9.76 has a compact pronunciation panel and Clear All resets its query input.'
