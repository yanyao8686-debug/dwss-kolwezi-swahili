name: Deploy DWSS 0.9.120 French sentence translation and IPA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0120-french-machine-translation.yml'
      - 'scripts/prepare_dwss_0120_french_machine_translation.py'
      - 'scripts/test_dwss_0120_french_machine_translation.cjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0120-french-machine-translation
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Python build dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check 'pypinyin==0.54.0'

      - name: Build 0.9.120 from live 0.9.119 and add sentence-level French translation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_dwss_0120_french_machine_translation.py
          .venv/bin/python scripts/prepare_dwss_0120_french_machine_translation.py
          python3 -m py_compile scripts/prepare_dwss_0120_french_machine_translation.py
          node --check public/app.js
          node --check public/shared-lexicon.js
          node --check public/sw.js
          node --check public/french-extension.js
          node --check scripts/test_dwss_0120_french_machine_translation.cjs
          gzip -t public/french-gloss-index.tsv.gz
          gzip -t public/french-ipa-index.tsv.gz
          find public/french-pronunciation-shards -type f -name '*.tsv.gz' -print0 | xargs -0 -n 1 gzip -t
          find public/french-word-shards -type f -name '*.tsv.gz' -print0 | xargs -0 -n 1 gzip -t
          unzip -t public/DWSS-Android-Installer.apk >/dev/null
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0120_french_machine_translation.cjs
          touch public/.nojekyll

      - name: Audit unique HTML IDs, original navigation, French controls and cloud corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          root=Path('public')
          html=(root/'index.html').read_text(encoding='utf-8')
          app=(root/'app.js').read_text(encoding='utf-8')
          class Audit(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if a.get('id'): self.ids.append(a['id'])
                  if tag=='button' and a.get('data-tab'): self.tabs.append(a['data-tab'])
          audit=Audit(); audit.feed(html)
          dup=[k for k,v in Counter(audit.ids).items() if v>1]
          if dup: raise SystemExit('Duplicate HTML IDs: '+str(dup))
          if audit.tabs[:2] != ['pronunciation','saved']: raise SystemExit('Original primary navigation changed')
          for token in ('id="resultFrenchReading"','id="pronunciationFrenchSearch"','id="dwssMainLanguagePicker"','id="dwssPronunciationMode"','id="dwssSaveFrenchCorrection"','DWSS_AUTO_UPDATE_0_9_119'):
              if token not in html: raise SystemExit('French feature or version marker missing: '+token)
          for token in ("french:String(t.french_text||'').trim()","french:String(c.french||'').trim()","frenchReadingZh:String(c.frenchReadingZh||'').trim()"):
              if token not in app: raise SystemExit('French shared readback mapping missing: '+token)
          meta=json.loads((root/'french-pronunciation-index.json').read_text(encoding='utf-8'))
          if meta.get('formsWithIpa',0)<2000000 or meta.get('indexedRows',0)!=meta.get('formsWithIpa'):
              raise SystemExit('LeXiK index counts invalid')
          print('PASS: unique IDs, existing navigation, French panels, cloud corrections and 2m+ LeXiK pronunciation index.')
          PY

      - name: Upload DWSS Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.120
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live 0.9.120, LeXiK bootstrap, sample pronunciation shards and unchanged Android package
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0120"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js shared-lexicon.js sw.js french-extension.js french-lexicon-sources.txt french-LEXIK-LICENSE.txt manifest.webmanifest; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          for file in french-gloss-index.tsv.gz french-pronunciation-index.json french-word-index.json french-translation-runtime.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/french-pronunciation-shards/bang.tsv.gz?verify=$GITHUB_SHA" -o "$LIVE/bang.tsv.gz"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/french-pronunciation-shards/mai.tsv.gz?verify=$GITHUB_SHA" -o "$LIVE/mai.tsv.gz"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/french-word-shards/bo.tsv.gz?verify=$GITHUB_SHA" -o "$LIVE/word-bo.tsv.gz"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/french-word-shards/me.tsv.gz?verify=$GITHUB_SHA" -o "$LIVE/word-me.tsv.gz"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/cover.webp?verify=$GITHUB_SHA" -o "$LIVE/cover.webp"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/DWSS-Android-Installer.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-Installer.apk"
          grep -Fxq 'Version: 0.9.120' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_119' "$LIVE/index.html"
          grep -Fq "version:'0.9.120'" "$LIVE/app.js"
          grep -Fq "const APP_VERSION = '0.9.120';" "$LIVE/sw.js"
          grep -Fq "'./french-gloss-index.tsv.gz'" "$LIVE/sw.js"
          grep -Fq "'./french-pronunciation-index.json'" "$LIVE/sw.js"
          grep -Fq "'./french-word-index.json'" "$LIVE/sw.js"
          grep -Fq "'./french-translation-runtime.js'" "$LIVE/sw.js"
          grep -Fq 'dwss-french-language' "$LIVE/french-translation-runtime.js"
          grep -Fq 'french-translation-runtime.js' "$LIVE/index.html"
          grep -Fq 'LeXiK 1.0' "$LIVE/french-lexicon-sources.txt"
          grep -Fq 'CC BY-SA 4.0' "$LIVE/french-lexicon-sources.txt"
          node --check "$LIVE/app.js"
          node --check "$LIVE/sw.js"
          node --check "$LIVE/french-extension.js"
          node --check "$LIVE/french-translation-runtime.js"
          gzip -t "$LIVE/french-gloss-index.tsv.gz"
          gzip -t "$LIVE/bang.tsv.gz"
          gzip -t "$LIVE/mai.tsv.gz"
          gzip -t "$LIVE/word-bo.tsv.gz"
          gzip -t "$LIVE/word-me.tsv.gz"
          test "$(sha256sum "$LIVE/cover.webp" | cut -d' ' -f1)" = 'b6bce40baebb9b645e1d4ccac588e6c18291a0dca50fd8aa3aaca73fcb707a1a'
          test "$(sha256sum "$LIVE/DWSS-Android-Installer.apk" | cut -d' ' -f1)" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          # Best-effort smoke test: a public mirror may temporarily rate-limit requests.
          KEY=$(sed -n 's/.*PUBLISHABLE_KEY = "\([^"]*\)".*/\1/p' "$LIVE/french-translation-runtime.js")
          if [[ -n "$KEY" ]]; then
            if curl -fsS --max-time 35 -X POST 'https://pautxzcfmtwkaunjxghj.supabase.co/functions/v1/dwss-french-language' \
              -H "Origin: https://yanyao8686-debug.github.io" -H "apikey: $KEY" -H 'Content-Type: application/json' \
              --data '{"action":"translate","text":"你好"}' -o "$LIVE/translation-smoke.json"; then
              python3 - "$LIVE/translation-smoke.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('ok') and d.get('translatedText'):
              print('PASS: no-key Chinese-to-French sentence translation endpoint responded.')
          else:
              print('WARNING: translation endpoint returned an application error:', d.get('error','unknown'))
          PY
            else
              echo '::warning::No-key public translation mirrors did not answer the release smoke test; the deployed UI will show a retryable service error.'
            fi
          fi
          echo 'PASS: live DWSS 0.9.120 translation runtime, spelling-keyed LeXiK IPA shards, glossary, offline cache, cover and unchanged Android APK verified.'
