name: Deploy DWSS 0.9.139 fast offline-aware French translation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0135-number-speed-french.yml'
      - 'scripts/prepare_dwss_0135_number_speed_french.py'
      - 'scripts/test_dwss_0135_number_speed_french.cjs'
      - 'scripts/french-extension-0135.js'
      - 'scripts/french-translation-runtime.js'
      - 'shared-lexicon.js'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0139-local-first-french
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror site, preserve French indexes and build combined result runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_dwss_0135_number_speed_french.py
          python3 scripts/prepare_dwss_0135_number_speed_french.py
          python3 -m py_compile scripts/prepare_dwss_0135_number_speed_french.py
          node --check public/app.js
          node --check public/sw.js
          node --check public/french-extension.js
          node --check public/french-translation-runtime.js

      - name: Run fast/offline French translation regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom@26.1.0
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0135_number_speed_french.cjs
          unzip -t public/DWSS-Android-Installer.apk >/dev/null

      - name: Upload DWSS Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.139
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify fast/offline French translation and protected assets
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0139"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js sw.js shared-lexicon.js french-extension.js french-translation-runtime.js cover.webp DWSS-Android-Installer.apk; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          grep -Fxq 'Version: 0.9.139' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_138' "$LIVE/index.html"
          grep -Fq "version:'0.9.139'" "$LIVE/app.js"
          grep -Fq "const APP_VERSION = '0.9.139';" "$LIVE/sw.js"
          grep -Fq 'id="dwss-french-compact-ui-0122"' "$LIVE/index.html"
          grep -Fq 'id="dwss-french-single-result-0123"' "$LIVE/index.html"
          grep -Fq '法语优先使用本机词库；未收录内容联网后调用机器翻译服务。' "$LIVE/french-translation-runtime.js"
          grep -Fq 'function setupFrenchPronunciationEditor()' "$LIVE/french-extension.js"
          grep -Fq 'submitFrenchPronunciationCorrection' "$LIVE/french-extension.js"
          grep -Fq 'async function submitFrenchPronunciationCorrection(entry)' "$LIVE/shared-lexicon.js"
          grep -Fq 'french_pronunciation_cn: reading' "$LIVE/shared-lexicon.js"
          grep -Fq 'normalizeSharedText(item.french_pronunciation_cn) === normalizeSharedText(reading)' "$LIVE/shared-lexicon.js"
          ! grep -Fq 'french_pronunciation_cn || item.local_pronunciation_cn' "$LIVE/shared-lexicon.js"
          grep -Fq 'class="translation-correction-panel"' "$LIVE/french-extension.js"
          grep -Fq 'class="translation-correction-actions"' "$LIVE/french-extension.js"
          grep -Fq 'class="primary mini"' "$LIVE/french-extension.js"
          grep -Fq 'id="dwssFrenchPronunciationSave"' "$LIVE/french-extension.js"
          grep -Fq 'const reading = String(output.value || "").trim();' "$LIVE/french-extension.js"
          ! grep -Fq 'dwssFrenchPronunciationValue' "$LIVE/french-extension.js"
          ! grep -Fq 'dwssFrenchPronunciationEdit' "$LIVE/french-extension.js"
          grep -Fq 'output.readOnly = false;' "$LIVE/french-translation-runtime.js"
          grep -Fq 'mirrorSwahiliResultStyle' "$LIVE/french-translation-runtime.js"
          ! grep -Fq 'if(frenchMatch){' "$LIVE/app.js"
          grep -Fq '斯语翻译只使用科卢韦齐当地斯语词条和对应中文谐音。法语词条及法语中文谐音只在法语翻译选项中使用，两种语言分别保存、互不替代。系统不会自动猜测当地读音。重要安保指令请当地人员复核。' "$LIVE/index.html"
          grep -Fq 'queue.unshift(payload)' "$LIVE/shared-lexicon.js"
          ! grep -Fq 'await autoCheckFrenchGrammar(french, requestId)' "$LIVE/french-translation-runtime.js"
          ! grep -Fq 'grammarButton.textContent = "检查法语语法"' "$LIVE/french-translation-runtime.js"
          ! grep -Fq 'runGrammarCheck' "$LIVE/french-translation-runtime.js"
          ! grep -Fq 'id="dwssFrenchCorrectionPanel"' "$LIVE/index.html"
          ! grep -Fq 'id="dwssSaveFrenchCorrection"' "$LIVE/index.html"
          grep -Fq 'id="dwss-french-ux-0125"' "$LIVE/index.html"
          grep -Fq '#resultCard[data-dwss-lang="fr"] > .segmentlist' "$LIVE/index.html"
          grep -Fq '#resultCard[data-dwss-lang="fr"] > .quality-note' "$LIVE/index.html"
          grep -Fq 'background:#FFF0D2!important' "$LIVE/index.html"
          grep -Fq 'id="singleReadingGlossLabel"' "$LIVE/index.html"
          grep -Fq 'id="dwss-dual-language-gloss-0126"' "$LIVE/index.html"
          grep -Fq 'window.DWSSRenderTranslation = () => renderTranslation({recordHistory:false});' "$LIVE/app.js"
          grep -Fq 'renderFrenchSingleGloss' "$LIVE/french-extension.js"
          grep -Fq '法语逐词对照：' "$LIVE/french-extension.js"
          grep -Fq 'window.DWSSRenderTranslation();' "$LIVE/french-extension.js"
          grep -Fq 'machine.scheduleTranslation(50)' "$LIVE/french-extension.js"
          grep -Fq 'glossSegments.push({ type: "match", zh: matched, record });' "$LIVE/french-extension.js"
          grep -Fq 'searchFrenchCandidates(query, candidates, engine, 20)' "$LIVE/french-extension.js"
          grep -Fq 'nearFirstKeys' "$LIVE/french-extension.js"
          grep -Fq 'minimumScore = 0.84' "$LIVE/french-extension.js"
          grep -Fq '输入听到却不懂意思的法语中文谐音时，即便是同音不同字的中文，系统也会自动查询近似的读音来匹配对应发音的法语' "$LIVE/french-extension.js"
          grep -Fq 'function formatCombinedResult(_french, reading)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'return String(reading || "").trim();' "$LIVE/french-translation-runtime.js"
          grep -Fq 'glossTools.renderSingleGloss(lastChinese, french);' "$LIVE/french-translation-runtime.js"
          grep -Fq 'enrichedGlossTools.renderSingleGloss(lastChinese, french, enriched.wordReadings);' "$LIVE/french-translation-runtime.js"
          grep -Fq 'expandFrenchNumerals(rawFrench)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'numeralTools.isNumericExpression(chinese)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'const immediate = tools.translateOfflineChinese(chinese)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'localPreviewCompleteChinese' "$LIVE/french-translation-runtime.js"
          grep -Fq 'await localTools.prepareOfflineChinese(chinese)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'function parseNumberAt(text, start)' "$LIVE/french-extension.js"
          grep -Fq 'function expandFrenchNumerals(value)' "$LIVE/french-extension.js"
          grep -Fq 'function frenchIntegerToWords(n)' "$LIVE/french-extension.js"
          grep -Fq 'output.placeholder = "输入中文后翻译结果中文谐音会显示在这里";' "$LIVE/french-translation-runtime.js"
          grep -Fq 'function renderFrenchSingleGloss(raw, frenchOriginal, enrichedWordReadings)' "$LIVE/french-extension.js"
          grep -Fq 'host.innerHTML = pairs.map(pair =>' "$LIVE/french-extension.js"
          grep -Fq 'function tokenizeFrenchPhrase(value)' "$LIVE/french-extension.js"
          grep -Fq 'function buildFrenchWordReadingLookup(sourceRows)' "$LIVE/french-extension.js"
          grep -Fq 'function buildFrenchWordPairs(phrase, wordLookup, glossSegments, enrichedWordReadings)' "$LIVE/french-extension.js"
          ! grep -Fq 'originalMarkup' "$LIVE/french-extension.js"
          ! grep -Fq 'dwss-french-original-in-gloss' "$LIVE/french-extension.js"
          grep -Fq '法语逐词对照：' "$LIVE/french-extension.js"
          grep -Fq 'id="dwss-french-word-pairs-0132"' "$LIVE/index.html"
          grep -Fq 'grid-template-columns:repeat(2,minmax(0,1fr))!important' "$LIVE/index.html"
          grep -Fq 'translateOfflineChinese(raw)' "$LIVE/french-extension.js"
          grep -Fq 'refreshActiveMeaningIndex()' "$LIVE/french-extension.js"
          grep -Fq 'activeRowsSignature' "$LIVE/french-extension.js"
          grep -Fq 'const all = (shared.getTerms() || []).filter(item => item && item.source_language === "fr")' "$LIVE/french-extension.js"
          grep -Fq 'item.french_pronunciation_cn || item.frenchReadingZh' "$LIVE/french-extension.js"
          ! grep -Fq 'item.french_pronunciation_cn || item.local_pronunciation_cn' "$LIVE/french-extension.js"
          grep -Fq 'api.frenchReading(word)' "$LIVE/french-extension.js"
          grep -Fq 'getPhraseWordPairs(phrase)' "$LIVE/french-extension.js"
          grep -Fq 'chineseMatcherCache = new WeakMap()' "$LIVE/french-extension.js"
          grep -Fq 'PERSISTED_CACHE_KEY' "$LIVE/french-translation-runtime.js"
          grep -Fq 'showInstantLocalDraft(chinese)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'buildLocalPhraseReading(french)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'scheduleTranslation(60)' "$LIVE/french-translation-runtime.js"
          grep -Fq 'french-gloss-index.tsv.gz' "$LIVE/sw.js"
          grep -Fq 'french-pronunciation-index.json' "$LIVE/sw.js"
          grep -Fq 'french-word-index.json' "$LIVE/sw.js"
          grep -Fq 'const GLOSS_URL = "./french-gloss-index.tsv.gz";' "$LIVE/french-extension.js"
          grep -Fq 'const META_URL = "./french-pronunciation-index.json";' "$LIVE/french-extension.js"
          grep -Fq 'buildFrenchGlossLookup(meaningRows)' "$LIVE/french-extension.js"
          grep -Fq 'findFrenchGloss(result.zh)' "$LIVE/french-extension.js"
          grep -Fq 'pronunciation-hit-meaning' "$LIVE/french-extension.js"
          grep -Fq '该法语词形暂未收录中文释义（法中词典没有对应词条）' "$LIVE/french-extension.js"
          grep -Fq 'rowsForShards(shardLines, 24000)' "$LIVE/french-extension.js"
          ! grep -Fq 'const DATA_URL =' "$LIVE/french-extension.js"
          ! grep -Fq 'firstRanges' "$LIVE/french-extension.js"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/french-gloss-index.tsv.gz?verify=$GITHUB_SHA" -o "$LIVE/french-gloss-index.tsv.gz"
          gzip -t "$LIVE/french-gloss-index.tsv.gz"
          gzip -dc "$LIVE/french-gloss-index.tsv.gz" | awk -F '\\t' 'tolower($2)=="bonjour" && $5!="" {found=1} END {exit !found}'
          gzip -dc "$LIVE/french-gloss-index.tsv.gz" | awk -F '\\t' 'tolower($2)=="merci" && $5!="" {found=1} END {exit !found}'
          ! grep -Fq 'combinedOutput.addEventListener("blur"' "$LIVE/french-translation-runtime.js"
          ! grep -Fq '法语整句来源：' "$LIVE/french-translation-runtime.js"
          ! grep -Fq '查看校对建议' "$LIVE/french-translation-runtime.js"
          node --check "$LIVE/app.js"
          node --check "$LIVE/sw.js"
          node --check "$LIVE/french-extension.js"
          node --check "$LIVE/french-translation-runtime.js"
          COVER_SHA="$(sha256sum "$LIVE/cover.webp" | cut -d' ' -f1)"
          APK_SHA="$(sha256sum "$LIVE/DWSS-Android-Installer.apk" | cut -d' ' -f1)"
          echo "Live cover SHA-256: $COVER_SHA"
          echo "Live Android APK SHA-256: $APK_SHA"
          test "$COVER_SHA" = 'b6bce40baebb9b645e1d4ccac588e6c18291a0dca50fd8aa3aaca73fcb707a1a'
          test "$APK_SHA" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          echo "PASS: live DWSS 0.9.139 shows immediate local French dictionary drafts, uses fast parallel cloud translation, stores translated sentences on-device and precaches French base dictionaries for offline lookup. Main UI, cover and Android installer are preserved."
