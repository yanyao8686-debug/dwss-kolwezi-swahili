name: Deploy DWSS 0.9.46 French shared fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-french-fallback-0_9_46.yml'
      - 'scripts/fix_french_entry_cloud_fallback_0_9_46.py'
      - 'scripts/test_french_entry_cloud_fallback_0_9_46.cjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download last verified DWSS 0.9.45 Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: downloaded-pages
          repository: ${{ github.repository }}
          run-id: 40585431801
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, check and test French fallback workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded-pages/artifact.tar
          mkdir -p public
          tar -xf downloaded-pages/artifact.tar -C public
          python3 scripts/fix_french_entry_cloud_fallback_0_9_46.py
          node --check public/app.js
          node --check public/pwa.js
          node --check public/sw.js
          node scripts/test_french_entry_cloud_fallback_0_9_46.cjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path("public")
          app=(p/"app.js").read_text(encoding="utf-8")
          html=(p/"index.html").read_text(encoding="utf-8")
          pwa=(p/"pwa.js").read_text(encoding="utf-8")
          checks={
            "release version": "Version: 0.9.46" in (p/"VERSION.txt").read_text(encoding="utf-8"),
            "service worker version": "const APP_VERSION = '0.9.46';" in (p/"sw.js").read_text(encoding="utf-8"),
            "visible page version": "版本 0.9.46 · DWSS" in html,
            "French form field": 'id="newFrench" maxlength="200"' in html,
            "Swahili pronunciation optional": 'id="newReading" maxlength="200"' in html,
            "dynamic personal/cloud French search": "function frenchFallbackCandidates()" in app,
            "local Swahili priority": "if(localOrigin(item))continue;" in app,
            "French draft preserved by auto-update": "'newFrench'" in pwa,
            "cover exists": (p/"cover.webp").is_file() and (p/"cover.webp").stat().st_size>100000,
            "dictionary exists": (p/"dictionary.js.gz").is_file(),
          }
          for name,ok in checks.items():
            print(("PASS " if ok else "FAIL ")+name)
          failed=[name for name,ok in checks.items() if not ok]
          if failed: raise SystemExit("Release checks failed: "+", ".join(failed))
          PY
          touch public/.nojekyll
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live 0.9.46 assets
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE_URL="${PAGE_URL%/}"
          TMP="${RUNNER_TEMP}/dwss-live-french-fallback"
          mkdir -p "$TMP"
          VERIFIED=0
          for attempt in $(seq 1 24); do
            if curl -fsSL --max-time 20 "$BASE_URL/VERSION.txt?verify=$GITHUB_SHA" -o "$TMP/VERSION.txt" &&
               curl -fsSL --max-time 20 "$BASE_URL/index.html?verify=$GITHUB_SHA" -o "$TMP/index.html" &&
               curl -fsSL --max-time 20 "$BASE_URL/app.js?verify=$GITHUB_SHA" -o "$TMP/app.js" &&
               curl -fsSL --max-time 20 "$BASE_URL/sw.js?verify=$GITHUB_SHA" -o "$TMP/sw.js" &&
               curl -fsSL --max-time 20 "$BASE_URL/pwa.js?verify=$GITHUB_SHA" -o "$TMP/pwa.js"; then
              if grep -Fq 'Version: 0.9.46' "$TMP/VERSION.txt" &&
                 grep -Fq '版本 0.9.46 · DWSS' "$TMP/index.html" &&
                 grep -Fq 'id="newFrench" maxlength="200"' "$TMP/index.html" &&
                 grep -Fq "const APP_VERSION = '0.9.46';" "$TMP/sw.js" &&
                 grep -Fq 'function frenchFallbackCandidates()' "$TMP/app.js" &&
                 grep -Fq "'newFrench'" "$TMP/pwa.js"; then
                VERIFIED=1
                break
              fi
            fi
            echo "Live Pages verification attempt $attempt did not match 0.9.46; retrying."
            sleep 5
          done
          test "$VERIFIED" = "1"
          echo "PASS: live DWSS 0.9.46 form, app.js, pwa.js, sw.js and VERSION.txt verified."
