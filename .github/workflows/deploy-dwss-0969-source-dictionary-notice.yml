name: Deploy DWSS 0.9.69 source dictionary and announcement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0969-source-dictionary-notice.yml'
      - 'scripts/fix_dwss_0969_source_dictionary_notice.py'
      - 'scripts/test_dwss_0969_source_dictionary_notice.cjs'
      - 'data/source_terms_restore_0_9_69.csv'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fetch verified live DWSS baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          mkdir -p public
          curl -fsSL --retry 8 --retry-delay 2 --max-time 30 "$BASE/VERSION.txt?base=$GITHUB_SHA" -o public/VERSION.txt
          if grep -Fq 'Version: 0.9.68' public/VERSION.txt; then
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
            EXPECTED_SW="const APP_VERSION = '0.9.68';"
          elif grep -Fq 'Version: 0.9.69' public/VERSION.txt; then
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
            EXPECTED_SW="const APP_VERSION = '0.9.69';"
          else
            echo 'Unexpected live baseline version:'
            cat public/VERSION.txt
            exit 1
          fi
          for file in index.html manifest.webmanifest boot.js app.js pwa.js sw.js dictionary-overrides.js shared-lexicon.js supabase.min.js dictionary.js.gz icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 6 --retry-delay 2 --max-time 60 "$BASE/$file?base=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
          grep -Fq "$EXPECTED_SW" public/sw.js
          gzip -t public/dictionary.js.gz

      - name: Restore missing source vocabulary and add first-open announcement
        if: steps.baseline.outputs.needs_patch == 'true'
        env:
          DWSS_PUBLIC_DIR: public
          DWSS_REPO_DIR: ${{ github.workspace }}
        run: python3 scripts/fix_dwss_0969_source_dictionary_notice.py

      - name: Syntax and source dictionary regression checks
        shell: bash
        env:
          DWSS_PUBLIC_DIR: public
          DWSS_REPO_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js; do
            node --check "public/$file"
          done
          DWSS_PUBLIC_DIR="$PWD/public" DWSS_REPO_DIR="$PWD" node scripts/test_dwss_0969_source_dictionary_notice.cjs
          gzip -t public/dictionary.js.gz
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import gzip, json, re
          p=Path("public")
          html=(p/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
          audit=Audit();audit.feed(html)
          duplicates={k:v for k,v in Counter(audit.ids).items() if v>1}
          if duplicates:raise SystemExit("duplicate HTML IDs: "+str(duplicates))
          manifest=json.loads((p/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("display")!="standalone":raise SystemExit("Apple PWA standalone mode changed")
          if manifest.get("id")!="./?app=dwss-kolwezi-swahili":raise SystemExit("Apple PWA identity changed")
          if manifest.get("name")!="刚果金斯语翻译":raise SystemExit("PWA app name mismatch")
          source=gzip.decompress((p/"dictionary.js.gz").read_bytes()).decode("utf-8")
          m=re.fullmatch(r"\s*window\.SW_DB\s*=\s*(\[.*\])\s*;\s*",source,re.S)
          if not m:raise SystemExit("Invalid compressed source dictionary")
          db=json.loads(m.group(1))
          if len(db)<2042:raise SystemExit("Dictionary record count unexpectedly low")
          if html.count("dwss-announcement-overlay")<2:raise SystemExit("Closable announcement missing")
          if "我已阅读，进入应用" not in html:raise SystemExit("Announcement close action missing")
          (p/".nojekyll").touch()
          print(f"PASS: {len(db)} dictionary records; source terms, announcement, PWA identity and HTML structure verified.")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.69
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live 0.9.69 resources and original vocabulary
        shell: bash
        env:
          DWSS_REPO_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          TMP="$RUNNER_TEMP/dwss-live-0.9.69"
          mkdir -p "$TMP"
          for file in VERSION.txt index.html manifest.webmanifest boot.js app.js pwa.js sw.js dictionary-overrides.js shared-lexicon.js supabase.min.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 30 "$BASE/$file?verify=$GITHUB_SHA" -o "$TMP/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/dictionary.js.gz?verify=$GITHUB_SHA" -o "$TMP/dictionary.js.gz"
          grep -Fq 'Version: 0.9.69' "$TMP/VERSION.txt"
          grep -Fq "const APP_VERSION = '0.9.69';" "$TMP/sw.js"
          grep -Fq 'dwss-release=0.9.69' "$TMP/index.html"
          grep -Fq 'dwss:announcement-dismissed:0.9.69' "$TMP/index.html"
          grep -Fq '我已阅读，进入应用' "$TMP/index.html"
          grep -Fq '刚果金斯语翻译' "$TMP/manifest.webmanifest"
          if grep -Fq 'DWSS斯语助手' "$TMP/manifest.webmanifest"; then exit 1; fi
          gzip -t "$TMP/dictionary.js.gz"
          DWSS_PUBLIC_DIR="$TMP" DWSS_REPO_DIR="$GITHUB_WORKSPACE" node scripts/test_dwss_0969_source_dictionary_notice.cjs
          echo 'PASS: live 0.9.69 source dictionary, auto-update assets, announcement and Apple PWA entry verified.'
          echo 'Android remains distributed only as the native APK; no iOS package is built.'
