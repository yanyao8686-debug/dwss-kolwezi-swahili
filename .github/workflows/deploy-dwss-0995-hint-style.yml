name: Deploy DWSS 0.9.95 gray correction helper text

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0995-hint-style.yml'
      - 'scripts/prepare_dwss_0995_hint_style.py'
      - 'scripts/test_dwss_0995_hint_style.cjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0995
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download verified DWSS 0.9.94 Pages baseline
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41052804089
          path: .dwss-baseline

      - name: Unpack and verify the full current website
        shell: bash
        run: |
          set -euo pipefail
          test -s .dwss-baseline/artifact.tar
          mkdir -p public
          tar -xf .dwss-baseline/artifact.tar -C public
          for file in index.html app.js boot.js sw.js shared-lexicon.js dictionary-overrides.js dictionary.js.gz manifest.webmanifest VERSION.txt cover.webp DWSS-Android-0.9.80.apk; do
            test -s "public/$file"
          done
          grep -Fxq 'Version: 0.9.94' public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.94';" public/sw.js
          grep -Fq '>提交修正并同步所有用户</button>' public/index.html
          grep -Fq '认为翻译结果错误可自行修改输入框内翻译结果' public/index.html
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-0.9.80.apk >/dev/null

      - name: Increase helper text one size and change it to gray
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_dwss_0995_hint_style.py
          for file in app.js sw.js shared-lexicon.js dictionary-overrides.js boot.js; do
            node --check "public/$file"
          done
          node --check scripts/test_dwss_0995_hint_style.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0995_hint_style.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-0.9.80.apk >/dev/null
          touch public/.nojekyll

      - name: Audit page structure and unchanged functions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          root=Path("public")
          html=(root/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):super().__init__();self.ids=[];self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  if tag=="button" and "data-tab" in a:self.tabs.append(a["data-tab"])
          a=Audit();a.feed(html)
          dup=[k for k,v in Counter(a.ids).items() if v>1]
          if dup:raise SystemExit("Duplicate IDs: "+str(dup))
          if a.tabs[:3] != ["maintenance","pronunciation","saved"]:raise SystemExit("Primary navigation changed")
          for token in ('id="inputText"','id="resultReading"','id="translationPronunciationCandidates"','id="translationPronunciationCandidateList"','id="dwss-apk-download"'):
              if token not in html:raise SystemExit("Missing UI: "+token)
          if 'id="installAppBtn"' in html:raise SystemExit("Obsolete top install prompt returned")
          sw=(root/"sw.js").read_text()
          match=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not match:raise SystemExit("Service Worker precache list missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",match.group(1))
          for asset in ("./dictionary.js.gz","./shared-lexicon.js","./app.js"):
              if asset not in urls:raise SystemExit("Offline cache asset missing: "+asset)
          if any(x.lower().endswith(".apk") for x in urls):raise SystemExit("APK must not be precached")
          manifest=json.loads((root/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("name")!="刚果金斯语翻译":raise SystemExit("PWA app identity changed")
          print("PASS: unique IDs, navigation, candidate UI, cloud assets, PWA identity and compact APK panel.")
          PY

      - name: Upload DWSS Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.95
        uses: actions/deploy-pages@v4

      - name: Verify live helper typography and unchanged button
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0995"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js sw.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          grep -Fxq 'Version: 0.9.95' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_95' "$LIVE/index.html"
          grep -Fq '>提交修正并同步所有用户</button>' "$LIVE/index.html"
          grep -Fq '认为翻译结果错误可自行修改输入框内翻译结果' "$LIVE/index.html"
          grep -Fq 'color:#808080;font-size:10px' "$LIVE/index.html"
          grep -Fq 'justify-content:center' "$LIVE/index.html"
          grep -Fq 'align-items:center' "$LIVE/index.html"
          grep -Fq "button.textContent='提交修正并同步所有用户'" "$LIVE/app.js"
          grep -Fq 'id="translationPronunciationCandidates"' "$LIVE/index.html"
          grep -Fq 'id="dwss-apk-download"' "$LIVE/index.html"
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0995_hint_style.cjs
          node --check "$LIVE/app.js"
          node --check "$LIVE/sw.js"
          echo 'PASS: live DWSS 0.9.95 gray 10px helper text and all existing correction controls verified.'
