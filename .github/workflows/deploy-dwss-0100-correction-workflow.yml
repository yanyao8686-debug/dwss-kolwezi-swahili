name: Deploy DWSS 0.9.114 local-only translation history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0100-correction-workflow.yml'
      - 'scripts/prepare_dwss_0100_correction_workflow.py.gz.b64'
      - 'scripts/test_dwss_0100_correction_workflow.cjs'
      - 'scripts/dwss-pronunciation-controls.js'
      - 'scripts/simplify_dwss_0101_controls.py'
      - 'scripts/test_dwss_0101_controls.cjs'
      - 'scripts/prepare_dwss_0102_inline_pronunciation.py.gz.b64'
      - 'scripts/test_dwss_0102_inline_pronunciation.cjs'
      - 'scripts/prepare_dwss_source_lookup_0_9_104.py'
      - 'scripts/test_dwss_source_lookup_0_9_104.cjs'
      - 'scripts/prepare_dwss_source_review_0_9_105.py.gz.b64'
      - 'scripts/test_dwss_source_review_0_9_105.cjs'
      - 'scripts/prepare_dwss_contextual_add_0_9_107.py.gz.b64'
      - 'scripts/test_dwss_contextual_add_0_9_107.cjs.gz.b64'
      - 'scripts/prepare_dwss_0108_unified_main_editor.py.gz.b64'
      - 'scripts/test_dwss_0108_unified_main_editor.cjs'
      - 'scripts/prepare_dwss_0109_compact_pronunciation_actions.py.gz.b64'
      - 'scripts/test_dwss_0109_compact_pronunciation_actions.cjs'
      - 'scripts/prepare_dwss_0110_remove_more_reading_controls.py'
      - 'scripts/test_dwss_0110_remove_more_reading_controls.cjs'
      - 'scripts/prepare_dwss_0111_professional_visual_refresh.py.gz'
      - 'scripts/test_dwss_0111_professional_visual_refresh.cjs.gz'
      - 'scripts/prepare_dwss_0112_button_layout.py.gz.b64'
      - 'scripts/test_dwss_0112_button_layout.cjs.gz.b64'
      - 'scripts/prepare_dwss_0113_remove_copy_controls.py'
      - 'scripts/test_dwss_0113_remove_copy_controls.cjs'
      - 'scripts/prepare_dwss_0114_local_translation_history.py'
      - 'scripts/test_dwss_0114_local_translation_history.cjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0114-local-history
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download verified DWSS 0.9.113 Pages baseline
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41187238878
          path: .dwss-baseline

      - name: Unpack and verify complete DWSS 0.9.113 baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s .dwss-baseline/artifact.tar
          mkdir -p public
          tar -xf .dwss-baseline/artifact.tar -C public
          for file in index.html app.js pwa.js sw.js boot.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js manifest.webmanifest VERSION.txt cover.webp DWSS-Android-Installer.apk; do
            test -s "public/$file"
          done
          grep -Fxq 'Version: 0.9.113' public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.113';" public/sw.js
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_113' public/index.html
          ! grep -Fq 'id="copyReading"' public/index.html
          ! grep -Fq '复制谐音' public/index.html
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null

      - name: Apply DWSS 0.9.114 local-only translation history capture and search
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_dwss_0114_local_translation_history.py public
          node --check public/app.js
          node --check public/sw.js
          node --check scripts/test_dwss_0114_local_translation_history.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0114_local_translation_history.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null
          touch public/.nojekyll

      - name: Audit core UI, assets, and release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          root=Path('public')
          html=(root/'index.html').read_text(encoding='utf-8')
          sw=(root/'sw.js').read_text(encoding='utf-8')
          class Audit(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.append(a['id'])
                  if tag=='button' and 'data-tab' in a:self.tabs.append(a['data-tab'])
          audit=Audit(); audit.feed(html)
          duplicates=[k for k,v in Counter(audit.ids).items() if v>1]
          if duplicates: raise SystemExit('Duplicate IDs: '+str(duplicates))
          if audit.tabs[:2] != ['pronunciation','saved']: raise SystemExit('Primary navigation changed')
          for token in ('id="inputText"','id="translationCorrectionPanel"','id="translationPronunciationCandidates"','id="translationActionNotice"','id="resultReading"','id="submitTranslationCorrection"','id="translationPronunciationCandidates"','id="sharedVariantEditorDialog"','id="sharedVariantHistoryDialog"','id="translationOverrideHistoryDialog"','id="dwss-apk-download"'):
              if token not in html: raise SystemExit('Missing core element: '+token)
          for token in ('id="restoreTranslationCorrection"','id="viewTranslationCorrectionHistory"','id="viewWithdrawnVariants"','更多读音操作'):
              if token in html: raise SystemExit('Obsolete pronunciation-management UI remains: '+token)
          visual=re.search(r'<style id="dwss-professional-visual-0111">(.*?)</style>',html,re.S)
          if not visual: raise SystemExit('DWSS Professional visual layer missing')
          for color in ('#123657','#174B7A','#D6B66C','#F1F4F8','#FFF8EA','#FFF0D2','#D94C25'):
              if color not in visual.group(1): raise SystemExit('Missing DWSS visual token: '+color)
          if re.search(r'\\.(cover-frame|cover-image|owner-signature|owner-cover-author)',visual.group(1)):
              raise SystemExit('Visual overrides must not target the top cover artwork')
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('theme_color')!='#123657' or manifest.get('background_color')!='#F1F4F8':
              raise SystemExit('PWA theme colors do not match DWSS Professional palette')
          if '<meta name="theme-color" content="#123657">' not in html:
              raise SystemExit('Browser theme color does not match DWSS Professional palette')
          if 'DWSS_AUTO_UPDATE_0_9_114' not in html or "APP_VERSION = '0.9.114'" not in sw:
              raise SystemExit('DWSS 0.9.114 cache/version markers do not match')
          button_layer=re.search(r'<style id="dwss-button-layout-0112">(.*?)</style>',html,re.S)
          if not button_layer: raise SystemExit('DWSS 0.9.112 button layout layer missing')
          for token in ('nav.tabs>.nav-clear-action','.translation-pronunciation-pin','.dict-edit-actions button','.pronunciation-editor-restore','#pronunciation .pronunciation-maintenance-entry'):
              if token not in button_layer.group(1): raise SystemExit('Missing approved button layout selector: '+token)
          for token in ('id="historySearch"','历史记录只保存在当前设备，不会上传云端','id="resultState" hidden aria-hidden="true"','id="resultReading"','id="translationCorrectionPanel"','id="submitTranslationCorrection"','设为首选',"clearButton.textContent='清空输入';",'id="pronunciationResults"','id="openPublicPronunciationEditor"','class="pronunciation-editor-restore"'):
              if token not in html: raise SystemExit('Missing approved UI detail: '+token)
          for token in ('id="copyReading"','复制谐音','.result-title-actions','#copyReading','dwssCopyBound','navigator.clipboard.writeText(value)'):
              if token in html: raise SystemExit('Removed result-copy UI or click-to-copy code remains: '+token)
          app=(root/'app.js').read_text(encoding='utf-8')
          if "$('copyReading')" in app: raise SystemExit('Removed copyReading event binding remains in app.js')
          if html.index('id="openPublicPronunciationEditor"') < html.index('id="pronunciationResults"'):
              raise SystemExit('Pronunciation maintenance entry must follow lookup results')
          if 'DWSS_AUTO_UPDATE_0_9_114' not in html or "APP_VERSION = '0.9.114'" not in sw:
              raise SystemExit('DWSS 0.9.112 cache/version markers do not match')
          if '<div class="footer">' in html: raise SystemExit('Removed footer version line reappeared')
          match=re.search(r'const PRECACHE_URLS = \[(.*?)\];',sw,re.S)
          if not match: raise SystemExit('Service Worker precache missing')
          urls=re.findall(r"""['\"]([^'\"]+)['\"]""",match.group(1))
          for asset in ('./dictionary.js.gz','./shared-lexicon.js','./dictionary-overrides.js','./app.js'):
              if asset not in urls: raise SystemExit('Offline asset missing: '+asset)
          if any(x.lower().endswith('.apk') for x in urls): raise SystemExit('APK must not be precached')
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('name')!='刚果金斯语翻译' or manifest.get('display')!='standalone': raise SystemExit('PWA identity changed')
          if '<button class="tab" data-tab="maintenance">' in html: raise SystemExit('Top Add New Word navigation unexpectedly remains')
          print('PASS: unique IDs, contextual add controls, correction/history UI, offline assets and PWA identity.')
          PY

      - name: Upload DWSS Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.114
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live DWSS 0.9.114 local-only history, unchanged cover and stable Android installer
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0114"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js pwa.js sw.js boot.js pronunciation-search.js dwss-pronunciation-controls.js manifest.webmanifest shared-lexicon.js dictionary-overrides.js dictionary.js.gz cover.webp; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/DWSS-Android-Installer.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-Installer.apk"
          grep -Fxq 'Version: 0.9.114' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_114' "$LIVE/index.html"
          grep -Fq '<style id="dwss-button-layout-0112">' "$LIVE/index.html"
          grep -Fq '<h2>斯语翻译中文谐音：</h2>' "$LIVE/index.html"
          grep -Fq '<span id="resultState" hidden aria-hidden="true"></span>' "$LIVE/index.html"
          grep -Fq 'id="resultReading"' "$LIVE/index.html"
          grep -Fq 'id="historySearch"' "$LIVE/index.html"
          grep -Fq '历史记录只保存在当前设备，不会上传云端' "$LIVE/index.html"
          grep -Fq 'id="translationCorrectionPanel"' "$LIVE/index.html"
          grep -Fq 'id="submitTranslationCorrection"' "$LIVE/index.html"
          ! grep -Fq 'id="copyReading"' "$LIVE/index.html"
          ! grep -Fq '复制谐音' "$LIVE/index.html"
          ! grep -Fq 'result-title-actions' "$LIVE/index.html"
          ! grep -Fq 'dwssCopyBound' "$LIVE/index.html"
          ! grep -Fq 'copyReading' "$LIVE/app.js"
          grep -Fq 'copyBackup' "$LIVE/app.js"
          grep -Fq '设为首选' "$LIVE/index.html"
          grep -Fq "clearButton.textContent='清空输入';" "$LIVE/index.html"
          grep -Fq 'id="pronunciationResults"' "$LIVE/index.html"
          grep -Fq 'id="openPublicPronunciationEditor"' "$LIVE/index.html"
          grep -Fq 'data-dwss-pin' "$LIVE/app.js"
          grep -Fq "button.textContent='设为首选';" "$LIVE/app.js"
          grep -Fq 'pinQuickTranslationPrimary' "$LIVE/shared-lexicon.js"
          test "$(sha256sum "$LIVE/cover.webp" | cut -d' ' -f1)" = 'b6bce40baebb9b645e1d4ccac588e6c18291a0dca50fd8aa3aaca73fcb707a1a'
          test "$(sha256sum "$LIVE/DWSS-Android-Installer.apk" | cut -d' ' -f1)" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          for file in app.js pwa.js sw.js boot.js shared-lexicon.js dictionary-overrides.js dwss-pronunciation-controls.js pronunciation-search.js; do node --check "$LIVE/$file"; done
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0113_remove_copy_controls.cjs
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0114_local_translation_history.cjs
          echo 'PASS: live DWSS 0.9.114 automatically records completed main translations to local-only history, supports local history search, preserves partial-input filtering, and keeps approved UI, correction/sync, cover and Android installer intact.'

      - name: Record live-verified release marker
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dwss-release-proof"
          printf 'DWSS 0.9.114\nCompleted main-page translations are saved automatically only in the current device localStorage when the user leaves the input or closes the app; live typing previews do not save partial fragments. Local history search and up to 200 recent unique entries are available. No translation history is sent to Supabase. The DWSS cover and Android installer remain byte-identical to the prior release.\nCommit: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/dwss-release-proof/0.9.114.txt"
          encoded="$(base64 -w0 "$RUNNER_TEMP/dwss-release-proof/0.9.114.txt")"
          proof_path=".release-verification/0.9.114.txt"
          existing_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$proof_path?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$proof_path" -f message="Record live-verified DWSS 0.9.114 local-only translation history" -f content="$encoded" -f branch=main -f sha="$existing_sha"
          else
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$proof_path" -f message="Record live-verified DWSS 0.9.114 local-only translation history" -f content="$encoded" -f branch=main
          fi
