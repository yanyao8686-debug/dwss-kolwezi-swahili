      - name: Audit core UI, assets, and release identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          root=Path('public')
          html=(root/'index.html').read_text(encoding='utf-8')
          sw=(root/'sw.js').read_text(encoding='utf-8')
          class Audit(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[]; self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if 'id' in a:self.ids.append(a['id'])
                  if tag=='button' and 'data-tab' in a:self.tabs.append(a['data-tab'])
          audit=Audit(); audit.feed(html)
          duplicates=[k for k,v in Counter(audit.ids).items() if v>1]
          if duplicates: raise SystemExit('Duplicate IDs: '+str(duplicates))
          if audit.tabs[:2] != ['pronunciation','saved']: raise SystemExit('Primary navigation changed')
          for token in ('id="inputText"','id="translationCorrectionPanel"','id="translationPronunciationCandidates"','id="translationActionNotice"','id="resultReading"','id="submitTranslationCorrection"','id="translationPronunciationCandidates"','id="sharedVariantEditorDialog"','id="sharedVariantHistoryDialog"','id="translationOverrideHistoryDialog"','id="dwss-apk-download"'):
              if token not in html: raise SystemExit('Missing core element: '+token)
          for token in ('id="restoreTranslationCorrection"','id="viewTranslationCorrectionHistory"','id="viewWithdrawnVariants"','更多读音操作'):
              if token in html: raise SystemExit('Obsolete pronunciation-management UI remains: '+token)
          visual=re.search(r'<style id="dwss-professional-visual-0111">(.*?)</style>',html,re.S)
          if not visual: raise SystemExit('DWSS Professional visual layer missing')
          for color in ('#123657','#174B7A','#D6B66C','#F1F4F8','#FFF8EA','#FFF0D2','#D94C25'):
              if color not in visual.group(1): raise SystemExit('Missing DWSS visual token: '+color)
          if re.search(r'\\.(cover-frame|cover-image|owner-signature|owner-cover-author)',visual.group(1)):
              raise SystemExit('Visual overrides must not target the top cover artwork')
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('theme_color')!='#123657' or manifest.get('background_color')!='#F1F4F8':
              raise SystemExit('PWA theme colors do not match DWSS Professional palette')
          if '<meta name="theme-color" content="#123657">' not in html:
              raise SystemExit('Browser theme color does not match DWSS Professional palette')
          if 'DWSS_AUTO_UPDATE_0_9_114' not in html or "APP_VERSION = '0.9.114'" not in sw:
              raise SystemExit('DWSS 0.9.114 cache/version markers do not match')
          button_layer=re.search(r'<style id="dwss-button-layout-0112">(.*?)</style>',html,re.S)
          if not button_layer: raise SystemExit('DWSS 0.9.112 button layout layer missing')
          for token in ('nav.tabs>.nav-clear-action','.translation-pronunciation-pin','.dict-edit-actions button','.pronunciation-editor-restore','#pronunciation .pronunciation-maintenance-entry'):
              if token not in button_layer.group(1): raise SystemExit('Missing approved button layout selector: '+token)
          for token in ('id="historySearch"','历史记录只保存在当前设备，不会上传云端','id="resultState" hidden aria-hidden="true"','id="resultReading"','id="translationCorrectionPanel"','id="submitTranslationCorrection"','设为首选',"clearButton.textContent='清空输入';",'id="pronunciationResults"','id="openPublicPronunciationEditor"','class="pronunciation-editor-restore"'):
              if token not in html: raise SystemExit('Missing approved UI detail: '+token)
          for token in ('id="copyReading"','复制谐音','.result-title-actions','#copyReading','dwssCopyBound','navigator.clipboard.writeText(value)'):
              if token in html: raise SystemExit('Removed result-copy UI or click-to-copy code remains: '+token)
          app=(root/'app.js').read_text(encoding='utf-8')
          if "$('copyReading')" in app: raise SystemExit('Removed copyReading event binding remains in app.js')
          if html.index('id="openPublicPronunciationEditor"') < html.index('id="pronunciationResults"'):
              raise SystemExit('Pronunciation maintenance entry must follow lookup results')
          if 'DWSS_AUTO_UPDATE_0_9_114' not in html or "APP_VERSION = '0.9.114'" not in sw:
              raise SystemExit('DWSS 0.9.112 cache/version markers do not match')
          if '<div class="footer">' in html: raise SystemExit('Removed footer version line reappeared')
          match=re.search(r'const PRECACHE_URLS = \[(.*?)\];',sw,re.S)
          if not match: raise SystemExit('Service Worker precache missing')
          urls=re.findall(r"""['\"]([^'\"]+)['\"]""",match.group(1))
          for asset in ('./dictionary.js.gz','./shared-lexicon.js','./dictionary-overrides.js','./app.js'):
              if asset not in urls: raise SystemExit('Offline asset missing: '+asset)
          if any(x.lower().endswith('.apk') for x in urls): raise SystemExit('APK must not be precached')
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          if manifest.get('name')!='刚果金斯语翻译' or manifest.get('display')!='standalone': raise SystemExit('PWA identity changed')
          if '<button class="tab" data-tab="maintenance">' in html: raise SystemExit('Top Add New Word navigation unexpectedly remains')
          print('PASS: unique IDs, contextual add controls, correction/history UI, offline assets and PWA identity.')
          PY

