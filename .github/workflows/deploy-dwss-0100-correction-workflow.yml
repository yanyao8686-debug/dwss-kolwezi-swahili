name: Deploy DWSS 0.9.114 local-only translation history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0100-correction-workflow.yml'
      - 'scripts/prepare_dwss_0100_correction_workflow.py.gz.b64'
      - 'scripts/test_dwss_0100_correction_workflow.cjs'
      - 'scripts/dwss-pronunciation-controls.js'
      - 'scripts/simplify_dwss_0101_controls.py'
      - 'scripts/test_dwss_0101_controls.cjs'
      - 'scripts/prepare_dwss_0102_inline_pronunciation.py.gz.b64'
      - 'scripts/test_dwss_0102_inline_pronunciation.cjs'
      - 'scripts/prepare_dwss_source_lookup_0_9_104.py'
      - 'scripts/test_dwss_source_lookup_0_9_104.cjs'
      - 'scripts/prepare_dwss_source_review_0_9_105.py.gz.b64'
      - 'scripts/test_dwss_source_review_0_9_105.cjs'
      - 'scripts/prepare_dwss_contextual_add_0_9_107.py.gz.b64'
      - 'scripts/test_dwss_contextual_add_0_9_107.cjs.gz.b64'
      - 'scripts/prepare_dwss_0108_unified_main_editor.py.gz.b64'
      - 'scripts/test_dwss_0108_unified_main_editor.cjs'
      - 'scripts/prepare_dwss_0109_compact_pronunciation_actions.py.gz.b64'
      - 'scripts/test_dwss_0109_compact_pronunciation_actions.cjs'
      - 'scripts/prepare_dwss_0110_remove_more_reading_controls.py'
      - 'scripts/test_dwss_0110_remove_more_reading_controls.cjs'
      - 'scripts/prepare_dwss_0111_professional_visual_refresh.py.gz'
      - 'scripts/test_dwss_0111_professional_visual_refresh.cjs.gz'
      - 'scripts/prepare_dwss_0112_button_layout.py.gz.b64'
      - 'scripts/test_dwss_0112_button_layout.cjs.gz.b64'
      - 'scripts/prepare_dwss_0113_remove_copy_controls.py'
      - 'scripts/test_dwss_0113_remove_copy_controls.cjs'
      - 'scripts/prepare_dwss_0114_local_translation_history.py'
      - 'scripts/test_dwss_0114_local_translation_history.cjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0114-local-history
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download verified DWSS 0.9.98 Pages baseline
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41057608836
          path: .dwss-baseline

      - name: Unpack and verify complete baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s .dwss-baseline/artifact.tar
          mkdir -p public
          tar -xf .dwss-baseline/artifact.tar -C public
          for file in index.html app.js pwa.js sw.js boot.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js manifest.webmanifest VERSION.txt cover.webp DWSS-Android-Installer.apk; do
            test -s "public/$file"
          done
          grep -Fxq 'Version: 0.9.98' public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.98';" public/sw.js
          grep -Fq '<div class="footer">版本 0.9.98 · 刚果金斯语翻译</div>' public/index.html
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null

      - name: Reconstruct verified 0.9.99 compact-installer baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_dwss_0999_compact_apk_card.py

      - name: Apply DWSS 0.9.100 correction workflow and horizontal candidate rail
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/prepare_dwss_0100_correction_workflow.py.gz.b64 | gzip -d > scripts/prepare_dwss_0100_correction_workflow.py
          python3 scripts/prepare_dwss_0100_correction_workflow.py
          for file in app.js pwa.js sw.js boot.js shared-lexicon.js dictionary-overrides.js; do
            node --check "public/$file"
          done
          node --check scripts/test_dwss_0100_correction_workflow.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0100_correction_workflow.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null

      - name: Simplify pronunciation controls for DWSS 0.9.101
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/simplify_dwss_0101_controls.py
          for file in app.js pwa.js sw.js boot.js shared-lexicon.js dictionary-overrides.js dwss-pronunciation-controls.js; do
            node --check "public/$file"
          done
          node --check scripts/test_dwss_0101_controls.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0101_controls.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null
          touch public/.nojekyll

      - name: Apply DWSS 0.9.102 inline pronunciation editing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/prepare_dwss_0102_inline_pronunciation.py.gz.b64 | gzip -d > scripts/prepare_dwss_0102_inline_pronunciation.py
          python3 scripts/prepare_dwss_0102_inline_pronunciation.py
          for file in app.js pwa.js sw.js boot.js shared-lexicon.js dictionary-overrides.js dwss-pronunciation-controls.js; do
            node --check "public/$file"
          done
          node --check scripts/test_dwss_0102_inline_pronunciation.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0102_inline_pronunciation.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null
          touch public/.nojekyll

      - name: Apply DWSS 0.9.103 original-source lookup repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, json, re, unicodedata
          from pathlib import Path

          root = Path("public")
          def norm(value):
              value = unicodedata.normalize("NFKC", str(value or ""))
              value = re.sub(r"[\s　]+", "", value)
              return re.sub(r"[，。！？；：、,.!?;:（）()“”\"']+", "", value).lower()

          dictionary_path = root / "dictionary.js.gz"
          source = gzip.decompress(dictionary_path.read_bytes()).decode("utf-8")
          prefix = "window.SW_DB = "
          if not source.startswith(prefix):
              raise SystemExit("Unexpected built-in dictionary wrapper")
          rows = json.loads(source[len(prefix):].strip().rstrip(";"))
          if not any(norm(row.get("zh")) == norm("行") for row in rows if isinstance(row, dict)):
              rows.append({
                  "zh": "行",
                  "variants": [{
                      "reading": "马累谢",
                      "source": "文件2《德威安保集团斯瓦西里语参考资料汇编》第11页",
                      "kind": "原始词条（待本地复核）"
                  }],
                  "sourceCategory": "原始资料补录"
              })
              output = prefix + json.dumps(rows, ensure_ascii=False, separators=(",", ":")) + ";\n"
              dictionary_path.write_bytes(gzip.compress(output.encode("utf-8"), compresslevel=9, mtime=0))

          app_path = root / "app.js"
          app = app_path.read_text(encoding="utf-8")
          norm_line = r"""const norm = s => String(s || '').normalize('NFKC').replace(/[\s　]+/g,'').replace(/[，。！？；：、,.!?;:（）()“”"']/g,'').toLowerCase();"""
          alias_line = """const SOURCE_HEADWORD_ALIASES=Object.freeze({'他(她)':['他','她'],'他(她)的':['他的','她的'],'他(她)们':['他们','她们'],'他(她)们的':['他们的','她们的'],'头(脑袋)':['头','脑袋'],'亲戚(亲属)':['亲戚','亲属'],'我不知道、我不懂':['我不知道','我不懂'],'我明白、我懂':['我明白','我懂'],'不、不是、否':['不','不是','否'],'帮助/帮忙':['帮助','帮忙'],'水/水状物':['水','水状物'],'坏掉/死掉':['坏掉','死掉'],'毛石/大石头':['毛石','大石头'],'睡觉、躺下':['睡觉','躺下'],'道路、方法':['道路','方法'],'欢迎(请进来)':['欢迎','请进来']});
          const SOURCE_HEADWORD_ALIAS_INDEX=new Map(Object.entries(SOURCE_HEADWORD_ALIASES).map(([key,values])=>[norm(key),values]));"""
          if "SOURCE_HEADWORD_ALIAS_INDEX" not in app:
              if app.count(norm_line) != 1:
                  raise SystemExit("Cannot locate canonical Chinese normalizer")
              app = app.replace(norm_line, norm_line + "\n" + alias_line, 1)

          old_keys = " all=[...grouped.values()]; map=new Map(all.map(x=>[norm(x.zh),x])); keys=[...all].sort((a,b)=>norm(b.zh).length-norm(a.zh).length);"
          new_keys = """ all=[...grouped.values()];
          map=new Map(all.map(x=>[norm(x.zh),x]));
          const matchEntries=[];
          for(const item of all){
           item.aliases=[];
           const canonicalKey=norm(item.zh);
           matchEntries.push({item,matchKey:item.zh,normalized:canonicalKey});
           for(const alias of (SOURCE_HEADWORD_ALIAS_INDEX.get(canonicalKey)||[])){
            const aliasKey=norm(alias);
            if(!aliasKey||map.has(aliasKey))continue;
            map.set(aliasKey,item);
            item.aliases.push(alias);
            matchEntries.push({item,matchKey:alias,normalized:aliasKey});
           }
          }
          keys=matchEntries.sort((a,b)=>b.normalized.length-a.normalized.length);"""
          if old_keys not in app:
              raise SystemExit("Cannot locate dictionary index construction")
          app = app.replace(old_keys, new_keys, 1)

          span_fn = r'''function normalizedInputSpan(input,index,target){
           const wanted=norm(target);if(!wanted)return 0;
           let accumulated='';
           const maxSpan=Math.min(input.length-index,Math.max(24,wanted.length*4+12));
           for(let offset=0;offset<maxSpan;offset++){
            const ch=input.slice(index+offset,index+offset+1),part=norm(ch);
            if(!part){if(/[\s　()（）“”"'‘’]/.test(ch))continue;return 0;}
            accumulated+=part;
            if(accumulated===wanted)return offset+1;
            if(!wanted.startsWith(accumulated))return 0;
           }
           return 0;
          }'''
          local_fn = r'''function lookupLocalAt(input,index){
           let found=null,foundLen=0,foundRank=99,foundKeyLength=0;
           const rankOf={override:-1,personal:0,shared:1,builtin:2,'pronunciation-variant':3};
           for(const entry of keys){
            const item=entry.item,k=entry.matchKey;if(!item||!k)continue;
            const origin=localOrigin(item);if(!origin)continue;
            const rank=rankOf[origin];if(rank>foundRank)continue;
            const span=normalizedInputSpan(input,index,k);if(!span)continue;
            if(rank<foundRank||(rank===foundRank&&entry.normalized.length>foundKeyLength)){
             found=item;foundLen=span;foundRank=rank;foundKeyLength=entry.normalized.length;
            }
           }
           return found?{item:found,length:foundLen,origin:localOrigin(found)}:null;
          }'''
          french_fn = r'''function lookupFrenchPronunciationAt(input,index){
           let found=null,foundLen=0,foundRank=99,foundKeyLength=0;const rank={personal:0,shared:1,builtin:2};
           for(const entry of keys){
            const item=entry.item,key=String(entry.matchKey||'');if(!item||!key)continue;
            const variants=preferredFrenchPronunciationVariants(item);if(!variants.length)continue;
            const bestRank=Math.min(...variants.map(v=>rank[v.origin]??3));if(bestRank>foundRank)continue;
            const span=normalizedInputSpan(input,index,key);if(!span)continue;
            if(bestRank<foundRank||(bestRank===foundRank&&entry.normalized.length>foundKeyLength)){
             found={item,key,variants};foundLen=span;foundRank=bestRank;foundKeyLength=entry.normalized.length;
            }
           }
           return found?{...found,length:foundLen,readings:found.variants.map(v=>v.frenchReadingZh),source:found.variants.map(v=>v.source||'词库记录').join('；')}:null;
          }'''
          def replace_function(text, name, replacement):
              start = text.index("function " + name + "(")
              end = text.index("\n}", start) + 2
              return text[:start] + replacement + text[end:]

          if "function normalizedInputSpan(" not in app:
              app = app.replace("function lookupLocalAt(input,index){", span_fn + "\nfunction lookupLocalAt(input,index){", 1)
          app = replace_function(app, "lookupLocalAt", local_fn)
          app = replace_function(app, "lookupFrenchPronunciationAt", french_fn)

          old_candidate = " const input=String(raw||'').trim(),key=norm(input);\n if(!key){panel.hidden=true;host.innerHTML='';return;}"
          new_candidate = " const input=String(raw||'').trim(),canonicalInput=String(state&&state.storageChinese||map.get(norm(input))?.zh||input),key=norm(canonicalInput);\n if(!key){panel.hidden=true;host.innerHTML='';return;}"
          if old_candidate not in app: raise SystemExit("Cannot locate candidate lookup normalization")
          app = app.replace(old_candidate, new_candidate, 1)

          old_render = " const exactOverride=publicPronunciationOverrides.get(norm(raw))||null;\n const exactVariants=sharedPronunciationVariants.filter(v=>norm(v.chinese_text)===norm(raw)&&['common','confirmed'].includes(v.status));"
          new_render = " const dictionaryItem=map.get(norm(raw))||null;\n const storageChinese=dictionaryItem?dictionaryItem.zh:raw;\n const exactOverride=publicPronunciationOverrides.get(norm(storageChinese))||null;\n const exactVariants=sharedPronunciationVariants.filter(v=>norm(v.chinese_text)===norm(storageChinese)&&['common','confirmed'].includes(v.status));"
          if old_render not in app: raise SystemExit("Cannot locate exact translation override lookup")
          app = app.replace(old_render, new_render, 1)
          old_duplicate = " const dictionaryItem=map.get(norm(raw))||null;\n const isDictionaryHeadword="
          if old_duplicate not in app: raise SystemExit("Cannot locate duplicate dictionary lookup")
          app = app.replace(old_duplicate, " const isDictionaryHeadword=", 1)
          old_state = " window.DWSSActiveTranslationCorrection={chinese:raw,sourceKind,originalReading,overrideReading:legacyReading,currentReading:displayReading,revision:exactOverride?Number(exactOverride.revision||0):0,hasOverride:!!exactOverride,remoteConflict:false,selectedVariant:null};"
          new_state = " window.DWSSActiveTranslationCorrection={chinese:raw,storageChinese,sourceKind,originalReading,overrideReading:legacyReading,currentReading:displayReading,revision:exactOverride?Number(exactOverride.revision||0):0,hasOverride:!!exactOverride,remoteConflict:false,selectedVariant:null};"
          if old_state not in app: raise SystemExit("Cannot locate active correction state")
          app = app.replace(old_state, new_state, 1)
          app = app.replace(" renderTranslationPronunciationCandidates(raw,window.DWSSActiveTranslationCorrection);", " renderTranslationPronunciationCandidates(storageChinese,window.DWSSActiveTranslationCorrection);", 1)

          old_search = "  x.zh,\n  x.variants.map(v=>v.reading||'').join(' '),"
          new_search = "  x.zh,\n  (x.aliases||[]).join(' '),\n  x.variants.map(v=>v.reading||'').join(' '),"
          if old_search not in app: raise SystemExit("Cannot locate dictionary search fields")
          app = app.replace(old_search, new_search, 1)

          app = app.replace("historyTranslation({chinese_text:state.chinese})", "historyTranslation({chinese_text:state.storageChinese||state.chinese})", 1)
          app = app.replace("restoreTranslationHistory({chinese_text:state.chinese,history_id:historyId", "restoreTranslationHistory({chinese_text:state.storageChinese||state.chinese,history_id:historyId", 1)

          old_save = " const chinese=$('inputText').value.trim(),reading=$('resultReading').value.trim(),button=$('submitTranslationCorrection');\n if(!state||!chinese||norm(chinese)!==norm(state.chinese))"
          new_save = " const typedChinese=$('inputText').value.trim(),chinese=String(state&&state.storageChinese||typedChinese).trim(),reading=$('resultReading').value.trim(),button=$('submitTranslationCorrection');\n if(!state||!typedChinese||norm(typedChinese)!==norm(state.chinese))"
          if old_save not in app: raise SystemExit("Cannot locate main correction save guard")
          app = app.replace(old_save, new_save, 1)

          old_variant = " const state=window.DWSSActiveTranslationCorrection,chinese=$('inputText').value.trim(),reading=$('resultReading').value.trim();\n if(!state||!chinese||norm(chinese)!==norm(state.chinese))"
          new_variant = " const state=window.DWSSActiveTranslationCorrection,typedChinese=$('inputText').value.trim(),chinese=String(state&&state.storageChinese||typedChinese).trim(),reading=$('resultReading').value.trim();\n if(!state||!typedChinese||norm(typedChinese)!==norm(state.chinese))"
          if old_variant not in app: raise SystemExit("Cannot locate new-variant save guard")
          app = app.replace(old_variant, new_variant, 1)

          old_restore = " const chinese=$('inputText').value.trim();\n const button=$('restoreTranslationCorrection');\n if(!state||!state.hasOverride||norm(chinese)!==norm(state.chinese))return;"
          new_restore = " const typedChinese=$('inputText').value.trim();\n const chinese=String(state&&state.storageChinese||typedChinese).trim();\n const button=$('restoreTranslationCorrection');\n if(!state||!state.hasOverride||norm(typedChinese)!==norm(state.chinese))return;"
          if old_restore not in app: raise SystemExit("Cannot locate restore correction guard")
          app = app.replace(old_restore, new_restore, 1)
          app = app.replace("version:'0.9.102'", "version:'0.9.103'", 1)
          app_path.write_text(app, encoding="utf-8")

          index_path = root / "index.html"
          html = index_path.read_text(encoding="utf-8")
          html = html.replace('<meta name="dwss-auto-update" content="0.9.102"><!-- DWSS_AUTO_UPDATE_0_9_102 -->', '<meta name="dwss-auto-update" content="0.9.103"><!-- DWSS_AUTO_UPDATE_0_9_103 -->', 1)
          html = html.replace('<!-- DWSS 0.9.102 inline pronunciation editing -->', '<!-- DWSS 0.9.103 original-source dictionary lookup repair -->', 1)
          html = html.replace('id="apkWebVersion">0.9.102</span>', 'id="apkWebVersion">0.9.103</span>', 1)
          html = html.replace('dwss-release=0.9.102', 'dwss-release=0.9.103')
          if "DWSS_AUTO_UPDATE_0_9_103" not in html:
              raise SystemExit("Failed to update live app version marker")
          index_path.write_text(html, encoding="utf-8")

          sw_path = root / "sw.js"
          sw = sw_path.read_text(encoding="utf-8")
          if "const APP_VERSION = '0.9.102';" not in sw:
              raise SystemExit("Unexpected base Service Worker version")
          sw_path.write_text(sw.replace("const APP_VERSION = '0.9.102';", "const APP_VERSION = '0.9.103';", 1), encoding="utf-8")

          version_path = root / "VERSION.txt"
          version = version_path.read_text(encoding="utf-8")
          if "Version: 0.9.102" not in version:
              raise SystemExit("Unexpected VERSION.txt base version")
          version = version.replace("Version: 0.9.102", "Version: 0.9.103", 1)
          version += "\n0.9.103: Audit the two original source dictionaries; restore the omitted PDF headword 行—马累谢; support curated aliases for composite source headwords such as 他(她)的; normalize actual consumed input spans across parenthetical markers; bind alias-based pronunciation corrections, candidates and history to the canonical source headword.\n"
          version_path.write_text(version, encoding="utf-8")

          assert any(norm(row.get("zh")) == norm("行") for row in rows if isinstance(row, dict))
          assert "SOURCE_HEADWORD_ALIASES" in app and "normalizedInputSpan" in app and "storageChinese" in app
          print("PASS: DWSS 0.9.103 source dictionary aliases, canonical cloud edits and missing PDF term restored.")
          PY
          node --check public/app.js
          node --check public/sw.js
          gzip -t public/dictionary.js.gz
          node - <<'NODE'
          const fs=require('node:fs'),zlib=require('node:zlib'),assert=require('node:assert/strict');
          const app=fs.readFileSync('public/app.js','utf8'),html=fs.readFileSync('public/index.html','utf8'),sw=fs.readFileSync('public/sw.js','utf8');
          const dbText=zlib.gunzipSync(fs.readFileSync('public/dictionary.js.gz')).toString('utf8');
          const db=JSON.parse(dbText.slice('window.SW_DB = '.length).trim().replace(/;$/,''));
          const row=db.find(x=>x.zh==='他(她)的');
          assert.ok(row && row.variants.some(v=>v.reading==='牙 gei'),'original his/hers entry must be preserved');
          assert.ok(db.some(x=>x.zh==='行'&&x.variants.some(v=>v.reading==='马累谢')),'missing PDF page 11 term must be restored');
          for(const word of ['他的','她的','他们','她们','我不懂','水状物','死掉']) assert.ok(app.includes(word),'missing source alias '+word);
          assert.ok(app.includes('normalizedInputSpan')&&app.includes('storageChinese'),'alias lookup and canonical cloud edits must be present');
          assert.ok(html.includes('DWSS_AUTO_UPDATE_0_9_103')&&sw.includes("APP_VERSION = '0.9.103'"),'0.9.103 cache/version markers must match');
          console.log('PASS DWSS 0.9.103 source audit smoke test: original reading, missing PDF term, aliases, canonical correction key and runtime version.');
          NODE

      - name: Apply DWSS 0.9.104 exhaustive source lookup repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_dwss_source_lookup_0_9_104.py public
          node --check public/app.js
          node --check public/sw.js
          node --check scripts/test_dwss_source_lookup_0_9_104.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_source_lookup_0_9_104.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0102_inline_pronunciation.cjs
          gzip -t public/dictionary.js.gz

      - name: Apply DWSS 0.9.105 source-review safeguards
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/prepare_dwss_source_review_0_9_105.py.gz.b64 | gzip -dc > scripts/prepare_dwss_source_review_0_9_105.py
          python3 scripts/prepare_dwss_source_review_0_9_105.py public
          node --check public/app.js
          node --check public/sw.js
          node --check scripts/test_dwss_source_review_0_9_105.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_source_review_0_9_105.cjs
          sed -i "s/'0.9.104'\\]/'0.9.104','0.9.105']/" scripts/test_dwss_0102_inline_pronunciation.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0102_inline_pronunciation.cjs
          gzip -t public/dictionary.js.gz

      - name: Apply DWSS 0.9.107 contextual Add New Word flow (preserve original cover)
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/prepare_dwss_contextual_add_0_9_107.py.gz.b64 | gzip -dc > scripts/prepare_dwss_contextual_add_0_9_107.py
          base64 -d scripts/test_dwss_contextual_add_0_9_107.cjs.gz.b64 | gzip -dc > scripts/test_dwss_contextual_add_0_9_107.cjs
          python3 scripts/prepare_dwss_contextual_add_0_9_107.py public
          node --check public/app.js
          node --check public/sw.js
          node --check scripts/test_dwss_contextual_add_0_9_107.cjs
          DWSS_TEST_ROOT=public node scripts/test_dwss_contextual_add_0_9_107.cjs
          sed -i "s/'0.9.105'\]/'0.9.105','0.9.107']/" scripts/test_dwss_0102_inline_pronunciation.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0102_inline_pronunciation.cjs
          gzip -t public/dictionary.js.gz
          unzip -t public/DWSS-Android-Installer.apk >/dev/null
          touch public/.nojekyll

      - name: Apply DWSS 0.9.108 unified main editor, quick add and shared pin
        shell: bash
        run: |
          set -euo pipefail
          base64 -d scripts/prepare_dwss_0108_unified_main_editor.py.gz.b64 | gzip -dc > scripts/prepare_dwss_0108_unified_main_editor.py
          python3 scripts/prepare_dwss_0108_unified_main_editor.py public
