      - name: Verify live DWSS 0.9.114 local-only history, unchanged cover and stable Android installer
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0114"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js pwa.js sw.js boot.js pronunciation-search.js dwss-pronunciation-controls.js manifest.webmanifest shared-lexicon.js dictionary-overrides.js dictionary.js.gz cover.webp; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/DWSS-Android-Installer.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-Installer.apk"
          grep -Fxq 'Version: 0.9.114' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_114' "$LIVE/index.html"
          grep -Fq '<style id="dwss-button-layout-0112">' "$LIVE/index.html"
          grep -Fq '<h2>斯语翻译中文谐音：</h2>' "$LIVE/index.html"
          grep -Fq '<span id="resultState" hidden aria-hidden="true"></span>' "$LIVE/index.html"
          grep -Fq 'id="resultReading"' "$LIVE/index.html"
          grep -Fq 'id="historySearch"' "$LIVE/index.html"
          grep -Fq '历史记录只保存在当前设备，不会上传云端' "$LIVE/index.html"
          grep -Fq 'id="translationCorrectionPanel"' "$LIVE/index.html"
          grep -Fq 'id="submitTranslationCorrection"' "$LIVE/index.html"
          ! grep -Fq 'id="copyReading"' "$LIVE/index.html"
          ! grep -Fq '复制谐音' "$LIVE/index.html"
          ! grep -Fq 'result-title-actions' "$LIVE/index.html"
          ! grep -Fq 'dwssCopyBound' "$LIVE/index.html"
          ! grep -Fq 'copyReading' "$LIVE/app.js"
          grep -Fq 'copyBackup' "$LIVE/app.js"
          grep -Fq '设为首选' "$LIVE/index.html"
          grep -Fq "clearButton.textContent='清空输入';" "$LIVE/index.html"
          grep -Fq 'id="pronunciationResults"' "$LIVE/index.html"
          grep -Fq 'id="openPublicPronunciationEditor"' "$LIVE/index.html"
          grep -Fq 'data-dwss-pin' "$LIVE/app.js"
          grep -Fq "button.textContent='设为首选';" "$LIVE/app.js"
          grep -Fq 'pinQuickTranslationPrimary' "$LIVE/shared-lexicon.js"
          test "$(sha256sum "$LIVE/cover.webp" | cut -d' ' -f1)" = 'b6bce40baebb9b645e1d4ccac588e6c18291a0dca50fd8aa3aaca73fcb707a1a'
          test "$(sha256sum "$LIVE/DWSS-Android-Installer.apk" | cut -d' ' -f1)" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          for file in app.js pwa.js sw.js boot.js shared-lexicon.js dictionary-overrides.js dwss-pronunciation-controls.js pronunciation-search.js; do node --check "$LIVE/$file"; done
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0113_remove_copy_controls.cjs
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0114_local_translation_history.cjs
          echo 'PASS: live DWSS 0.9.114 automatically records completed main translations to local-only history, supports local history search, preserves partial-input filtering, and keeps approved UI, correction/sync, cover and Android installer intact.'

      - name: Record live-verified release marker
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dwss-release-proof"
          printf 'DWSS 0.9.114\nCompleted main-page translations are saved automatically only in the current device localStorage when the user leaves the input or closes the app; live typing previews do not save partial fragments. Local history search and up to 200 recent unique entries are available. No translation history is sent to Supabase. The DWSS cover and Android installer remain byte-identical to the prior release.\nCommit: %s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/dwss-release-proof/0.9.114.txt"
          encoded="$(base64 -w0 "$RUNNER_TEMP/dwss-release-proof/0.9.114.txt")"
          proof_path=".release-verification/0.9.114.txt"
          existing_sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$proof_path?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$proof_path" -f message="Record live-verified DWSS 0.9.114 local-only translation history" -f content="$encoded" -f branch=main -f sha="$existing_sha"
          else
            gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/$proof_path" -f message="Record live-verified DWSS 0.9.114 local-only translation history" -f content="$encoded" -f branch=main
          fi
