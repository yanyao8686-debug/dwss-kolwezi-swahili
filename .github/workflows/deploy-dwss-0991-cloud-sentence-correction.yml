name: Deploy DWSS 0.9.91 cloud full-sentence pronunciation correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0991-cloud-sentence-correction.yml'
      - 'scripts/prepare_dwss_0991.py'
      - 'scripts/test_dwss_0991_cloud_sentence_correction.cjs'
      - 'supabase/migrations/20261030083302_enable_shared_full_sentence_pronunciation_corrections.sql'
      - 'supabase/migrations/20261030083416_block_public_read_of_pronunciation_correction_history.sql'
      - 'supabase/functions/dwss-edit-dictionary-pronunciation/index.ts'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0991
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download the verified DWSS 0.9.89 Pages baseline
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41014892894
          path: .dwss-baseline

      - name: Unpack and verify the complete Pages baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s .dwss-baseline/artifact.tar
          mkdir -p public
          tar -xf .dwss-baseline/artifact.tar -C public
          for file in index.html app.js boot.js pwa.js sw.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js manifest.webmanifest VERSION.txt cover.webp; do
            test -s "public/$file"
          done
          grep -Fq 'Version: 0.9.89' public/VERSION.txt
          grep -Fq "const APP_VERSION = '0.9.89';" public/sw.js
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_89' public/index.html
          gzip -t public/dictionary.js.gz

      - name: Download the previously verified Android APK
        uses: actions/download-artifact@v4
        with:
          name: 刚果金斯语翻译-Android-APK-0.9.80
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40924384743
          path: .dwss-android-artifact

      - name: Apply the full-sentence editable cloud correction UI
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find .dwss-android-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          printf '%s  %s\n' '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5' "$APK" | sha256sum -c -
          test "$(stat -c%s "$APK")" -eq 5806530
          DWSS_PUBLIC_DIR=public DWSS_APK_SOURCE="$APK" python3 scripts/prepare_dwss_0991.py
          for file in app.js boot.js pwa.js sw.js dictionary-overrides.js; do
            node --check "public/$file"
          done
          node --check scripts/test_dwss_0991_cloud_sentence_correction.cjs
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0991_cloud_sentence_correction.cjs
          unzip -t public/DWSS-Android-0.9.80.apk >/dev/null
          gzip -t public/dictionary.js.gz
          touch public/.nojekyll

      - name: Audit release structure and preservation of current application identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re
          root=Path("public")
          html=(root/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  if tag=="button" and "data-tab" in a:self.tabs.append(a["data-tab"])
          a=Audit();a.feed(html)
          duplicate=[k for k,v in Counter(a.ids).items() if v>1]
          if duplicate:raise SystemExit("Duplicate IDs: "+str(duplicate))
          if a.tabs[:3] != ["maintenance","pronunciation","saved"]:
              raise SystemExit("Primary navigation changed: "+str(a.tabs))
          if 'id="resultReading"' not in html or 'id="translationCorrectionPanel"' not in html:
              raise SystemExit("Translation correction interface is missing")
          if 'id="installAppBtn"' in html:
              raise SystemExit("Obsolete top install prompt remains")
          if 'id="dwss-apk-download"' not in html:
              raise SystemExit("Bottom Android download card is missing")
          sw=(root/"sw.js").read_text(encoding="utf-8")
          m=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not m:raise SystemExit("Service Worker precache list missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",m.group(1))
          for name in ("./dictionary.js.gz","./dictionary-overrides.js","./shared-lexicon.js"):
              if name not in urls:raise SystemExit("Offline resource missing: "+name)
          if any(x.lower().endswith(".apk") for x in urls):
              raise SystemExit("APK must not be stored in the Service Worker cache")
          manifest=json.loads((root/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("name")!="刚果金斯语翻译" or manifest.get("display")!="standalone":
              raise SystemExit("PWA identity changed")
          print("PASS: unique DOM IDs, navigation, offline assets, PWA identity and compact download card.")
          PY

      - name: Upload DWSS 0.9.91 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.91
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the live site, Edge Function CORS and exact APK bytes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0991"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js boot.js pwa.js sw.js dictionary-overrides.js manifest.webmanifest; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/dictionary.js.gz?verify=$GITHUB_SHA" -o "$LIVE/dictionary.js.gz"
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/DWSS-Android-0.9.80.apk?verify=$GITHUB_SHA" -o "$LIVE/DWSS-Android-0.9.80.apk"
          grep -Fxq 'Version: 0.9.91' "$LIVE/VERSION.txt"
          grep -Fq "const APP_VERSION = '0.9.91';" "$LIVE/sw.js"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_91' "$LIVE/index.html"
          grep -Fq '<textarea class="phonetic empty" id="resultReading"' "$LIVE/index.html"
          grep -Fq 'id="submitTranslationCorrection"' "$LIVE/index.html"
          grep -Fq 'id="dwss-apk-download"' "$LIVE/index.html"
          ! grep -Fq 'id="installAppBtn"' "$LIVE/index.html"
          grep -Fq 'updateTranslation:data=>send("update"' "$LIVE/dictionary-overrides.js"
          test "$(stat -c%s "$LIVE/DWSS-Android-0.9.80.apk")" -eq 5806530
          test "$(sha256sum "$LIVE/DWSS-Android-0.9.80.apk" | cut -d' ' -f1)" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          DWSS_PUBLIC_DIR="$LIVE" node scripts/test_dwss_0991_cloud_sentence_correction.cjs
          for file in app.js boot.js pwa.js sw.js dictionary-overrides.js; do
            node --check "$LIVE/$file"
          done
          node --check scripts/test_dwss_0991_cloud_sentence_correction.cjs
          gzip -t "$LIVE/dictionary.js.gz"
          unzip -t "$LIVE/DWSS-Android-0.9.80.apk" >/dev/null

          # Confirm the existing public Edge Function responds to a valid browser preflight.
          EDGE='https://pautxzcfmtwkaunjxghj.supabase.co/functions/v1/dwss-edit-dictionary-pronunciation'
          curl -fsS --max-time 20 -X OPTIONS "$EDGE" \
            -H 'Origin: https://yanyao8686-debug.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: apikey,content-type' \
            -D "$LIVE/edge-cors.headers" -o /dev/null
          grep -Fiq 'Access-Control-Allow-Origin: https://yanyao8686-debug.github.io' "$LIVE/edge-cors.headers"
          echo 'PASS: live DWSS 0.9.91 editable cloud correction UI, Realtime client, Edge Function CORS, offline app and original verified APK.'
