name: Probe official French-Chinese lexicon source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-dwss-french-0116.yml'
      - 'scripts/probe_freedict_source_0116.py'
      - 'scripts/probe_dwss_french_0116.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official FreeDict archive and licence structure
        run: |
          set -euo pipefail
          python3 scripts/probe_dwss_french_0116.py
          python3 scripts/probe_freedict_source_0116.py
