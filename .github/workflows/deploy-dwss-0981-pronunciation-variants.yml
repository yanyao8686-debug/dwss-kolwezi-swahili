name: Deploy DWSS 0.9.81 pronunciation variants
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0981-pronunciation-variants.yml'
      - 'scripts/dwss_0981_payload.part-*.txt'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download exact current website release
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          mkdir -p public
          curl -fsSL --retry 8 --retry-delay 2 --max-time 45 "$BASE/VERSION.txt?baseline=$GITHUB_SHA" -o public/VERSION.txt
          if grep -Fq 'Version: 0.9.80' public/VERSION.txt; then BASELINE='0.9.80'
          elif grep -Fq 'Version: 0.9.81' public/VERSION.txt; then BASELINE='0.9.81'
          else echo 'ERROR: expected 0.9.80 or 0.9.81 baseline'; cat public/VERSION.txt; exit 1; fi
          for file in index.html boot.js app.js pwa.js sw.js dictionary.js.gz dictionary-overrides.js shared-lexicon.js supabase.min.js hanzi-pinyin.js pronunciation-search.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 8 --retry-delay 2 --max-time 90 "$BASE/$file?baseline=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
          gzip -t public/dictionary.js.gz
          if [[ "$BASELINE" == '0.9.80' ]]; then grep -Fq "const APP_VERSION = '0.9.80';" public/sw.js
          else grep -Fq "const APP_VERSION = '0.9.81';" public/sw.js; fi
      - name: Reassemble and validate immutable release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dwss-0981"
          cat scripts/dwss_0981_payload.part-*.txt > "$RUNNER_TEMP/dwss-0981-payload.b64"
          base64 --decode "$RUNNER_TEMP/dwss-0981-payload.b64" > "$RUNNER_TEMP/dwss-0981-payload.tar.xz"
          xz --test "$RUNNER_TEMP/dwss-0981-payload.tar.xz"
          tar -xJf "$RUNNER_TEMP/dwss-0981-payload.tar.xz" -C "$RUNNER_TEMP/dwss-0981"
          for file in payload/index.html payload/app.js payload/shared-lexicon.js payload/pronunciation-search.js scripts/fix_dwss_0981_pronunciation_variants.py tests/test_dwss_0981_pronunciation_variants.cjs supabase/functions/dwss-submit-pronunciation-variant/index.ts; do
            test -s "$RUNNER_TEMP/dwss-0981/$file"
          done
          echo 'PASS: release payload reconstructed and verified.'
      - name: Apply 0.9.81 release
        env:
          DWSS_PUBLIC_DIR: public
          DWSS_RELEASE_PAYLOAD_DIR: ${{ runner.temp }}/dwss-0981/payload
        run: python3 "$RUNNER_TEMP/dwss-0981/scripts/fix_dwss_0981_pronunciation_variants.py"
      - name: Run web syntax and full regression tests
        shell: bash
        env:
          DWSS_PUBLIC_DIR: public
        run: |
          set -euo pipefail
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js pronunciation-search.js hanzi-pinyin.js; do node --check "public/$file"; done
          python3 -m py_compile "$RUNNER_TEMP/dwss-0981/scripts/fix_dwss_0981_pronunciation_variants.py"
          node "$RUNNER_TEMP/dwss-0981/tests/test_dwss_0981_pronunciation_variants.cjs"
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          import gzip,json,re
          p=Path("public")
          html=(p/"index.html").read_text(encoding="utf-8")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.tabs=[]
              def handle_starttag(self,tag,attrs):
                  values=dict(attrs)
                  if "id" in values:self.ids.append(values["id"])
                  if tag=="button" and "data-tab" in values:self.tabs.append(values["data-tab"])
          audit=Audit();audit.feed(html)
          dup={k:v for k,v in Counter(audit.ids).items() if v>1}
          if dup:raise SystemExit("Duplicate HTML IDs: "+str(dup))
          if audit.tabs[:3]!=["maintenance","pronunciation","saved"]:raise SystemExit("Navigation order changed: "+str(audit.tabs))
          sw=(p/"sw.js").read_text(encoding="utf-8")
          match=re.search(r"const PRECACHE_URLS = \[(.*?)\];",sw,re.S)
          if not match:raise SystemExit("Service Worker precache array missing")
          urls=re.findall(r"""['"]([^'"]+)['"]""",match.group(1))
          for asset in ("./dictionary.js.gz","./hanzi-pinyin.js","./pronunciation-search.js","./shared-lexicon.js"):
              if asset not in urls:raise SystemExit("Service Worker precache missing "+asset)
              if not (p/asset.removeprefix("./")).is_file():raise SystemExit("Missing cache asset "+asset)
          if "./dictionary.js" in urls:raise SystemExit("Web PWA must use gzip dictionary, not Android asset")
          gzip.decompress((p/"dictionary.js.gz").read_bytes())
          manifest=json.loads((p/"manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("id")!="./?app=dwss-kolwezi-swahili" or manifest.get("display")!="standalone" or manifest.get("name")!="刚果金斯语翻译": raise SystemExit("PWA identity changed")
          (p/".nojekyll").touch()
          print("PASS: HTML IDs/navigation/PWA identity and offline assets verified.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy DWSS 0.9.81
        uses: actions/deploy-pages@v4
      - name: Verify actual live 0.9.81 resources and behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0981"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js boot.js pwa.js sw.js shared-lexicon.js manifest.webmanifest hanzi-pinyin.js pronunciation-search.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 60 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          curl -fsSL --retry 8 --retry-delay 3 --max-time 90 "$BASE/dictionary.js.gz?verify=$GITHUB_SHA" -o "$LIVE/dictionary.js.gz"
          grep -Fxq 'Version: 0.9.81' "$LIVE/VERSION.txt"
          grep -Fq "const APP_VERSION = '0.9.81';" "$LIVE/sw.js"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_81' "$LIVE/index.html"
          DWSS_PUBLIC_DIR="$LIVE" node "$RUNNER_TEMP/dwss-0981/tests/test_dwss_0981_pronunciation_variants.cjs"
          echo 'PASS: live 0.9.81 variant lookup, pending workflow, offline queue and cache verified.'
