name: Deploy DWSS 0.9.123 combined French result field

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0123-combined-french-result.yml'
      - 'scripts/prepare_dwss_0123_combined_french_result.py'
      - 'scripts/test_dwss_0123_combined_french_result.cjs'
      - 'scripts/french-translation-runtime.js'
      - 'scripts/french-extension-0123.js'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy-0123-french-compact-ui
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror site, preserve French indexes and build combined result runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_dwss_0123_combined_french_result.py
          python3 scripts/prepare_dwss_0123_combined_french_result.py
          python3 -m py_compile scripts/prepare_dwss_0123_combined_french_result.py
          node --check public/app.js
          node --check public/sw.js
          node --check public/french-extension.js
          node --check public/french-translation-runtime.js

      - name: Run DOM, combined French result and sync-parser regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock jsdom@26.1.0
          DWSS_PUBLIC_DIR=public node scripts/test_dwss_0123_combined_french_result.cjs
          unzip -t public/DWSS-Android-Installer.apk >/dev/null

      - name: Upload DWSS Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy DWSS 0.9.123
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live combined French result UI and protected assets
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://yanyao8686-debug.github.io/dwss-kolwezi-swahili'
          LIVE="$RUNNER_TEMP/dwss-live-0123"
          mkdir -p "$LIVE"
          for file in VERSION.txt index.html app.js sw.js french-extension.js french-translation-runtime.js cover.webp DWSS-Android-Installer.apk; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 120 "$BASE/$file?verify=$GITHUB_SHA" -o "$LIVE/$file"
          done
          grep -Fxq 'Version: 0.9.123' "$LIVE/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_123' "$LIVE/index.html"
          grep -Fq "version:'0.9.123'" "$LIVE/app.js"
          grep -Fq "const APP_VERSION = '0.9.123';" "$LIVE/sw.js"
          grep -Fq 'id="dwss-french-compact-ui-0122"' "$LIVE/index.html"
          grep -Fq 'id="dwss-french-single-result-0123"' "$LIVE/index.html"
          grep -Fq '语法检查会将法语文本发送至外部服务。' "$LIVE/french-translation-runtime.js"
          ! grep -Fq '法语整句来源：' "$LIVE/french-translation-runtime.js"
          ! grep -Fq '查看校对建议' "$LIVE/french-translation-runtime.js"
          node --check "$LIVE/app.js"
          node --check "$LIVE/sw.js"
          node --check "$LIVE/french-extension.js"
          node --check "$LIVE/french-translation-runtime.js"
          COVER_SHA="$(sha256sum "$LIVE/cover.webp" | cut -d' ' -f1)"
          APK_SHA="$(sha256sum "$LIVE/DWSS-Android-Installer.apk" | cut -d' ' -f1)"
          echo "Live cover SHA-256: $COVER_SHA"
          echo "Live Android APK SHA-256: $APK_SHA"
          test "$COVER_SHA" = 'b6bce40baebb9b645e1d4ccac588e6c18291a0dca50fd8aa3aaca73fcb707a1a'
          test "$APK_SHA" = '9df93884f7eafe9e3cf8ba77d61c61e7a1b050360be691d1a39e6999e3fa37f5'
          echo 'PASS: live DWSS 0.9.123 combined French result UI, translation/grammar actions, versioning, cover and Android installer verified.'
