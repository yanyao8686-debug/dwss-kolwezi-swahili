name: Build Independent Offline Reader APK

on:
  push:
    branches:
      - temp/offline-reader-1-1-0-apk-build
    paths:
      - 'offline-reader-src/**'
      - 'offline-reader-assets/**'
      - '.github/workflows/build-offline-reader.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble and prepare the generic reader
        shell: bash
        run: |
          set -euo pipefail
          cat offline-reader-src/part-00.b64 offline-reader-src/part-01-*.b64 offline-reader-src/part-02.b64 offline-reader-src/part-03.b64 offline-reader-src/part-04.b64 offline-reader-src/part-05.b64 > /tmp/offline-reader-src.b64
          base64 --decode /tmp/offline-reader-src.b64 > /tmp/offline-reader-src.tar.gz
          echo "5e4a49e648bf6859509fcdd8dabed9ea3a3ce87e4d47126b8bc6381b9f70dd6f  /tmp/offline-reader-src.tar.gz" | sha256sum --check
          mkdir -p build-source
          tar -xzf /tmp/offline-reader-src.tar.gz -C build-source
          PROJECT="build-source/人生指南安卓离线朗读器"
          MAIN="$PROJECT/app/src/main/java/com/guide/offline/MainActivity.kt"
          grep -q '^import android.view.View$' "$MAIN" || sed -i '/^import android.view.Gravity$/a import android.view.View' "$MAIN"
          grep -q '^import android.graphics.Color$' "$MAIN" || sed -i '/^import android.graphics.Typeface$/a import android.graphics.Color' "$MAIN"
          printf '%s' '{"title":"尚未导入文件","sourceType":"empty","pages":[{"pdfPage":1,"title":"开始阅读","text":"欢迎使用离线听读。\\n\\n点击右上角「导入文件」，从手机本地选择 PDF 或 TXT 文档。\\n\\n导入后即可在这里显示原文、选择手机已下载的离线中文声音并开始朗读。"}],"chapters":[{"label":"开始阅读","start":0}]}' > "$PROJECT/app/src/main/assets/book.json"
          python -c 'import json, pathlib, sys, xml.etree.ElementTree as ET; p=pathlib.Path(sys.argv[1]); m=p/"app/src/main/AndroidManifest.xml"; b=json.loads((p/"app/src/main/assets/book.json").read_text()); ET.parse(m); assert len(b["pages"]) == 1 and "导入文件" in b["pages"][0]["text"]; print("PASS | generic local-import first screen, manifest and book data")' "$PROJECT"
          python - "$MAIN" "$PROJECT/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import re, sys
          main_path, gradle_path = map(Path, sys.argv[1:3])
          source = main_path.read_text(encoding="utf-8")
          old_picker = '''type = "*/*"
                      putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/pdf", "text/plain", "text/*"))'''
          new_picker = '''type = "application/pdf"
                      putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("application/pdf", "text/plain"))'''
          if old_picker not in source:
              raise SystemExit("Expected document-picker filter was not found")
          source = source.replace(old_picker, new_picker, 1)
          source = source.replace('"txt", "text", "md", "log" -> readTxt(uri, fileName)', '"txt" -> readTxt(uri, fileName)', 1)
          source, mime_match = re.subn(r'mime\.startsWith\("text/"\)', 'mime == "text/plain"', source, count=1)
          if mime_match != 1:
              raise SystemExit("Broad text MIME fallback was not found")
          source = source.replace(
              'val mime = contentResolver.getType(uri).orEmpty()',
              'val mime = contentResolver.getType(uri).orEmpty().substringBefore(\";\").lowercase(Locale.ROOT)',
              1
          )
          needle = "val newBook = when (extension) {"
          guard = '''val selectedMime = contentResolver.getType(uri).orEmpty().substringBefore(";").lowercase(Locale.ROOT)
                  if (extension in setOf("html", "htm", "xhtml") ||
                      selectedMime == "text/html" || selectedMime == "application/xhtml+xml") {
                      throw IllegalArgumentException("检测到这是 HTML 网页文件，不是 PDF/TXT 文档。请导入原始 PDF 或 TXT 文件。")
                  }
                  '''
          if source.count(needle) != 1:
              raise SystemExit("File import dispatch point was not found exactly once")
          source = source.replace(needle, guard + needle, 1)
          main_path.write_text(source, encoding="utf-8")
          gradle = gradle_path.read_text(encoding="utf-8")
          gradle, code_count = re.subn(r'versionCode\s*=\s*\d+', 'versionCode = 7', gradle, count=1)
          gradle, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.2.4"', gradle, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update app version metadata")
          gradle_path.write_text(gradle, encoding="utf-8")
          check = main_path.read_text(encoding="utf-8")
          assert 'type = "application/pdf"' in check
          assert 'arrayOf("application/pdf", "text/plain")' in check
          assert 'selectedMime == "text/html"' in check
          assert 'mime.startsWith("text/")' not in check
          assert '"txt", "text", "md", "log" -> readTxt' not in check
          print("PASS | PDF/TXT-only picker; HTML and broad text MIME rejected")
          print("PASS | app version 1.2.4")
          PY

          python - "$MAIN" "$PROJECT/app/src/main/java/com/guide/offline/PlaybackService.kt" <<'PY'
          from pathlib import Path
          import sys
          main_path, service_path = map(Path, sys.argv[1:3])
          main = main_path.read_text(encoding="utf-8")
          old_filter = '.filter { it.locale.language.equals("zh", true) && !it.isNetworkConnectionRequired }'
          new_filter = '.filter { isSupportedChineseVoice(it) && !it.isNetworkConnectionRequired }'
          if old_filter not in main:
              raise SystemExit("MainActivity Chinese offline voice filter not found")
          main = main.replace(old_filter, new_filter, 1)
          helper = '''    private fun isSupportedChineseVoice(voice: Voice): Boolean {
                  return voice.locale.language.lowercase(Locale.ROOT) in setOf("zh", "cmn")
              }

          '''
          marker = '    private fun isLikelyFemale(voice: Voice): Boolean {'
          if marker not in main:
              raise SystemExit("MainActivity voice helper insertion point not found")
          main = main.replace(marker, helper + marker, 1)
          old_message = '先点选声音，再按“试听”比较；满意后按“设为默认”。只列出无需联网的音色。'
          new_message = '当前检测到 ${voices.size} 种可离线中文声音。点选后可试听，满意后按“设为默认”；“下载更多声音”可进入手机语音设置。'
          if old_message not in main:
              raise SystemExit("Voice picker help text not found")
          main = main.replace(old_message, new_message, 1)
          old_negative = '''.setNeutralButton("设为默认", null)
                  .setNegativeButton("取消", null)'''
          new_negative = '''.setNeutralButton("设为默认", null)
                  .setNegativeButton("下载更多声音", null)'''
          if old_negative not in main:
              raise SystemExit("Voice picker button block not found")
          main = main.replace(old_negative, new_negative, 1)
          preview_marker = '''                    dialog.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener {
                          val picked = voices[selectedIndex]'''
          preview_replacement = '''                    dialog.getButton(AlertDialog.BUTTON_NEGATIVE).setOnClickListener {
                          dialog.dismiss()
                          openTtsSettings()
                      }
                      dialog.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener {
                          val picked = voices[selectedIndex]'''
          if preview_marker not in main:
              raise SystemExit("Voice picker button callback insertion point not found")
          main = main.replace(preview_marker, preview_replacement, 1)
          main_path.write_text(main, encoding="utf-8")
          service = service_path.read_text(encoding="utf-8")
          old_service_filter = 'it.locale.language.equals("zh", true) && !it.isNetworkConnectionRequired'
          new_service_filter = 'it.locale.language.lowercase(Locale.ROOT) in setOf("zh", "cmn") && !it.isNetworkConnectionRequired'
          if service.count(old_service_filter) != 1:
              raise SystemExit("PlaybackService offline Chinese voice filter not found exactly once")
          service = service.replace(old_service_filter, new_service_filter, 1)
          service_path.write_text(service, encoding="utf-8")
          assert 'isSupportedChineseVoice(it)' in main
          assert 'setOf("zh", "cmn")' in main
          voice_dialog_start = main.index('选择离线中文声音')
          voice_dialog_end = main.index('dialog.show()', voice_dialog_start)
          assert '下载更多声音' in main[voice_dialog_start:voice_dialog_end]
          assert 'setOf("zh", "cmn")' in service
          assert 'locale.language.equals("zh", true)' not in main
          assert 'locale.language.equals("zh", true)' not in service
          print("PASS | TTS voice discovery supports zh and cmn Mandarin locale codes")
          print("PASS | offline voice picker offers preview, default selection and system voice settings")
          print("PASS | background service accepts the selected zh/cmn offline voice")
          PY

          mkdir -p "$PROJECT/app/src/main/res/drawable-nodpi" "$PROJECT/app/src/main/res/drawable" "$PROJECT/app/src/main/res/values-v31"
          base64 --decode offline-reader-assets/reader_cover_192_q30.jpg.b64 > "$PROJECT/app/src/main/res/drawable-nodpi/reader_cover.jpg"
          python -m pip install --user pillow
          python - "$PROJECT/app/src/main/res/drawable-nodpi/reader_cover.jpg" <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, sys
          image_path = Path(sys.argv[1])
          with Image.open(image_path) as image:
              assert image.format == "JPEG", f"unexpected image format: {image.format}"
              assert image.size == (192, 192), f"unexpected image dimensions: {image.size}"
              image.verify()
          data = image_path.read_bytes()
          assert len(data) == 6194, f"cover byte size mismatch: {len(data)}"
          print(f"PASS | valid 192x192 JPEG cover | {len(data)} bytes | SHA256 {hashlib.sha256(data).hexdigest()}")
          PY
          python - "$MAIN" "$PROJECT/app/src/main/AndroidManifest.xml" "$PROJECT/app/src/main/res/values-v31/styles.xml" "$PROJECT/app/src/main/res/drawable/launch_screen.xml" <<'PY'
          from pathlib import Path
          import sys
          main_path, manifest_path, splash_style_path, legacy_splash_path = map(Path, sys.argv[1:5])
          source = main_path.read_text(encoding="utf-8")
          if "import android.widget.ImageView" not in source:
              source = source.replace("import android.widget.LinearLayout", "import android.widget.ImageView\nimport android.widget.LinearLayout", 1)
          old_header = '''        val top = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  val brand = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  brand.addView(text("离线听读", 22f, ink, true))
                  brand.addView(text("PDF · TXT  本地阅读与人声朗读", 11f, muted, false).apply { setPadding(0, dp(2), 0, 0) })
                  top.addView(brand, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
          '''
          new_header = '''        val top = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  val brand = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  val cover = ImageView(this).apply {
                      setImageResource(R.drawable.reader_cover)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      contentDescription = "离线听读封面"
                      background = rounded(0xFF081B3A.toInt(), 10)
                      clipToOutline = true
                  }
                  brand.addView(cover, LinearLayout.LayoutParams(dp(54), dp(54)).apply { rightMargin = dp(10) })
                  val brandText = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  brandText.addView(text("离线听读", 22f, ink, true))
                  brandText.addView(text("PDF · TXT  本地阅读与人声朗读", 11f, muted, false).apply { setPadding(0, dp(2), 0, 0) })
                  brand.addView(brandText, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  top.addView(brand, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
          '''
          if old_header not in source:
              raise SystemExit("Could not locate the app header for cover integration")
          source = source.replace(old_header, new_header, 1)
          main_path.write_text(source, encoding="utf-8")

          manifest = manifest_path.read_text(encoding="utf-8")
          if 'android:icon="@drawable/ic_app"' not in manifest or 'android:roundIcon="@drawable/ic_app"' not in manifest:
              raise SystemExit("Could not locate the launcher icon declarations")
          manifest = manifest.replace('android:icon="@drawable/ic_app"', 'android:icon="@drawable/reader_cover"', 1)
          manifest = manifest.replace('android:roundIcon="@drawable/ic_app"', 'android:roundIcon="@drawable/reader_cover"', 1)
          manifest_path.write_text(manifest, encoding="utf-8")

          splash_style_path.write_text('''<resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:windowSplashScreenBackground">#081B3A</item>
                  <item name="android:windowSplashScreenAnimatedIcon">@drawable/reader_cover</item>
                  <item name="android:windowSplashScreenIconBackgroundColor">#081B3A</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#081B3A</item>
                  <item name="android:navigationBarColor">#081B3A</item>
              </style>
          </resources>''', encoding="utf-8")
          legacy_splash_path.write_text('''<layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/reader_splash_background" />
              <item>
                  <bitmap android:src="@drawable/reader_cover" android:gravity="center" />
              </item>
          </layer-list>''', encoding="utf-8")
          (legacy_splash_path.parent.parent / "values" / "colors.xml").write_text('''<resources>
              <color name="reader_splash_background">#081B3A</color>
          </resources>''', encoding="utf-8")
          print("PASS | selected cover embedded as launcher icon and in-app brand mark")
          print("PASS | Android 12+ splash screen and pre-Android 12 launch background")
          PY

      - name: Compile and verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="build-source/人生指南安卓离线朗读器"
          cd "$PROJECT"
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.reader.offlinereader'" /tmp/apk-badging.txt
          grep -q "versionName='1.2.4'" /tmp/apk-badging.txt
          python - "$PROJECT/app/src/main/java/com/guide/offline/MainActivity.kt" "$PROJECT/app/src/main/java/com/guide/offline/PlaybackService.kt" <<'PY'
          from pathlib import Path
          import sys
          main, service = map(lambda p: Path(p).read_text(encoding="utf-8"), sys.argv[1:3])
          assert 'setOf("zh", "cmn")' in main and 'setOf("zh", "cmn")' in service
          assert '下载更多声音' in main
          assert 'locale.language.equals("zh", true)' not in main + service
          print("PASS | package source voice-selection regression checks")
          PY
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/离线听读_通用PDF-TXT朗读器_1.2.4.apk"
          sha256sum "$GITHUB_WORKSPACE/apk-output/离线听读_通用PDF-TXT朗读器_1.2.3.apk" | tee "$GITHUB_WORKSPACE/apk-output/SHA256.txt"
          python - "$GITHUB_WORKSPACE/apk-output/离线听读_通用PDF-TXT朗读器_1.2.3.apk" <<'PY'
          import sys, zipfile, io
          from PIL import Image
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              matches = [n for n in archive.namelist() if n.endswith("reader_cover.jpg")]
              assert matches, "embedded cover image missing from APK"
              name = matches[0]
              data = archive.read(name)
          with Image.open(io.BytesIO(data)) as image:
              assert image.format == "JPEG" and image.size == (192,192), (image.format,image.size)
              image.verify()
          assert len(data) == 6194, len(data)
          print(f"PASS | APK embeds decodable 192x192 cover: {name} | {len(data)} bytes")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-reader-1.2.4-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 7
