name: Build Independent Offline Reader APK

on:
  push:
    branches:
      - temp/offline-reader-1-1-0-apk-build
    paths:
      - 'offline-reader-src/**'
      - '.github/workflows/build-offline-reader.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="/usr/local/lib/android/sdk"
          test -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Reassemble and prepare the generic reader
        shell: bash
        run: |
          set -euo pipefail
          cat offline-reader-src/part-00.b64 offline-reader-src/part-01-*.b64 offline-reader-src/part-02.b64 offline-reader-src/part-03.b64 offline-reader-src/part-04.b64 offline-reader-src/part-05.b64 > /tmp/offline-reader-src.b64
          base64 --decode /tmp/offline-reader-src.b64 > /tmp/offline-reader-src.tar.gz
          echo "5e4a49e648bf6859509fcdd8dabed9ea3a3ce87e4d47126b8bc6381b9f70dd6f  /tmp/offline-reader-src.tar.gz" | sha256sum --check
          mkdir -p build-source
          tar -xzf /tmp/offline-reader-src.tar.gz -C build-source
          PROJECT="build-source/人生指南安卓离线朗读器"
          MAIN="$PROJECT/app/src/main/java/com/guide/offline/MainActivity.kt"
          grep -q '^import android.view.View$' "$MAIN" || sed -i '/^import android.view.Gravity$/a import android.view.View' "$MAIN"
          grep -q '^import android.graphics.Color$' "$MAIN" || sed -i '/^import android.graphics.Typeface$/a import android.graphics.Color' "$MAIN"
          printf '%s' '{"title":"尚未导入文件","sourceType":"empty","pages":[{"pdfPage":1,"title":"开始阅读","text":"欢迎使用离线听读。\\n\\n点击右上角「导入文件」，从手机本地选择 PDF 或 TXT 文档。\\n\\n导入后即可在这里显示原文、选择手机已下载的离线中文声音并开始朗读。"}],"chapters":[{"label":"开始阅读","start":0}]}' > "$PROJECT/app/src/main/assets/book.json"
          python -c 'import json, pathlib, sys, xml.etree.ElementTree as ET; p=pathlib.Path(sys.argv[1]); m=p/"app/src/main/AndroidManifest.xml"; b=json.loads((p/"app/src/main/assets/book.json").read_text()); ET.parse(m); assert len(b["pages"]) == 1 and "导入文件" in b["pages"][0]["text"]; print("PASS | generic local-import first screen, manifest and book data")' "$PROJECT"

      - name: Compile and verify APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="build-source/人生指南安卓离线朗读器"
          cd "$PROJECT"
          gradle --no-daemon --stacktrace :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.reader.offlinereader' versionName='1.2.0'" /tmp/apk-badging.txt
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/离线听读_通用PDF-TXT朗读器_1.2.0.apk"
          sha256sum "$GITHUB_WORKSPACE/apk-output/离线听读_通用PDF-TXT朗读器_1.2.0.apk" | tee "$GITHUB_WORKSPACE/apk-output/SHA256.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-reader-1.2.0-apk
          path: apk-output/
          if-no-files-found: error
          retention-days: 7
