name: Deploy DWSS 0.9.59 automatic update only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dwss-0959-auto-update-only.yml'
      - 'scripts/fix_dwss_0959_auto_update_only.py'
      - 'scripts/test_dwss_0959_auto_update_only.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dwss-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://yanyao8686-debug.github.io/dwss-kolwezi-swahili/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Fetch verified live DWSS 0.9.58 baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yanyao8686-debug.github.io/dwss-kolwezi-swahili"
          mkdir -p public
          curl -fsSL --retry 6 --retry-delay 2 --max-time 30 "$BASE/VERSION.txt?base=$GITHUB_SHA" -o public/VERSION.txt
          grep -Fq 'Version: 0.9.58' public/VERSION.txt
          for file in index.html boot.js app.js pwa.js sw.js dictionary-overrides.js shared-lexicon.js supabase.min.js dictionary.js.gz manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png favicon-32.png cover.webp cover.jpg COPYRIGHT_AND_LICENSE.txt _headers; do
            curl -fsSL --retry 5 --retry-delay 2 --max-time 60 "$BASE/$file?base=$GITHUB_SHA" -o "public/$file"
            test -s "public/$file"
          done
      - name: Apply 0.9.59 automatic-update-only patch
        run: python3 scripts/fix_dwss_0959_auto_update_only.py
      - name: Syntax, runtime and asset regression tests
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js boot.js pwa.js sw.js shared-lexicon.js dictionary-overrides.js; do node --check "public/$file"; done
          DWSS_TEST_ROOT="$PWD/public" node scripts/test_dwss_0959_auto_update_only.cjs
          python3 - <<'PY'
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          p=Path("public")
          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]; self.refs=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if "id" in a:self.ids.append(a["id"])
                  for key in ("src","href"):
                      value=a.get(key,"")
                      if value and not value.startswith(("https://","http://","data:","#","mailto:")):
                          self.refs.append(value.split("?")[0])
          audit=Audit();audit.feed((p/"index.html").read_text(encoding="utf-8"))
          duplicate={k:v for k,v in Counter(audit.ids).items() if v>1}
          missing=[v for v in audit.refs if not (p/v).exists()]
          if duplicate:raise SystemExit("duplicate HTML IDs: "+str(duplicate))
          if missing:raise SystemExit("missing local assets: "+str(missing))
          if 'checkUpdateBtn' in (p/"index.html").read_text(encoding="utf-8"):
              raise SystemExit("manual update button remains in the HTML")
          (p/".nojekyll").touch()
          print("PASS: unique HTML IDs, no manual check button, all local assets present.")
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy DWSS 0.9.59
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live DWSS 0.9.59 automatic update only
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yanyao8686-debug.github.io/dwss-kolwezi-swahili"
          TMP="$RUNNER_TEMP/dwss-live-0.9.59"
          mkdir -p "$TMP"
          for file in VERSION.txt index.html pwa.js boot.js sw.js; do
            curl -fsSL --retry 8 --retry-delay 3 --max-time 30 "$BASE/$file?verify=$GITHUB_SHA" -o "$TMP/$file"
          done
          grep -Fq 'Version: 0.9.59' "$TMP/VERSION.txt"
          grep -Fq 'DWSS_AUTO_UPDATE_0_9_59' "$TMP/index.html"
          ! grep -Fq 'checkUpdateBtn' "$TMP/index.html"
          ! grep -Fq 'checkUpdateBtn' "$TMP/pwa.js"
          grep -Fq 'id="pwaState"' "$TMP/index.html"
          grep -Fq 'await registration.update();' "$TMP/pwa.js"
          grep -Fq "window.addEventListener('online'" "$TMP/pwa.js"
          grep -Fq "document.addEventListener('visibilitychange'" "$TMP/pwa.js"
          grep -Fq "window.addEventListener('focus'" "$TMP/pwa.js"
          grep -Fq 'preserveDraftBeforeReload();' "$TMP/pwa.js"
          grep -Fq "const APP_VERSION = '0.9.59';" "$TMP/sw.js"
          ! grep -Fq '检查更新' "$TMP/boot.js"
          echo 'PASS: live 0.9.59 has automatic update triggers and no manual check action.'
